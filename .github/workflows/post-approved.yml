name: Post approved videos
on:
  schedule:
    - cron: "*/30 * * * *"   # check Telegram taps every 30 min
  workflow_dispatch:

permissions:
  contents: write
  actions: read     # download the video artifact

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Read approvals and schedule posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$ZERNIO_API_KEY" ]; then echo "not configured yet"; exit 0; fi
          python -u -m bot.poster
      - name: Save state
        if: always()
        run: |
          git config user.name "theaitoolfinds-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data/telegram.json data/pending.json data/posted.json; do
            [ -e "$f" ] && git add -f "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -qm "poster state [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
