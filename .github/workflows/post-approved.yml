name: Post approved videos
on:
  schedule:
    - cron: "*/30 * * * *"   # check Telegram taps every 30 min
  workflow_dispatch:
    inputs:
      now:
        description: "Post approved videos right away (not at the next slot)"
        default: "false"
      update:
        description: "Telegram update (base64), sent by the Cloudflare worker"
        default: ""
      autodm:
        description: "One-off: '<zernio post id> <videos folder>' -> turn on auto-DM"
        default: ""

permissions:
  contents: write
  actions: write    # download video artifacts + start a video job for a picked tool

# Every Telegram tap is first saved to data/tg_queue/ by its own job (never cancelled), then ONE serialized
# "post" job works through the whole queue. GitHub keeps only one pending run per concurrency group and cancels
# the rest, so putting the concurrency on the whole run used to drop taps when Jan tapped several videos quickly.
jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Save the Telegram update to the queue
        env:
          TG_UPDATE: ${{ github.event.inputs.update }}
        run: |
          [ -z "$TG_UPDATE" ] && exit 0
          mkdir -p data/tg_queue
          f="data/tg_queue/$(date -u +%s%N)-${GITHUB_RUN_ID}.b64"
          printf '%s' "$TG_UPDATE" > "$f"
          git config user.name "theaitoolfinds-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f "$f" && git commit -qm "tg queue [skip ci]"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1

  post:
    needs: enqueue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: poster
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Get the latest queue
        run: git pull -q origin main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Read approvals and schedule posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_NOW: ${{ github.event.inputs.now || 'false' }}
          AUTODM: ${{ github.event.inputs.autodm }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$ZERNIO_API_KEY" ]; then echo "not configured yet"; exit 0; fi
          if [ "$AUTODM" = "debug" ]; then python -u -m bot.autodm_debug; exit 0; fi
          if [ "$AUTODM" = "patch" ]; then AUTODM_PATCH=1 python -u -m bot.autodm_debug; exit 0; fi
          if [ "$AUTODM" = "fix" ]; then AUTODM_FIX=1 python -u -m bot.autodm_debug; exit 0; fi
          if [ -n "$AUTODM" ]; then git fetch -q origin +videos:refs/remotes/origin/videos && git worktree add -q ../vb origin/videos && python -u -m bot.autodm_once $AUTODM ../vb; exit $?; fi
          python -u -m bot.poster
      - name: Save state
        if: always()
        run: |
          git config user.name "theaitoolfinds-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data/telegram.json data/pending.json data/posted.json data/picks.json logs/autodm.log; do
            [ -e "$f" ] && git add -f "$f"
          done
          git add -A data/tg_queue 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "poster state [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
