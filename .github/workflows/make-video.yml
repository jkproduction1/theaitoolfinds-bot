name: Make AI tool video

on:
  # 2 videos per day (times are UTC -> 07:23 and 15:23 Prague summer time)
  schedule:
    - cron: "23 5 * * *"
    - cron: "23 13 * * *"
  # "Run workflow" button in the Actions tab
  workflow_dispatch:
    inputs:
      url:
        description: "Optional: make a video about this exact tool URL"
        required: false
      count:
        description: "How many videos"
        default: "1"

permissions:
  contents: write   # save history.json back to the repo

concurrency:
  group: make-video
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + Python packages + browser
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Make video
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          IN_URL: ${{ github.event.inputs.url }}
          IN_COUNT: ${{ github.event.inputs.count || '1' }}
        run: |
          set -o pipefail
          mkdir -p logs
          if [ -n "$IN_URL" ]; then
            python -u -m bot.main --count "$IN_COUNT" --url "$IN_URL" 2>&1 | tee logs/last_run.log
          else
            python -u -m bot.main --count "$IN_COUNT" 2>&1 | tee logs/last_run.log
          fi

      - name: Upload video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: out/
          retention-days: 30

      - name: Publish video to "videos" branch (easy to download on GitHub)
        if: success()
        run: |
          git config user.name "theaitoolfinds-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin videos || true
          git worktree add -B videos ../vb origin/videos 2>/dev/null || (git worktree add --detach ../vb && cd ../vb && git checkout --orphan videos && git rm -rfq . || true)
          cp -r out/* ../vb/
          cd ../vb && git add -A && git commit -qm "new video" && git push -q origin videos

      - name: Save history + log
        if: always()
        run: |
          git config user.name "theaitoolfinds-bot"
          git config user.email "bot@users.noreply.github.com"
          tail -n 300 logs/last_run.log > logs/tmp.log 2>/dev/null && mv logs/tmp.log logs/last_run.log || true
          git add data/ logs/ || true
          git diff --cached --quiet || (git commit -m "history: new video [skip ci]" && git push)
