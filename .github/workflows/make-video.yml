name: Make AI tool video

on:
  # 2 videos per day (times are UTC -> 07:23 and 15:23 Prague summer time)
  schedule:
    - cron: "23 5 * * *"
    - cron: "23 13 * * *"
  # "Run workflow" button in the Actions tab
  workflow_dispatch:
    inputs:
      url:
        description: "Optional: make a video about this exact tool URL"
        required: false
      count:
        description: "How many videos"
        default: "1"

permissions:
  contents: write   # save history.json back to the repo

concurrency:
  group: make-video
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-v1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install ffmpeg + Python packages + browsers + Remotion
        run: |
          set -o pipefail
          mkdir -p logs
          {
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
            pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            pip install -q -r requirements.txt
            python -m playwright install --with-deps chromium
            cd video && npm ci --no-audit --no-fund && npx remotion browser ensure
          } 2>&1 | tail -n 80 > logs/install.log

      - name: Make video
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IN_URL: ${{ github.event.inputs.url }}
          IN_COUNT: ${{ github.event.inputs.count || '1' }}
        run: |
          set -o pipefail
          mkdir -p logs
          if [ -n "$IN_URL" ]; then
            python -u -m bot.main --count "$IN_COUNT" --url "$IN_URL" 2>&1 | tee logs/last_run.log
          else
            python -u -m bot.main --count "$IN_COUNT" 2>&1 | tee logs/last_run.log
          fi

      - name: Upload video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: out/
          retention-days: 30

      - name: Publish video to "videos" branch (easy to download on GitHub)
        if: success()
        run: |
          git config user.name "theaitoolfinds-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin videos || true
          git worktree add -B videos ../vb origin/videos 2>/dev/null || (git worktree add --detach ../vb && cd ../vb && git checkout --orphan videos && git rm -rfq . || true)
          cp -r out/* ../vb/
          cd ../vb && git add -A && git commit -qm "new video" && git push -q origin videos

      - name: Save history + log
        if: always()
        run: |
          git config user.name "theaitoolfinds-bot"
          git config user.email "bot@users.noreply.github.com"
          tail -n 300 logs/last_run.log > /tmp/l.log 2>/dev/null && cp /tmp/l.log logs/last_run.log || true
          for f in data/history.json data/queue.txt data/telegram.json data/pending.json logs/last_run.log logs/install.log; do
            [ -e "$f" ] && git add -f "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -qm "history: new video [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "could not push history"; exit 1
