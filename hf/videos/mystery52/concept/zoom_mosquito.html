function wing(sh,al){g.save();g.translate(-196,-338);g.rotate(-.075+sh);const wg=g.createLinearGradient(0,-30,-420,30);wg.addColorStop(0,'rgba(200,232,255,'+(.42*al)+')');wg.addColorStop(1,'rgba(150,200,255,'+(.2*al)+')');

const HR=R0(31),HAIR=[...Array(9)].map((_,i)=>({x:-170+i*150+(HR()-.5)*60+(i>1?90:0),h:70+HR()*60,l:(HR()-.5)*90,ph:HR()*6}));

// ---------- scene B: skin cross-section (micro units = px at 16x; origin = puncture point; y down) ----------

const SIG=300, LTOT=520;

function needlePts(t,q,beta){ // from tip up to far above the skin

function sceneB(t){const q=.03+.97*EIO((t-2.3)/1.4), beta=EIO((t-2.7)/.85), bl=EIO((t-3.7)/.9), bp=EIO((t-4.5)/1.4);BUMP=215*bp;
