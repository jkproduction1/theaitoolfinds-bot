<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'DM Serif Display';src:url(dm-serif-display-latin-400-normal.woff2)}
@font-face{font-family:'EB Garamond';font-weight:500;font-style:italic;src:url(eb-garamond-latin-500-italic.woff2)}
@font-face{font-family:'Permanent Marker';src:url(permanent-marker-latin-400-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block}</style><script src="common.js"></script></head><body><canvas id="c" width="1080" height="1920"></canvas><script id="main" type="text/plain">
// styles37 concept: /paper-collage why the Dead Sea is disappearing (Vox-like paper collage look of styles19/28/33; own map drawing,
// simplified shape, no copied map). Facts (USGS/EcoPeace/GSI, BBC, Britannica): the surface drops about 1 m a year; most of the
// Jordan River's water is taken upstream for farms and cities; mineral evaporation ponds in the south basin add to the loss;
// thousands of sinkholes (6,000+) have opened along the retreating shore. Shapes are schematic.
const g=document.getElementById('c').getContext('2d'), MK="'Permanent Marker',cursive";
const DX=140;
const TODAY=[[520,700],[600,720],[640,820],[650,950],[640,1100],[610,1230],[560,1300],[500,1290],[470,1200],[450,1050],[455,900],[470,780]].map(([x,y])=>[x+DX,y]);
const OLD=[[500,640],[620,660],[690,800],[705,980],[695,1150],[682,1300],[702,1450],[684,1600],[600,1668],[520,1648],[466,1520],[448,1380],[418,1220],[398,1050],[402,880],[428,730]].map(([x,y])=>[x+DX,y]);
function smooth(p,pts){const n=pts.length;p.beginPath();const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let s=m(pts[n-1],pts[0]);p.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const q=m(pts[i],pts[(i+1)%n]);p.quadraticCurveTo(pts[i][0],pts[i][1],q[0],q[1]);}p.closePath();}
const paper=off(1080,1920,(p,w,h)=>{p.fillStyle='#efe6d2';p.fillRect(0,0,w,h);const R=R0(4);
  for(let i=0;i<9000;i++){p.strokeStyle='rgba(120,95,60,'+(R()*.08)+')';p.lineWidth=1;const x=R()*w,y=R()*h,a=R()*6.28,l=4+R()*14;p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);p.stroke();}
  p.strokeStyle='rgba(90,120,150,.10)';p.lineWidth=2;for(let x=0;x<w;x+=60){p.beginPath();p.moveTo(x,0);p.lineTo(x,h);p.stroke();}for(let y=0;y<h;y+=60){p.beginPath();p.moveTo(0,y);p.lineTo(w,y);p.stroke();}});
// desert land: big torn paper pieces with halftone shading
const land=off(1080,1920,(p)=>{[[ -40,470,700,1500,'#e2c991',11,-0.02],[520,500,620,1460,'#d7b77c',12,0.015],[180,1500,940,420,'#cfa96e',13,0]].forEach(([x,y,w,h,c,s,r])=>{p.save();p.translate(x+w/2,y+h/2);p.rotate(r);tornPath(p,-w/2,-h/2,w,h,s,14);p.fillStyle=c;p.shadowColor='rgba(60,40,20,.3)';p.shadowBlur=16;p.shadowOffsetY=8;p.fill();p.restore();});
  p.save();p.globalCompositeOperation='source-atop';for(let y=480;y<1920;y+=12)for(let x=(y/12%2)*6;x<1080;x+=12){const d=CL(0.5+0.5*Math.sin(x*.004+y*.003)*Math.cos(y*.005));p.fillStyle='rgba(120,80,40,.22)';p.beginPath();p.arc(x,y,0.6+3*d,0,7);p.fill();}p.restore();});
// today's sea: turquoise cut-out with halftone + sticker edge
const SEA=(()=>{const c=off(1080,1920,(p)=>{smooth(p,TODAY);const gr=p.createLinearGradient(0,700,0,1300);gr.addColorStop(0,'#3fb6c4');gr.addColorStop(1,'#1f8ea3');p.fillStyle=gr;p.fill();
  p.save();smooth(p,TODAY);p.clip();for(let y=690;y<1310;y+=10)for(let x=(y/10%2)*5+580;x<800;x+=10){p.fillStyle='rgba(255,255,255,.35)';p.beginPath();p.arc(x,y,1.2+1.8*CL((x-600)/200),0,7);p.fill();}
  p.strokeStyle='rgba(255,255,255,.55)';p.lineWidth=5;for(let i=0;i<5;i++){p.beginPath();p.moveTo(620+i*25,820+i*90);p.quadraticCurveTo(660+i*25,800+i*90,700+i*20,825+i*90);p.stroke();}p.restore();});return sticker(c,9);})();
// salt crust ring between the old and new shore
const SALT=off(1080,1920,(p)=>{smooth(p,OLD);p.fillStyle='#f6f3ea';p.fill();const R=R0(9);p.save();smooth(p,OLD);p.clip();for(let i=0;i<2600;i++){p.fillStyle=R()<.5?'rgba(200,190,170,.5)':'rgba(255,255,255,.8)';p.beginPath();p.arc(500+R()*400,630+R()*1050,1+R()*4,0,7);p.fill();}p.restore();});
function ponds(){g.save();const cols=['#9fe1dc','#7fd3d6','#b8ece4','#6cc4cc'];let k=0;for(let r=0;r<3;r++)for(let c=0;c<2;c++){const x=630+c*100+(r%2)*10,y=1390+r*82;g.save();g.translate(x,y);g.rotate((k%3-1)*0.02);g.fillStyle=cols[k%4];g.shadowColor='rgba(40,60,70,.3)';g.shadowBlur=8;g.shadowOffsetY=4;g.fillRect(0,0,92,72);g.shadowColor='transparent';g.strokeStyle='#f6f3ea';g.lineWidth=5;g.strokeRect(0,0,92,72);g.restore();k++;}g.restore();}
function sinkholes(){const P=[[598,960,26],[586,1040,18],[602,1110,30],[575,1180,16],[612,1250,22],[562,900,14],[620,1330,18]];P.forEach(([x,y,r],i)=>{g.save();g.fillStyle='#2b2018';g.beginPath();blobPath(g,x,y,r,i+3,0.15,30,0);g.fill();g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=3;g.stroke();g.restore();});}
function title(){g.save();g.translate(60,140);g.rotate(-0.015);const W=960,H=260;tornPath(g,0,0,W,H,21,8);g.fillStyle='#fbf8f0';g.shadowColor='rgba(30,20,10,.4)';g.shadowBlur=20;g.shadowOffsetY=10;g.fill();g.shadowColor='transparent';
  g.fillStyle='#17222b';g.font='400 96px '+DISP;g.fillText('The Dead Sea drops',44,108);
  g.font='400 96px '+DISP;const a='1 meter';const wa=g.measureText(a).width;g.fillStyle='rgba(255,214,0,.92)';g.beginPath();g.moveTo(36,150);g.lineTo(60+wa,144);g.lineTo(62+wa,232);g.lineTo(36,226);g.closePath();g.fill();
  g.fillStyle='#17222b';g.fillText(a+' every year',44,212);
  g.fillStyle='rgba(240,232,200,.85)';g.save();g.translate(W-60,-6);g.rotate(0.5);g.fillRect(-56,-16,112,34);g.restore();g.restore();}
function hand(t,x,y,col,size,rot){g.save();g.translate(x,y);g.rotate(rot||0);g.font=(size||52)+'px '+MK;g.fillStyle=col;g.fillText(t,0,0);g.restore();}
function draw(lt){g.drawImage(paper,0,0);g.drawImage(land,0,0);g.drawImage(SALT,0,0);
  // 1960 shoreline
  g.save();g.setLineDash([22,16]);g.strokeStyle='#1b2a3a';g.lineWidth=7;g.lineCap='round';smooth(g,OLD);g.stroke();g.restore();
  ponds();g.drawImage(SEA,-SEA.ox,-SEA.oy);sinkholes();
  // Jordan River coming in from the north, mostly pumped away
  marker(g,[[720,470],[690,520],[730,580],[690,640],[706,700]],1,16,'#2a7fb8');
  [[[712,540],[800,500],[880,520]],[[700,610],[650,540],[600,490]]].forEach((pts)=>{const [x,y,a]=marker(g,pts,1,9,'#d7262e');arrowHead(g,x,y,a,26,9,'#d7262e');});
  title();
  hand('1960',860,700,'#1b2a3a',58,-0.05);hand('today',862,1010,'#0f6f86',54,-0.04);
  // big red "-1 m / year" call-out with down arrow
  hand('−1 m',870,1170,'#d7262e',72,-0.06);hand('a year',872,1236,'#d7262e',50,-0.06);
  {const [x,y,a]=marker(g,[[930,1270],[924,1350],[932,1420]],1,10,'#d7262e');arrowHead(g,x,y,a,30,10,'#d7262e');}
  paperTag(g,10,0,30,520,-0.025,'Jordan River','mostly pumped away upstream',31,0);
  paperTag(g,10,0,30,1040,0.02,'6,000+ sinkholes','opening on the old shore',32,1);
  paperTag(g,10,0,30,1470,-0.015,'Mineral ponds','evaporate even more',33,0);
  {const [x,y,a]=marker(g,[[540,1560],[580,1530],[615,1490]],1,8,'#17222b');arrowHead(g,x,y,a,22,8,'#17222b');}
  g.drawImage(GRAIN,0,0);}
window.DUR=6;window.draw=draw;draw(2);document.title='ok';
</script><script>Promise.all([document.fonts.load("400 40px 'DM Serif Display'"),document.fonts.load("italic 500 30px 'EB Garamond'"),document.fonts.load("40px 'Permanent Marker'")]).then(()=>{const s=document.createElement('script');s.textContent=document.getElementById('main').textContent;document.body.appendChild(s);});</script></body></html>
