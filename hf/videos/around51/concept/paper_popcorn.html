    const dj=jit(lt,9,0.8);
    if(st>0){g.save();g.translate(0,WY);const R=34+56*st;g.fillStyle='rgba(233,244,250,.96)';const N=6;for(let i=0;i<N;i++){const a=i/N*6.283+STEP(lt)*0.9,r=R*0.48;g.beginPath();g.arc(Math.cos(a)*r+dj[0],Math.sin(a)*r+dj[1],R*0.52,0,7);g.fill();}
      g.beginPath();g.arc(0,0,R*0.6,0,7);g.fill();g.fillStyle='rgba(150,195,225,.5)';for(let i=0;i<N;i++){const a=i/N*6.283+STEP(lt)*0.9+.5,r=R*0.3;g.beginPath();g.arc(Math.cos(a)*r,Math.sin(a)*r,R*0.11,0,7);g.fill();}
