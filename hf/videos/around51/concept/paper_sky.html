// around51 r1: /paper-collage why the sky is blue but sunsets are red. Everything drawn in code (no photos, no logos).
// Facts (NASA Space Place, "Why Is the Sky Blue?", https://spaceplace.nasa.gov/blue-sky/en/, checked 2026-11-17):
//  "Blue light is scattered in all directions by the tiny molecules of air in Earth's atmosphere."
//  "Blue is scattered more than other colors because it travels as shorter, smaller waves."      -> label "blue light scatters the most"
