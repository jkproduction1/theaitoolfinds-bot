<!doctype html><html><head><meta charset="utf-8"><style>

html,body{margin:0;background:#000}canvas{display:block}</style><script src="common.js"></script></head><body><canvas id="c" width="1080" height="1920"></canvas><script id="main" type="text/plain">
// styles62 r1: /paper-collage how the Panama Canal lifts ships. Generic cross-section drawn in code (no photo, no logo; stylised 2 steps).
// Facts: the locks lift ships 26 m (85 ft) from sea level up to Gatun Lake; the chambers are filled by gravity with water from the lake
// through culverts - no pumps (Panama Canal Authority "This is the Canal" pancanal.com; Britannica "Panama Canal: Locks").
const g=document.getElementById('c').getContext('2d'), MK="'Permanent Marker',cursive";
function jit(t,seed,a){const R=R0(1+seed*131+Math.floor(t*12)*977);R();return [(R()-.5)*2*a,(R()-.5)*2*a,(R()-.5)*0.006*a];}
const BG=off(1080,1920,(p,w,h)=>{p.fillStyle='#ece3cf';p.fillRect(0,0,w,h);const R=R0(4);
  for(let i=0;i<9000;i++){p.strokeStyle='rgba(120,95,60,'+(R()*.08)+')';p.lineWidth=1;const x=R()*w,y=R()*h,a=R()*6.28,l=4+R()*14;p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);p.stroke();}
  p.fillStyle='rgba(60,50,40,.10)';for(let c=0;c<4;c++)for(let y=30;y<h;y+=22){const x0=30+c*262,L=(R()<.08)?60+R()*100:210+R()*30;p.fillRect(x0,y,L,7);}});
const SKY=off(1900,1250,(p,w,h)=>{p.save();p.translate(20,20);tornPath(p,0,0,w-40,h-40,5,14);const sk=p.createLinearGradient(0,0,0,h);sk.addColorStop(0,'#86b9cf');sk.addColorStop(1,'#e9dcc0');
  p.shadowColor='rgba(60,40,20,.35)';p.shadowBlur=16;p.shadowOffsetY=8;p.fillStyle=sk;p.fill();p.shadowColor='transparent';p.clip();
  for(let y=0;y<h;y+=12)for(let x=(y/12%2)*6;x<w;x+=12){p.fillStyle='rgba(20,60,90,.13)';p.beginPath();p.arc(x,y,0.5+2.6*(1-y/h),0,7);p.fill();}p.restore();});
function cloud(seed,w){return sticker(off(w,w*0.42,(p)=>{const R=R0(seed);p.fillStyle='#fbf8f0';for(let i=0;i<6;i++){const x=w*(0.18+0.64*i/5),r=w*(0.12+R()*0.08);p.beginPath();p.arc(x,w*0.42-r*0.9-R()*w*0.05,r,0,7);p.fill();}
  p.fillRect(w*0.1,w*0.3,w*0.8,w*0.12);}),5);}
const C1=cloud(11,280),C2=cloud(23,200);
const SEA=off(1400,520,(p,w,h)=>{p.save();tornPath(p,10,10,w-20,h-20,9,12);p.shadowColor='rgba(40,30,20,.4)';p.shadowBlur=14;p.shadowOffsetY=-4;p.fillStyle='#4f7f96';p.fill();p.shadowColor='transparent';p.clip();
  for(let y=20;y<h;y+=10)for(let x=(y/10%2)*5;x<w;x+=10){p.fillStyle='rgba(10,40,60,.22)';p.beginPath();p.arc(x,y,1.8,0,7);p.fill();}
  p.strokeStyle='rgba(240,248,250,.55)';p.lineWidth=4;p.lineCap='round';const R=R0(6);for(let i=0;i<40;i++){const x=R()*w,y=30+R()*(h-60);p.beginPath();p.moveTo(x,y);p.quadraticCurveTo(x+20,y-8,x+44,y);p.stroke();}p.restore();});
function tag(lt,t0,x,y,rot,W,lines,seed,side){ if(lt<t0) return; const a=EBK((lt-t0)/0.45);
  let H=30; lines.forEach(L=>{L._y=H+L.s*0.8;H+=L.s*1.05;}); H+=18; const j=jit(lt,seed,1.2);
  g.save(); g.translate(x+W/2+j[0],y+H/2+j[1]); g.rotate(rot+j[2]+(1-a)*0.25); g.scale(0.4+0.6*a,0.4+0.6*a); g.globalAlpha=CL((lt-t0)/0.12)*(lines.out?1-CL((lt-lines.out)/.3):1); g.translate(-W/2,-H/2);
  tornPath(g,0,0,W,H,seed,7); g.fillStyle='#f6f1e4'; g.shadowColor='rgba(30,20,10,.4)'; g.shadowBlur=18; g.shadowOffsetY=10; g.fill(); g.shadowColor='transparent';
  lines.forEach(L=>{ g.save(); g.font=L.f; const w=g.measureText(L.t).width;
    if(L.hl!=null){const hl=EIO((lt-t0-L.hl)/0.4); if(hl>0){ g.fillStyle=L.hc||'rgba(255,214,0,.9)'; g.beginPath(); g.moveTo(24,L._y-L.s*0.78); g.lineTo(24+(w+24)*hl,L._y-L.s*0.84); g.lineTo(24+(w+24)*hl,L._y+L.s*0.22); g.lineTo(24,L._y+L.s*0.2); g.closePath(); g.fill(); }}
    g.fillStyle=L.c; g.fillText(L.t,36,L._y); g.restore(); });
  g.fillStyle='rgba(240,232,200,.85)'; g.save(); g.translate(side?W-30:30,-4); g.rotate(side?0.5:-0.5); g.fillRect(-46,-14,92,30); g.restore(); g.restore(); }

const Y0=1300,Y1=1150,Y2=1000, X1=280,X2=560,X3=840;
const FL=[1480,1440,1300,1180];
const GROUND=sticker(off(1700,1000,(p)=>{p.translate(150,-900);p.fillStyle='#c9a876';p.beginPath();p.moveTo(-150,FL[0]);p.lineTo(X1,FL[0]);p.lineTo(X1,FL[1]);p.lineTo(X2,FL[1]);p.lineTo(X2,FL[2]);p.lineTo(X3,FL[2]);p.lineTo(X3,FL[3]);p.lineTo(1550,FL[3]);p.lineTo(1550,1900);p.lineTo(-150,1900);p.closePath();p.fill();
  p.globalCompositeOperation='source-atop';for(let y=900;y<1900;y+=9)for(let x=((y/9)%2)*4-150;x<1550;x+=9){p.fillStyle='rgba(110,70,35,.16)';p.beginPath();p.arc(x,y,1.4,0,7);p.fill();}
  
  // culvert pipe inside the walls
  p.fillStyle='#6d5638';p.fillRect(X1+40,FL[1]+12,X3+140-X1-40,22);p.fillRect(X3+120,FL[3]+10,26,FL[1]-FL[3]+24);
}),5);
const HILL=sticker(off(700,360,(p)=>{p.fillStyle='#6f8f4f';p.beginPath();p.moveTo(0,360);p.quadraticCurveTo(160,40,330,140);p.quadraticCurveTo(470,10,700,200);p.lineTo(700,360);p.closePath();p.fill();
  p.globalCompositeOperation='source-atop';for(let y=0;y<360;y+=9)for(let x=((y/9)%2)*4;x<700;x+=9){p.fillStyle='rgba(30,50,20,.2)';p.beginPath();p.arc(x,y,1.5,0,7);p.fill();}
  const R=R0(8);for(let i=0;i<26;i++){const x=40+R()*620,y=150+R()*180;p.fillStyle='#4f7238';p.beginPath();p.arc(x,y,14+R()*14,0,7);p.fill();}}),5);
const SHIP=sticker(off(250,140,(p)=>{p.fillStyle='#2c3440';p.beginPath();p.moveTo(0,70);p.lineTo(250,70);p.lineTo(228,128);p.lineTo(18,128);p.closePath();p.fill();p.fillStyle='#b8341f';p.fillRect(14,106,222,22);
  const C=['#d9662f','#2f6f8f','#e3b23c','#5c8a4e','#b8341f'];for(let r=0;r<2;r++)for(let c=0;c<6;c++){p.fillStyle=C[(r*3+c)%5];p.fillRect(26+c*30,40-r*28,28,28);p.strokeStyle='rgba(0,0,0,.25)';p.lineWidth=2;p.strokeRect(26+c*30,40-r*28,28,28);}
  p.fillStyle='#f3efe4';p.fillRect(205,8,32,62);p.fillStyle='#2c3440';p.fillRect(208,16,26,8);p.fillStyle='#2c3440';p.fillRect(214,0,10,10);}),5);
function water(x0,x1,top,bot,lt,seed){g.save();tornPath(g,x0,top,x1-x0,bot-top,seed,5);g.fillStyle='#4f7f96';g.fill();g.clip();
  for(let y=top;y<bot;y+=10)for(let x=x0+((y/10)%2)*5;x<x1;x+=10){g.fillStyle='rgba(10,40,60,.22)';g.beginPath();g.arc(x,y,1.8,0,7);g.fill();}
  g.strokeStyle='rgba(240,248,250,.6)';g.lineWidth=4;g.lineCap='round';const R=R0(seed);for(let i=0;i<(x1-x0)/60;i++){const x=x0+R()*(x1-x0)+Math.sin(lt*2+i)*8,y=top+14+R()*40;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+16,y-6,x+34,y);g.stroke();}g.restore();}
function gate(x,floor,open,lt){const h=(floor-960)*(1-EIO(open));if(h<2)return;const j=jit(lt,x,1);g.save();g.translate(j[0],j[1]);g.fillStyle='#3d4a55';g.fillRect(x-11,floor-h,22,h);g.strokeStyle='#fbfaf5';g.lineWidth=4;g.strokeRect(x-11,floor-h,22,h);g.fillStyle='#e3b23c';g.fillRect(x-11,floor-h,22,12);g.restore();}
function flow(x0,x1,yA,yB,lt,a){if(a<=0)return;g.save();g.globalAlpha=a;const pts=[[x1,yB-30],[x1,yA+6],[(x0+x1)/2,yA+6],[x0,yA+6],[x0,yA-50]];
  const e=marker(g,pts,1,10,'#fbfaf5',[26,22]);g.restore();g.save();g.globalAlpha=a;g.lineDashOffset=0;const ph=(lt*1.6)%1;const M=pts.length-1;
  for(let q=0;q<3;q++){const f=(ph+q/3)%1,s=f*M,k=Math.min(M-1,Math.floor(s)),u=s-k;const x=LERP(pts[k][0],pts[k+1][0],u),y=LERP(pts[k][1],pts[k+1][1],u);g.fillStyle='#9cc8de';g.strokeStyle='#fbfaf5';g.lineWidth=4;g.beginPath();g.arc(x,y,13,0,7);g.fill();g.stroke();}g.restore();}
const LERP=(a,b,t)=>a+(b-a)*t;
function draw(lt){g.setTransform(1,0,0,1,0,0);g.drawImage(BG,0,0);
  const f1=EIO((lt-0.45)/1.7), op2=EIO((lt-2.25)/.45), mv1=EIO((lt-2.6)/1.0), cl2=EIO((lt-3.55)/.3), f2=EIO((lt-3.75)/1.35), op3=EIO((lt-5.1)/.45), mv2=EIO((lt-5.45)/1.1);
  const L1=LERP(Y0,Y1,f1), L2=LERP(Y1,Y2,f2);
  const shipX=430+270*mv1+300*mv2, shipY=(mv1<.5?L1:L2)-96-(mv1<.5?0:0);
  const s=1.42+0.06*EIO(lt/6.3),fx=330+0.72*shipX+Math.sin(lt*.8)*6,fy=1060-30*EIO(lt/6.3)+Math.cos(lt*.6)*6;
  g.save();g.translate(540,1000);g.scale(s,s);g.translate(-fx,-fy);
  g.drawImage(SKY,-300,200);
  {let j=jit(lt,1,1.5);g.drawImage(C1,900-lt*12+j[0],560+j[1]);j=jit(lt,2,1.5);g.drawImage(C2,330+lt*10+j[0],640+j[1]);}
  {const j=jit(lt,5,1);g.drawImage(HILL,X3+40-HILL.ox+j[0],Y2-330-HILL.oy+j[1]);}
  // waters (behind the ground sticker walls)
  water(-200,X1,Y0,1700,lt,3); water(X1,X2,L1,1700,lt,4); water(X2,X3,L2,1700,lt,5); water(X3,1700,Y2,1700,lt,6);
  {const j=jit(lt,9,.8);g.drawImage(GROUND,-150-GROUND.ox+j[0],900-GROUND.oy+j[1]);}
  gate(X1,FL[0],0,lt); gate(X2,FL[1],op2*(1-cl2),lt); gate(X3,FL[2],op3,lt);
  // culvert flow (lake -> chamber)
  flow(430,X3+133,FL[1]+23,Y2,lt,CL((lt-.45)/.25)*(1-CL((lt-2.15)/.3)));
  flow(700,X3+133,FL[1]+23,Y2,lt,CL((lt-3.75)/.25)*(1-CL((lt-5.05)/.3)));
  // ship
  {const j=jit(lt,7,1);const bob=Math.sin(lt*2.4)*3;g.save();g.translate(shipX-125+j[0],shipY+bob+j[1]);g.rotate(j[2]+Math.sin(lt*1.7)*.012);g.drawImage(SHIP,-SHIP.ox,-SHIP.oy);g.restore();}
  // height marker
  const hk=CL((lt-4.9)/.6);if(hk>0){g.save();g.setLineDash([12,12]);g.strokeStyle='rgba(179,38,30,.7)';g.lineWidth=4;g.beginPath();g.moveTo(X2+20,Y0);g.lineTo(X3+500,Y0);g.moveTo(X2+20,Y2);g.lineTo(X3+500,Y2);g.stroke();g.setLineDash([]);const e=marker(g,[[X3+330,Y0-8],[X3+330,LERP(Y0-8,Y2+12,hk)]],1,9,'#b3261e');if(hk>.9)arrowHead(g,e[0],e[1],-Math.PI/2,24,9,'#b3261e');g.restore();}
  g.restore();
  tag(lt,0.15,70,420,-0.03,300,Object.assign([{t:'Sea level',f:"400 58px "+DISP,s:58,c:'#17222b'}],{out:4.7}),21,0);
  tag(lt,0.6,560,330,0.025,450,[{t:'Lake water',f:"400 64px "+DISP,s:64,c:'#17222b'},{t:'flows down',f:"400 64px "+DISP,s:64,c:'#17222b',hl:0.3,hc:'rgba(120,190,220,.9)'}],12,1);
  tag(lt,1.5,90,560,-0.02,470,Object.assign([{t:'No pumps,',f:"400 64px "+DISP,s:64,c:'#17222b'},{t:'just gravity',f:"400 64px "+DISP,s:64,c:'#17222b',hl:0.3,hc:'rgba(255,214,0,.9)'}],{out:4.75}),17,0);
  tag(lt,4.95,90,430,-0.02,440,[{t:'+26 m',f:"62px "+MK,s:62,c:'#b3261e'},{t:'85 ft up to the lake',f:"italic 500 40px "+SERIF,s:40,c:'#4c4338'}],33,1);
  g.drawImage(GRAIN,0,0);}
window.DUR=6.3;window.draw=draw;draw(5.5);document.title='ok';
</script><script>Promise.all([document.fonts.load("400 40px 'DM Serif Display'"),document.fonts.load("italic 500 30px 'EB Garamond'"),document.fonts.load("40px 'Permanent Marker'")]).then(()=>{const s=document.createElement('script');s.textContent=document.getElementById('main').textContent;document.body.appendChild(s);});</script></body></html>
