<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Biggest dinosaur vs you</title>
<style>
  :root{--accent:#ff6a3d;--ink:#fff7ef;}
  body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#1b1d33;font-family:"Inter",system-ui,Arial,sans-serif}
  canvas{position:absolute;inset:0;display:block}
  #ov{position:absolute;inset:0;pointer-events:none}
  #ov svg{position:absolute;inset:0}
  .hl{position:absolute;left:70px;right:70px;top:170px;text-align:center;color:var(--ink);font-weight:900;font-size:76px;line-height:1.12;letter-spacing:-1.5px;text-shadow:0 4px 24px rgba(20,10,30,.45)}
  .hl .key{display:inline-block;background:var(--accent);color:#1a0e08;padding:0 22px 6px;border-radius:14px;transform:rotate(-2deg);margin-left:6px}
  .kick{position:absolute;left:0;right:0;top:110px;text-align:center;color:rgba(255,240,228,.85);font:700 30px "JetBrains Mono","DejaVu Sans Mono",monospace;letter-spacing:6px}
  .pill{position:absolute;transform:translate(-50%,-50%);background:rgba(18,16,30,.72);border:2px solid rgba(255,255,255,.14);border-radius:18px;padding:12px 24px 14px;color:#fff;text-align:center;white-space:nowrap;backdrop-filter:blur(6px)}
  .pill b{display:block;font-weight:800;font-size:40px;letter-spacing:-.5px}
  .pill i{display:block;font-style:normal;font:600 26px "DejaVu Sans Mono",monospace;color:var(--accent);margin-top:4px}
  .note{position:absolute;left:70px;right:70px;top:400px;text-align:center;color:rgba(255,236,220,.8);font:600 26px "DejaVu Sans Mono",monospace}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./"}}</script>
</head>
<body>
<div id="stage">
  <div id="ov">
    <svg id="lines" width="1080" height="1920"></svg>
        <div class="hl">The biggest dinosaur<br>vs. <span class="key">you</span></div>
    <div class="pill" id="pDino"><b>Argentinosaurus</b><i>~35 m long (estimate)</i></div>
    <div class="pill" id="pBus"><b>City bus</b><i>12 m</i></div>
    <div class="pill" id="pYou"><b>You</b><i>1.8 m</i></div>
    <div class="note">all drawn to the same scale</div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';

window.DURATION = 7;
const W = 1080, H = 1920;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

// seeded PRNG
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(7);

const scene = new THREE.Scene();
const HORIZON = new THREE.Color('#e8a07c');
scene.fog = new THREE.Fog(HORIZON, 260, 1100);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(26, W / H, 1, 4000);

// ---------- sky ----------
const sky = new THREE.Mesh(new THREE.SphereGeometry(2000, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSun: { value: new THREE.Vector3(-0.55, 0.06, -0.83).normalize() } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader: `varying vec3 vDir; uniform vec3 uSun;
    void main(){ float h = clamp(vDir.y,0.0,1.0);
      vec3 top = vec3(0.10,0.11,0.25), mid = vec3(0.55,0.33,0.45), hor = vec3(0.98,0.62,0.45);
      vec3 c = mix(hor, mid, smoothstep(0.0,0.10,h)); c = mix(c, top, smoothstep(0.08,0.42,h));
      float s = max(dot(normalize(vDir), uSun), 0.0);
      c += vec3(1.0,0.72,0.45)*pow(s,40.0)*0.8 + vec3(1.0,0.85,0.6)*smoothstep(0.9993,0.9997,s)*1.2;
      gl_FragColor = vec4(c,1.0); }`
}));
scene.add(sky);

// ---------- ground ----------
function groundTex(){
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#7d6142'; g.fillRect(0,0,512,512);
  for (let i=0;i<9000;i++){ const x=rnd()*512,y=rnd()*512,l=rnd();
    g.fillStyle = l<.5?`rgba(60,44,28,${.15+rnd()*.25})`:`rgba(170,140,95,${.1+rnd()*.25})`;
    g.fillRect(x,y,1+rnd()*3,1+rnd()*2); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(160,160);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ map: groundTex(), roughness: 1, color: '#c9b49a' }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// distant hills
const hillMat = new THREE.MeshStandardMaterial({ color: '#6b4a52', roughness: 1 });
for (let i = 0; i < 9; i++) {
  const r = 120 + rnd() * 160;
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 16), hillMat);
  m.scale.set(1.6, 0.16 + rnd() * 0.1, 0.6);
  m.position.set(-900 + i * 230 + rnd() * 80, 0, -900 - rnd() * 200); scene.add(m);
}
// acacia trees (instanced crowns + trunks)
const treeMat = new THREE.MeshStandardMaterial({ color: '#3b3226', roughness: 1 });
const crownGeo = new THREE.SphereGeometry(1, 16, 8); crownGeo.scale(1, 0.28, 1);
const trunkGeo = new THREE.CylinderGeometry(0.25, 0.45, 1, 8); trunkGeo.translate(0, 0.5, 0);
const NT = 26;
const crowns = new THREE.InstancedMesh(crownGeo, treeMat, NT), trunks = new THREE.InstancedMesh(trunkGeo, treeMat, NT);
const dm = new THREE.Object3D();
for (let i = 0; i < NT; i++) {
  const x = -700 + rnd() * 1400, z = -320 - rnd() * 500, s = 0.9 + rnd() * 0.5;
  
  dm.position.set(x, 0, z); dm.rotation.set(0, rnd() * 6, 0); dm.scale.set(s, 6 * s, s); dm.updateMatrix(); trunks.setMatrixAt(i, dm.matrix);
  dm.position.set(x, 6 * s, z); dm.scale.set(5 * s, 4 * s, 5 * s); dm.updateMatrix(); crowns.setMatrixAt(i, dm.matrix);
}
scene.add(crowns, trunks);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight('#ffd9c0', '#3a2a22', 0.9));
const key = new THREE.DirectionalLight('#ffd2a8', 2.3);
key.position.set(-70, 60, 90); key.castShadow = true;
Object.assign(key.shadow.camera, { left: -32, right: 32, top: 30, bottom: -30, near: 10, far: 300 });
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0005; key.shadow.radius = 4;
scene.add(key);
const rim = new THREE.DirectionalLight('#ff9b6b', 1.4); rim.position.set(-60, 12, -120); scene.add(rim);

// ---------- helpers ----------
function taperedTube(points, rFn, seg = 64, rad = 24) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const geo = new THREE.TubeGeometry(curve, seg, 1, rad, false);
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i <= seg; i++) {
    const u = i / seg, c = curve.getPointAt(u), r = rFn(u);
    for (let j = 0; j <= rad; j++) {
      const k = i * (rad + 1) + j; v.fromBufferAttribute(p, k).sub(c).multiplyScalar(r).add(c); p.setXYZ(k, v.x, v.y, v.z);
    }
  }
  geo.computeVertexNormals(); return { geo, curve };
}
function shadowy(m){ m.castShadow = true; m.receiveShadow = true; return m; }

// ---------- Argentinosaurus (35 m, head tip x=-17.5 .. tail tip x=+17.5) ----------
const dino = new THREE.Group(); scene.add(dino);
const skin = new THREE.MeshStandardMaterial({ color: '#8c8a76', roughness: 0.82, metalness: 0, envMapIntensity: 0.4 });
// body: lathe-like ellipsoid via tapered tube
const body = taperedTube([new THREE.Vector3(-7.2, 9.9, 0), new THREE.Vector3(-3, 10.0, 0), new THREE.Vector3(2, 9.4, 0), new THREE.Vector3(6.6, 8.9, 0)],
  u => 0.6 + 3.0 * Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.02)), 0.6), 64, 32);
body.geo.scale(1, 1, 0.85);
dino.add(shadowy(new THREE.Mesh(body.geo, skin)));
// neck
const neck = taperedTube([new THREE.Vector3(-3.2, 9.9, 0), new THREE.Vector3(-6.4, 11.0, 0), new THREE.Vector3(-9.4, 12.8, 0), new THREE.Vector3(-12.6, 14.9, 0), new THREE.Vector3(-15.6, 16.2, 0)],
  u => 2.9 * Math.pow(1 - u, 1.5) + 0.42, 64, 24);
dino.add(shadowy(new THREE.Mesh(neck.geo, skin)));
// head
const headGeo = new THREE.SphereGeometry(1, 32, 16); headGeo.scale(1.05, 0.55, 0.5);
const head = shadowy(new THREE.Mesh(headGeo, skin)); head.position.set(-16.45, 16.25, 0); head.rotation.z = 0.12; dino.add(head);
const snoutGeo = new THREE.SphereGeometry(1, 24, 12); snoutGeo.scale(0.55, 0.32, 0.36);
const snout = shadowy(new THREE.Mesh(snoutGeo, skin)); snout.position.set(-16.95, 15.98, 0); dino.add(snout);
const eyeM = new THREE.MeshStandardMaterial({ color: '#15110e', roughness: .3 });
const eye = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 8), eyeM); eye.position.set(-16.55, 16.42, 0.42); dino.add(eye);
// tail
const tail = taperedTube([new THREE.Vector3(2.8, 9.4, 0), new THREE.Vector3(6.5, 8.9, 0), new THREE.Vector3(9.5, 8.1, 0), new THREE.Vector3(13, 6.4, 0), new THREE.Vector3(17.45, 3.6, 0)],
  u => 3.0 * Math.pow(1 - u, 1.7) + 0.06, 64, 24);
dino.add(shadowy(new THREE.Mesh(tail.geo, skin)));
// legs
function leg(x, z, front) {
  const g = new THREE.Group();
  const top = front ? 8.8 : 8.4;
  const knee = new THREE.Vector3(front ? x - 0.15 : x + 0.35, 4.3, z);
  const thigh = taperedTube([new THREE.Vector3(x, top, z), new THREE.Vector3((x + knee.x) / 2 + (front ? 0 : 0.25), (top + 4.3) / 2, z), knee], u => 1.35 - 0.4 * u, 16, 20);
  const shin = taperedTube([knee, new THREE.Vector3(x + (front ? 0 : 0.1), 2.0, z), new THREE.Vector3(x, 0.55, z)], u => 0.95 - 0.12 * u, 16, 20);
  g.add(shadowy(new THREE.Mesh(thigh.geo, skin)), shadowy(new THREE.Mesh(shin.geo, skin)));
  const kj = shadowy(new THREE.Mesh(new THREE.SphereGeometry(0.98, 20, 12), skin)); kj.position.copy(knee); g.add(kj);
  const foot = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(0.92, 1.12, 0.6, 24), skin)); foot.position.set(x - 0.1, 0.3, z); g.add(foot);
  return g;
}
dino.add(leg(-4.3, 1.35, true), leg(-4.0, -1.35, true), leg(3.9, 1.4, false), leg(4.3, -1.4, false));
// subtle back ridge bumps (osteoderm hint)
const bumpGeo = new THREE.SphereGeometry(0.35, 10, 6);
for (let i = 0; i < 14; i++) { const u = i / 13, pt = body.curve.getPointAt(0.12 + u * 0.76); const r = 0.6 + 3.0 * Math.pow(Math.sin(Math.PI * (0.12 + u * 0.76)), 0.6);
  const b = new THREE.Mesh(bumpGeo, skin); b.position.set(pt.x, pt.y + r * 0.97, 0); b.scale.set(1.2, 0.6, 1); dino.add(b); }

// ---------- city bus (12 m x 3.1 m x 2.55 m) ----------
const bus = new THREE.Group(); scene.add(bus);
const busX = 3.6, busZ = 5.2;
const paint = new THREE.MeshPhysicalMaterial({ color: '#2f86a8', roughness: 0.45, clearcoat: 0.5, envMapIntensity: 0.5 });
const roofM = new THREE.MeshPhysicalMaterial({ color: '#d9d4cc', roughness: 0.5, clearcoat: .4, envMapIntensity: .5 });
const glass = new THREE.MeshPhysicalMaterial({ color: '#1c2333', roughness: 0.15, metalness: 0.2, envMapIntensity: 0.9 });
const busBody = shadowy(new THREE.Mesh(new RoundedBoxGeometry(12, 2.75, 2.55, 6, 0.28), paint)); busBody.position.set(0, 1.725, 0); bus.add(busBody);
const roof = shadowy(new THREE.Mesh(new RoundedBoxGeometry(11.7, 0.32, 2.4, 4, 0.14), roofM)); roof.position.set(0, 3.12, 0); bus.add(roof);
// side windows (front face z+)
for (let i = 0; i < 7; i++) { const w = new THREE.Mesh(new RoundedBoxGeometry(1.32, 1.0, 0.08, 3, 0.04), glass); w.position.set(-3.9 + i * 1.5, 2.35, 1.28); bus.add(w); }
const door = new THREE.Mesh(new RoundedBoxGeometry(1.0, 2.15, 0.08, 3, 0.04), glass); door.position.set(-5.05, 1.6, 1.28); bus.add(door);
const wind = new THREE.Mesh(new RoundedBoxGeometry(0.08, 1.35, 2.2, 3, 0.04), glass); wind.position.set(-6.0, 2.2, 0); bus.add(wind);
const stripe = new THREE.Mesh(new THREE.BoxGeometry(11.2, 0.12, 0.04), roofM); stripe.position.set(0.2, 1.62, 1.29); bus.add(stripe);
const tyre = new THREE.MeshStandardMaterial({ color: '#141414', roughness: .9 }), hub = new THREE.MeshStandardMaterial({ color: '#9a9a9a', roughness: .4, metalness: .6 });
for (const wx of [-3.9, 3.6]) for (const wz of [1.15, -1.15]) {
  const t = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.32, 24), tyre)); t.rotation.x = Math.PI / 2; t.position.set(wx, 0.5, wz); bus.add(t);
  const h = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.34, 16), hub); h.rotation.x = Math.PI / 2; h.position.set(wx, 0.5, wz); bus.add(h);
}
const lampM = new THREE.MeshBasicMaterial({ color: '#fff3c8' });
for (const lz of [0.85, -0.85]) { const l = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 6), lampM); l.position.set(-6.02, 0.85, lz); bus.add(l); }
bus.position.set(busX, 0, busZ);

// ---------- human (1.8 m) ----------
const human = new THREE.Group(); scene.add(human);
const cloth = new THREE.MeshStandardMaterial({ color: '#f2efe8', roughness: .7 }), dark = new THREE.MeshStandardMaterial({ color: '#2b2f3a', roughness: .8 }), skinH = new THREE.MeshStandardMaterial({ color: '#c99a7a', roughness: .7 });
const torso = shadowy(new THREE.Mesh(new THREE.CapsuleGeometry(0.19, 0.42, 6, 12), cloth)); torso.position.y = 1.24; torso.scale.z = 0.7; human.add(torso);
const headH = shadowy(new THREE.Mesh(new THREE.SphereGeometry(0.115, 16, 12), skinH)); headH.position.y = 1.685; human.add(headH);
for (const s of [-1, 1]) {
  const lg = shadowy(new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.72, 4, 8), dark)); lg.position.set(s * 0.1, 0.44, 0); human.add(lg);
  const ar = shadowy(new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.56, 4, 8), cloth)); ar.position.set(s * 0.27, 1.17, 0); ar.rotation.z = s * 0.12; human.add(ar);
}
human.position.set(-10.2, 0, 5.2);

// ---------- scale bars (orange, end ticks) ----------
const barM = new THREE.MeshBasicMaterial({ color: '#ff6a3d', toneMapped: false, fog: false });
function hBar(x0, x1, y, z, tick) {
  const g = new THREE.Group(), th = 0.22;
  const b = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, th, th), barM); b.position.set((x0 + x1) / 2, y, z); g.add(b);
  for (const x of [x0, x1]) { const t = new THREE.Mesh(new THREE.BoxGeometry(th, tick, th), barM); t.position.set(x, y, z); g.add(t); }
  scene.add(g); return g;
}
function vBar(x, y0, y1, z, tick) {
  const g = new THREE.Group(), th = 0.09;
  const b = new THREE.Mesh(new THREE.BoxGeometry(th, y1 - y0, th), barM); b.position.set(x, (y0 + y1) / 2, z); g.add(b);
  for (const y of [y0, y1]) { const t = new THREE.Mesh(new THREE.BoxGeometry(tick, th, th), barM); t.position.set(x, y, z); g.add(t); }
  scene.add(g); return g;
}
const DINO_BAR_Y = 20.2;
const dBar = hBar(-17.5, 17.5, DINO_BAR_Y, 0, 1.6);
// thin dashed guides from bar ends down to head tip / tail tip
const guideM = new THREE.LineDashedMaterial({ color: '#ff6a3d', dashSize: 0.5, gapSize: 0.4, transparent: true, opacity: .75, toneMapped: false, fog: false });
for (const [x, y] of [[-17.5, 16.0], [17.5, 3.7]]) {
  const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, DINO_BAR_Y, 0), new THREE.Vector3(x, y, 0)]);
  const l = new THREE.Line(lg, guideM); l.computeLineDistances(); scene.add(l);
}
const bBar = hBar(busX - 6, busX + 6, 0.12, busZ + 2.4, 0.9);
const yBar = vBar(-11.0, 0, 1.8, 5.2, 0.4);

// ---------- labels ----------
const svg = document.getElementById('lines');
const pD = document.getElementById('pDino'), pB = document.getElementById('pBus'), pY = document.getElementById('pYou');
const tmp = new THREE.Vector3();
function proj(x, y, z) { tmp.set(x, y, z).project(camera); return [(tmp.x + 1) / 2 * W, (1 - tmp.y) / 2 * H]; }
function place(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; }

const ease = t => t < .5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2;
function render(t) {
  // final framing with a slow drift
  const k = ease(Math.min(1, t / 7));
  const camX = 2.2 - 1.2 * k, dist = 177 - 2 * k;
  camera.position.set(camX, 9, dist);
  camera.lookAt(camX, 12.6, 0);
  camera.updateMatrixWorld();
  renderer.render(scene, camera);

  // overlay
  const [dx, dy] = proj(0, DINO_BAR_Y, 0);
  const [bx, by] = proj(busX, 0.12, busZ + 2.4);
  const [hx, hy] = proj(-10.2, 1.9, 5.2);
  const [ybx, yby] = proj(-11.0, 0, 5.2);
  place(pD, dx, dy - 92); place(pB, bx + 40, by + 100); place(pY, 230, by + 100);
  svg.innerHTML =
    `<line x1="${dx}" y1="${dy - 40}" x2="${dx}" y2="${dy - 6}" stroke="#ff6a3d" stroke-width="2"/><circle cx="${dx}" cy="${dy}" r="6" fill="#ff6a3d"/>` +
    `<line x1="${bx + 40}" y1="${by + 46}" x2="${bx}" y2="${by + 8}" stroke="#ff6a3d" stroke-width="2"/><circle cx="${bx}" cy="${by + 2}" r="6" fill="#ff6a3d"/>` +
    `<line x1="230" y1="${by + 46}" x2="${hx - 4}" y2="${hy + 4}" stroke="#ff6a3d" stroke-width="2"/><circle cx="${hx}" cy="${hy}" r="6" fill="#ff6a3d"/>`;
}
window.renderAt = t => render(t);
const q = new URLSearchParams(location.search);
await Promise.race([Promise.all(['900 76px "Inter"', '800 40px "Inter"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 3000))]);
render(q.has('t') ? parseFloat(q.get('t')) : 7);
window.READY = true;
requestAnimationFrame(() => { document.title = 'ok'; });
</script>
</body>
</html>
