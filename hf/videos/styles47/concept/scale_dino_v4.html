<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Biggest dinosaur vs you</title>
<style>
  :root{--accent:#ff6a3d;--ink:#fff7ef;}
  body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#1b1d33;font-family:"Inter",system-ui,Arial,sans-serif}
  canvas{position:absolute;inset:0;display:block}
  #rays{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.55;
    background:repeating-conic-gradient(from 60deg at 0% 44%, rgba(255,214,160,.16) 0deg 2.2deg, rgba(255,214,160,0) 2.2deg 7deg);
    -webkit-mask-image:radial-gradient(circle at 0% 44%, #000 0, rgba(0,0,0,.6) 300px, transparent 820px);
            mask-image:radial-gradient(circle at 0% 44%, #000 0, rgba(0,0,0,.6) 300px, transparent 820px)}
  #ov{position:absolute;inset:0;pointer-events:none}
  #ov svg{position:absolute;inset:0}
  .hl{position:absolute;left:70px;right:70px;top:170px;text-align:center;color:var(--ink);font-weight:900;font-size:76px;line-height:1.12;letter-spacing:-1.5px;text-shadow:0 4px 24px rgba(20,10,30,.5)}
  .hl .key{display:inline-block;background:var(--accent);color:#1a0e08;padding:0 22px 6px;border-radius:14px;transform:rotate(-2deg);margin-left:6px}
  .pill{position:absolute;transform:translate(-50%,-50%);background:rgba(16,14,24,.78);border:2px solid rgba(255,255,255,.16);border-radius:18px;padding:12px 24px 14px;color:#fff;text-align:center;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .pill b{display:block;font-weight:800;font-size:40px;letter-spacing:-.5px}
  .pill i{display:block;font-style:normal;font:600 26px "DejaVu Sans Mono",monospace;color:var(--accent);margin-top:4px}
  .note{position:absolute;left:70px;right:70px;top:400px;text-align:center;color:rgba(255,240,226,.88);font:600 26px "DejaVu Sans Mono",monospace;text-shadow:0 2px 12px rgba(40,10,30,.6)}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./"}}</script>
</head>
<body>
<div id="stage">
  <div id="rays"></div>
  <div id="ov">
    <svg id="lines" width="1080" height="1920"></svg>
    <div class="hl">The biggest dinosaur<br>vs. <span class="key">you</span></div>
    <div class="pill" id="pDino"><b>Argentinosaurus</b><i>~35 m long (estimate)</i></div>
    <div class="pill" id="pBus"><b>City bus</b><i>12 m</i></div>
    <div class="pill" id="pYou"><b>You</b><i>1.8 m</i></div>
    <div class="note">all drawn to the same scale</div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';

window.DURATION = 7;
const W = 1080, H = 1920;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(11);
const R = (a, b) => a + rnd() * (b - a);
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

const busX = 12.6, busZ = 8.5;
const hash = (x, y, z) => { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); };
const scene = new THREE.Scene();
const FOG = new THREE.Color('#e3a27e');
scene.fog = new THREE.Fog(FOG, 200, 820);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(26, W / H, 1, 5000);

// ---------- sky ----------
const SUN = new THREE.Vector3(-0.16, 0.05, -1).normalize();
scene.add(new THREE.Mesh(new THREE.SphereGeometry(2400, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { uSun: { value: SUN } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader: `varying vec3 vDir; uniform vec3 uSun;
    void main(){ vec3 d = normalize(vDir); float h = clamp(d.y,0.0,1.0);
      vec3 top = vec3(0.17,0.14,0.32), mid = vec3(0.70,0.40,0.50), hor = vec3(1.0,0.70,0.46);
      vec3 c = mix(hor, mid, smoothstep(0.0,0.12,h)); c = mix(c, top, smoothstep(0.10,0.45,h));
      float s = max(dot(d, uSun), 0.0);
      c += vec3(1.0,0.66,0.38)*pow(s,24.0)*0.35 + vec3(1.0,0.85,0.6)*pow(s,400.0)*0.7 + vec3(1.0,0.92,0.75)*smoothstep(0.9994,0.9997,s);
      gl_FragColor = vec4(c,1.0); }`
})));

// ---------- canvas textures ----------
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const groundMap = canvasTex(512, 512, (g) => {
  g.fillStyle = '#3f5628'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 14000; i++) { const l = rnd();
    g.fillStyle = l < .35 ? `rgba(40,46,22,${R(.2,.45)})` : l < .7 ? `rgba(110,120,60,${R(.15,.35)})` : `rgba(95,72,44,${R(.15,.35)})`;
    g.fillRect(rnd() * 512, rnd() * 512, R(1, 4), R(1, 3)); }
}, [500, 500]);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), new THREE.MeshStandardMaterial({ map: groundMap, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// frond (pinnate leaf) texture with alpha
const frondTex = canvasTex(256, 64, (g, w, h) => {
  g.clearRect(0, 0, w, h); g.strokeStyle = '#9a9a80'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
  for (let i = 0; i < 46; i++) { const x = 6 + i * 5.4;
    for (const s of [-1, 1]) { g.save(); g.translate(x, h / 2); g.rotate(s * 1.05); g.fillStyle = `rgb(${200 + R(-25, 25)},${215 + R(-20, 20)},${190 + R(-20, 20)})`;
      g.beginPath(); g.ellipse(14, 0, 15, 2.6, 0, 0, Math.PI * 2); g.fill(); g.restore(); } }
});
// soft blob texture (mist / smoke)
const softTex = canvasTex(128, 128, (g) => { const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.5, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); });
// skin bump texture: wrinkles + pebbly scales
const skinTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { const x = rnd() * w, y = rnd() * h, r = R(2, 6); const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(0,0,0,.25)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 2;
  for (let i = 0; i < 70; i++) { const x = rnd() * w; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + R(-20, 20), h * .3, x + R(-20, 20), h * .7, x + R(-15, 15), h); g.stroke(); }
}, [26, 3]);
skinTex.colorSpace = THREE.NoColorSpace;

// ---------- distant layers: volcano, smoke, misty ridges ----------
function ridge(z, color, amp, base, seed) {
  const r2 = mulberry32(seed), sh = new THREE.Shape(); const X0 = -2200, X1 = 2200; sh.moveTo(X0, -5);
  for (let x = X0; x <= X1; x += 40) { const y = base + amp * (0.55 + 0.45 * Math.sin(x * 0.004 + seed) * Math.sin(x * 0.0017 + seed * 2)) + r2() * amp * 0.08; sh.lineTo(x, y); }
  sh.lineTo(X1, -5);
  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), new THREE.MeshBasicMaterial({ color, fog: false })); m.position.z = z; scene.add(m);
}
// volcano
{
  const pts = []; for (let i = 0; i <= 20; i++) { const t = i / 20; pts.push(new THREE.Vector2(10 + 300 * Math.pow(t, 1.9), 135 * (1 - t))); }
  const v = new THREE.Mesh(new THREE.LatheGeometry(pts, 48), new THREE.MeshBasicMaterial({ color: '#b97a86', fog: false }));
  v.position.set(95, 0, -1500); scene.add(v);
  const smokeM = new THREE.SpriteMaterial({ map: softTex, color: '#9d7383', transparent: true, opacity: .5, depthWrite: false, fog: false });
  for (let i = 0; i < 14; i++) { const s = new THREE.Sprite(smokeM); const k = i / 13; s.position.set(95 + 130 * k * k + R(-8, 8), 140 + k * 260, -1500); const sz = 50 + k * 170; s.scale.set(sz, sz * .8, 1); scene.add(s); }
}
ridge(-1300, '#c8808a', 70, 0, 3);
ridge(-1000, '#d58e86', 55, 0, 7);
ridge(-750, '#dc9a84', 40, 0, 13);

// ---------- vegetation ----------
const dm = new THREE.Object3D(); const col = new THREE.Color();
function frondGeometry() {
  const seg = 14, pos = [], uv = [], idx = [];
  for (let i = 0; i <= seg; i++) { const t = i / seg; const x = t, y = 0.62 * t - 0.95 * t * t; const w = 0.13 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.05 + 0.02)), 0.6) + 0.004;
    pos.push(x, y - 0.02 * w, w, x, y + 0.025, 0, x, y - 0.02 * w, -w); uv.push(t, 1, t, .5, t, 0); }
  for (let i = 0; i < seg; i++) for (let j = 0; j < 2; j++) { const a = i * 3 + j, b = a + 3; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
const frondMat = new THREE.MeshStandardMaterial({ map: frondTex, alphaTest: 0.45, side: THREE.DoubleSide, roughness: .8 });
const fronds = []; // {p, yaw, pitch, roll, len, color}
const trunkList = []; // {p, h, r, color}
function addFern(x, z, trunkH, n, lenA, lenB, pitchA, pitchB, hue) {
  if (trunkH > 0) trunkList.push({ x, z, h: trunkH, r: trunkH > 2 ? 0.22 + trunkH * 0.018 : 0.32 });
  const y = trunkH; const off = rnd() * 6;
  for (let i = 0; i < n; i++) fronds.push({ x, y, z, yaw: off + i / n * Math.PI * 2 + R(-.2, .2), pitch: R(pitchA, pitchB), roll: R(-.3, .3), len: R(lenA, lenB), hue });
}
// tree ferns behind (realistic: 3-8 m trunks, 2.5-3.5 m fronds)
for (let i = 0; i < 70; i++) { const x = R(-60, 62), z = R(-22, -140); addFern(x, z, R(3, 8), 13, 2.4, 3.6, .15, .55, 0); }
// cycads (1-2.5 m) mid/back
for (let i = 0; i < 50; i++) { const x = R(-55, 55), z = R(-8, -90); addFern(x, z, R(.6, 1.8), 14, 1.2, 1.8, .35, .75, 1); }
// foreground ground ferns + cycads (low, kept below the labels)
for (let i = 0; i < 150; i++) { const z = R(106, 158), half = (175 - z) * 0.15; const x = 1.2 + R(-half, half); const L = R(.7, 2.1); addFern(x, z, 0, 9 + Math.floor(rnd() * 6), L * .7, L, .3, 1.0, rnd() < .5 ? 2 : 3); }
// small mid-ground fern clumps (low, under the labels' level)
for (let i = 0; i < 90; i++) { const z = R(14, 100), half = (175 - z) * 0.15; const x = 1.2 + R(-half, half); if (Math.abs(x - busX) < 7 && z < 12) continue; addFern(x, z, 0, 8, .35, .8, .4, .9, rnd() < .5 ? 2 : 3); }
// side ferns just outside the subject zone
for (let i = 0; i < 26; i++) { const z = R(-6, 30); const x = (rnd() < .5 ? -1 : 1) * R(21, 34); addFern(x, z, rnd() < .4 ? R(2, 4) : 0, 11, 1.4, 2.6, .3, .8, 2); }

const frondIM = new THREE.InstancedMesh(frondGeometry(), frondMat, fronds.length);
const hues = [['#4f7a3a', '#6d8f3e'], ['#3d5f33', '#56703a'], ['#4d7533', '#7a9a40'], ['#2f4d26', '#4c6a2e']];
fronds.forEach((f, i) => {
  dm.position.set(f.x, f.y, f.z); dm.rotation.set(f.roll, f.yaw, f.pitch, 'YZX'); dm.scale.setScalar(f.len); dm.updateMatrix(); frondIM.setMatrixAt(i, dm.matrix);
  const [a, b] = hues[f.hue]; col.set(a).lerp(new THREE.Color(b), rnd()); frondIM.setColorAt(i, col);
});
frondIM.receiveShadow = true; scene.add(frondIM);
const trunkGeo = new THREE.CylinderGeometry(0.75, 1, 1, 10, 4); trunkGeo.translate(0, 0.5, 0);
{ const p = trunkGeo.attributes.position; for (let i = 0; i < p.count; i++) { const a = Math.atan2(p.getZ(i), p.getX(i)); const k = 1 + 0.06 * Math.sin(a * 9); p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * k); } trunkGeo.computeVertexNormals(); }
const trunkIM = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({ color: '#4a3526', roughness: 1 }), trunkList.length);
trunkList.forEach((t, i) => { dm.position.set(t.x, 0, t.z); dm.rotation.set(R(-.05, .05), R(0, 6), R(-.05, .05)); dm.scale.set(t.r, t.h, t.r); dm.updateMatrix(); trunkIM.setMatrixAt(i, dm.matrix); });
scene.add(trunkIM);

// araucaria (30-45 m) and tall conifers far behind
const darkTree = new THREE.MeshStandardMaterial({ color: '#1b2619', roughness: 1, flatShading: true });
const ara = []; for (let i = 0; i < 26; i++) { const x = R(-25, 380); ara.push({ x, z: R(-330, -680), h: R(30, 45) }); }
const araTrunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(.5, .9, 1, 8).translate(0, .5, 0), darkTree, ara.length);
const puffGeo = new THREE.IcosahedronGeometry(1, 2); { const p = puffGeo.attributes.position; for (let i = 0; i < p.count; i++) { const k = 0.8 + 0.4 * hash(p.getX(i) * 3, p.getY(i) * 3, p.getZ(i) * 3); p.setXYZ(i, p.getX(i) * k, p.getY(i) * k * .45, p.getZ(i) * k); } puffGeo.computeVertexNormals(); }
const araCrown = new THREE.InstancedMesh(puffGeo, darkTree, ara.length * 6);
ara.forEach((a, i) => {
  dm.rotation.set(0, 0, 0); dm.position.set(a.x, 0, a.z); dm.scale.set(a.h * .025, a.h * .92, a.h * .025); dm.updateMatrix(); araTrunk.setMatrixAt(i, dm.matrix);
  for (let k = 0; k < 6; k++) { const ang = k / 6 * 6.28 + i, rr = k === 0 ? 0 : a.h * R(.08, .16);
    dm.position.set(a.x + Math.cos(ang) * rr, a.h * (k === 0 ? .97 : R(.8, .93)), a.z + Math.sin(ang) * rr * .5); const s = a.h * (k === 0 ? .2 : R(.1, .15)); dm.scale.set(s, s, s); dm.updateMatrix(); araCrown.setMatrixAt(i * 6 + k, dm.matrix); }
});
scene.add(araTrunk, araCrown);
const con = []; for (let i = 0; i < 40; i++) con.push({ x: R(-260, 260), z: R(-110, -420), h: R(18, 32) });
const coneGeo = new THREE.ConeGeometry(1, 1, 10); coneGeo.translate(0, .5, 0);
const conIM = new THREE.InstancedMesh(coneGeo, new THREE.MeshStandardMaterial({ color: '#223020', roughness: 1, flatShading: true }), con.length * 5);
con.forEach((c, i) => { for (let k = 0; k < 5; k++) { dm.position.set(c.x + R(-.4, .4), c.h * (.2 + k * .15), c.z); dm.rotation.set(R(-.06, .06), R(0, 6), R(-.06, .06)); const w = c.h * (.15 - k * .024) * R(.85, 1.15); dm.scale.set(w, c.h * .26, w); dm.updateMatrix(); conIM.setMatrixAt(i * 5 + k, dm.matrix); } });
scene.add(conIM);

// grass clumps
const bladeGeo = new THREE.BufferGeometry();
bladeGeo.setAttribute('position', new THREE.Float32BufferAttribute([-.03, 0, 0, .03, 0, 0, .012, .5, .02, -.012, .5, .02, 0, 1, .08], 3));
bladeGeo.setIndex([0, 1, 2, 0, 2, 3, 3, 2, 4]); bladeGeo.computeVertexNormals();
const grass = [];
for (let c = 0; c < 1700; c++) { const z = R(-15, 160), half = Math.max(20, (175 - z) * 0.15); const cx = 1.2 + R(-half, half);
  const nb = 9; for (let b = 0; b < nb; b++) grass.push({ x: cx + R(-.35, .35), z: z + R(-.35, .35), h: z > 100 ? R(.35, .8) : R(.25, .55) }); }
const grassIM = new THREE.InstancedMesh(bladeGeo, new THREE.MeshStandardMaterial({ color: '#ffffff', side: THREE.DoubleSide, roughness: .9 }), grass.length);
grass.forEach((g, i) => { dm.position.set(g.x, 0, g.z); dm.rotation.set(R(-.35, .35), R(0, 6.28), R(-.35, .35)); dm.scale.set(1, g.h, 1); dm.updateMatrix(); grassIM.setMatrixAt(i, dm.matrix);
  col.set('#6f8a3a').lerp(new THREE.Color('#a7a64e'), rnd()); grassIM.setColorAt(i, col); });
grassIM.receiveShadow = true; scene.add(grassIM);

// low mist banks between the layers
const mistM = new THREE.SpriteMaterial({ map: softTex, color: '#f3c19a', transparent: true, opacity: .38, depthWrite: false, fog: false });
for (let i = 0; i < 16; i++) { const s = new THREE.Sprite(mistM); s.position.set(R(-160, 160), R(4, 12), R(-60, -260)); s.scale.set(R(90, 160), R(18, 30), 1); scene.add(s); }

// ---------- lights: warm sun + cool sky fill + sunset rim ----------
scene.add(new THREE.HemisphereLight('#a9b8e6', '#3b3020', 0.75));
const key = new THREE.DirectionalLight('#ffc58a', 3.4);
key.position.set(-70, 52, -95); key.castShadow = true; // low sunset sun from back-left: long shadows fall toward the camera
Object.assign(key.shadow.camera, { left: -70, right: 70, top: 60, bottom: -60, near: 10, far: 420 });
key.shadow.mapSize.set(4096, 4096); key.shadow.bias = -0.0003; key.shadow.normalBias = 0.08; key.shadow.radius = 5;
scene.add(key); scene.add(key.target);
const fill = new THREE.DirectionalLight('#ffd9c2', 1.25); fill.position.set(50, 34, 130); scene.add(fill); // soft front fill, no shadow
// soft contact shadows (fake ambient occlusion) under everything that touches the ground
const aoTex = canvasTex(256, 256, (g) => { const r = g.createRadialGradient(128, 128, 0, 128, 128, 128); r.addColorStop(0, 'rgba(10,8,4,.8)'); r.addColorStop(.55, 'rgba(10,8,4,.28)'); r.addColorStop(1, 'rgba(10,8,4,0)'); g.fillStyle = r; g.fillRect(0, 0, 256, 256); });
function contact(x, z, sx, sz) { const m = new THREE.Mesh(new THREE.PlaneGeometry(sx, sz), new THREE.MeshBasicMaterial({ map: aoTex, transparent: true, depthWrite: false, fog: false })); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.06, z); m.renderOrder = 2; scene.add(m); }
[[-4.4, 1.25], [-4.0, -1.25], [4.0, 1.35], [4.4, -1.35]].forEach(([x, z]) => contact(x, z, 5.2, 5.2));
contact(0, 0, 22, 9); contact(busX, busZ, 15, 5.5); contact(-10.2, 5.2, 1.6, 1.6);
const rim = new THREE.DirectionalLight('#ff9a5a', 3.2); rim.position.copy(SUN).multiplyScalar(200); scene.add(rim);

// ---------- Argentinosaurus: ONE continuous spine tube (head tip x=-17.5 .. tail tip x=+17.5) ----------
const spine = new THREE.CatmullRomCurve3([
  [-17.15, 15.75], [-16.3, 16.25], [-14.6, 15.85], [-11.5, 14.1], [-8.2, 11.9], [-4.5, 10.6], [-0.5, 10.2], [3.5, 9.7], [7, 8.9], [10.5, 7.3], [14, 5.3], [17.5, 3.35]
].map(([x, y]) => new THREE.Vector3(x, y, 0)), false, 'centripetal');
const RT = [[-17.15, .30], [-16.7, .52], [-16.2, .56], [-15.6, .42], [-14, .55], [-11.5, .95], [-8.5, 1.6], [-6, 2.45], [-3.5, 3.15], [-0.5, 3.35], [2.5, 3.2], [5, 2.7], [7.5, 2.0], [10.5, 1.3], [13.5, .7], [16, .3], [17.5, .05]];
function rOfX(x) { if (x <= RT[0][0]) return RT[0][1]; for (let i = 0; i < RT.length - 1; i++) { const [x0, r0] = RT[i], [x1, r1] = RT[i + 1]; if (x <= x1) { const t = (x - x0) / (x1 - x0); return r0 + (r1 - r0) * (0.5 - 0.5 * Math.cos(Math.PI * t)); } } return RT[RT.length - 1][1]; }
const bodyMask = x => sstep(-9, -4.5, x) * (1 - sstep(3.5, 9, x));
const SEG = 420, RAD = 48;
const dGeo = new THREE.TubeGeometry(spine, SEG, 1, RAD, false);
{ const p = dGeo.attributes.position, v = new THREE.Vector3();
