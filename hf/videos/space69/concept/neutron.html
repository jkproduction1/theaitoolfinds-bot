<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inside a neutron star</title>
<!-- space69 r0: /deep-dive inside a neutron star. Procedural cutaway, own look, layers not to scale.
  Facts: NASA Imagine the Universe (pulsars/neutron stars): about 20 km (12 mi) across, ~1.4 Suns of mass, a teaspoon would weigh ~1 billion tons.
  Structure (NASA NICER / standard models): solid crust ~1 km thick; inner crust where "nuclear pasta" is predicted; outer core = neutron
  (super)fluid; inner core composition unknown (exotic matter / quarks are proposals). -->
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head>
<body>
<div id="stage">
  <div id="ov">
    <svg id="lines" width="1080" height="1920"></svg>
    <div class="pill" id="pCr">Crust: solid, ~1 km (0.6 mi) thick</div>
    <div class="pill hot" id="pPa">“Nuclear pasta” (predicted)</div>
    <div class="pill" id="pCo">Core: a sea of neutrons</div>
    <div class="pill red" id="pIn">Inner core: still a mystery</div>
    <div id="size">About <b>12 mi</b> (20 km) across</div>
    <div id="note">1 teaspoon ≈ 1 billion tons · not to scale</div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { W, H, DUR, cl, ramp, sm, eio, eout, popS, V, mulberry32, setup, softTex, labels, injectCSS, ready } from './studio.js';
injectCSS();
document.head.insertAdjacentHTML('beforeend', `<style>
#note{position:absolute;left:0;right:0;top:1530px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:30px;color:rgba(225,235,250,.88);opacity:0}
#size{position:absolute;left:0;right:0;top:1420px;text-align:center;font-weight:800;font-size:56px;color:#fff;opacity:0;letter-spacing:-1px;text-shadow:0 0 30px rgba(80,170,255,.6)}
#size b{color:#7fd4ff}</style>`);
const { renderer, scene, camera } = setup(30, [.0, .004, .012], [.02, .035, .07]);
const rnd = mulberry32(69); const R = (a, b) => a + rnd() * (b - a);
const NOISE = `
float h3(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float n3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*n3(p); p*=2.03; a*=.5; } return s; }
`;
// wedge clipping planes (updated per frame)
const P1 = new THREE.Plane(V(1, 0, 0), 0), P2 = new THREE.Plane(V(1, 0, 0), 0);
const TC = 0.35; // wedge centre azimuth (toward camera, a bit right)
// outer surface: hot blue-white, mottled
const surfM = new THREE.ShaderMaterial({ uniforms: { uT: { value: 0 } }, clippingPlanes: [P1, P2], clipIntersection: true, clipping: true,
  vertexShader: `#include <clipping_planes_pars_vertex>
  varying vec3 vP; varying vec3 vN; varying vec3 vW; void main(){ vP=position; vN=normalize(mat3(modelMatrix)*normal); vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; vec4 mvPosition=viewMatrix*w; gl_Position=projectionMatrix*mvPosition;
  #include <clipping_planes_vertex>
  }`,
  fragmentShader: NOISE + `#include <clipping_planes_pars_fragment>
  uniform float uT; varying vec3 vP; varying vec3 vN; varying vec3 vW;
  void main(){
    #include <clipping_planes_fragment>

    vec3 p=normalize(vP); float n=fbm(p*6.0+vec3(0.,uT*0.15,0.)); float n2=fbm(p*22.0-vec3(uT*0.1));
    vec3 V=normalize(cameraPosition-vW); float mu=max(dot(normalize(vN),V),0.);
    vec3 c=mix(vec3(0.35,0.55,1.0),vec3(0.92,0.96,1.0),smoothstep(0.35,0.75,n))*(0.75+0.35*n2);
    float pole=smoothstep(0.82,0.98,abs(p.y)); c+=vec3(0.6,0.8,1.0)*pole*0.8;
    c*= 0.55+0.6*pow(mu,0.6);
    gl_FragColor=vec4(c,1.); }`, side: THREE.FrontSide });
const star = new THREE.Mesh(new THREE.SphereGeometry(1, 160, 80), surfM); scene.add(star);
// inside of the shell (seen through the wedge) - dark crust colour
const backM = new THREE.MeshBasicMaterial({ color: '#0d1526', side: THREE.BackSide, clippingPlanes: [P1, P2], clipIntersection: true });
scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.999, 96, 48), backM));
// cut faces: half discs coloured by radius
const faceM = new THREE.ShaderMaterial({ uniforms: { uT: { value: 0 }, uHot: { value: 0 } }, side: THREE.DoubleSide,
  vertexShader: `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: NOISE + `uniform float uT, uHot; varying vec3 vP;
  void main(){ float r=length(vP.xy); vec3 q=vec3(vP.xy*9.0,uT*0.2);
    // outer crust: steel lattice
    vec2 g=abs(fract(vP.xy*60.0)-0.5); float lat=1.-smoothstep(0.0,0.12,min(g.x,g.y));
    vec3 crust=mix(vec3(0.55,0.62,0.72),vec3(0.85,0.9,0.98),lat*0.6);
    // inner crust: pasta strands
    float s=sin((vP.x*1.3+vP.y)*90.0+fbm(q*2.0)*6.0); vec3 pasta=mix(vec3(0.95,0.45,0.12),vec3(1.0,0.78,0.35),smoothstep(-0.3,0.6,s));
    // outer core: glowing neutron fluid
    float f=fbm(vec3(vP.xy*4.0,uT*0.35)); vec3 core=mix(vec3(0.05,0.18,0.55),vec3(0.25,0.55,1.0),f)*(1.0+0.35*sin(uT*2.0+r*12.0));
    // inner core: violet unknown
    float m=fbm(vec3(vP.xy*7.0,uT*0.6)); vec3 inner=mix(vec3(0.5,0.12,0.75),vec3(1.0,0.45,0.95),m)*(1.0+0.6*uHot);
    vec3 c = r>0.93? crust : r>0.84? pasta : r>0.36? core : inner;
    float e = min(min(abs(r-0.93),abs(r-0.84)),abs(r-0.36)); c+= vec3(1.0)*(1.0-smoothstep(0.0,0.008,e))*0.5;
    c*= 1.0 - 0.25*smoothstep(0.97,1.0,r);
    gl_FragColor=vec4(c,1.); }` });
const faceGeo = new THREE.CircleGeometry(0.998, 160, -Math.PI / 2, Math.PI);
const f1 = new THREE.Mesh(faceGeo, faceM), f2 = new THREE.Mesh(faceGeo, faceM); scene.add(f1, f2);
// glow around the star
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex(), color: '#6fb8ff', transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending }));
glow.scale.setScalar(4.2); glow.renderOrder = -1; scene.add(glow);
// magnetic field lines (dipole loops) + faint beams
const fieldM = new THREE.LineBasicMaterial({ color: '#7fc8ff', transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false });
const field = new THREE.Group(); scene.add(field);
for (let k = 0; k < 10; k++) { const L = [1.9, 2.6, 3.4][k % 3], ph = k / 10 * Math.PI * 2, pts = [];
  for (let i = 0; i <= 120; i++) { const th = 0.25 + (Math.PI - 0.5) * i / 120, r = L * Math.sin(th) ** 2; if (r < 1.0) continue;
    pts.push(V(r * Math.sin(th) * Math.cos(ph), r * Math.cos(th), r * Math.sin(th) * Math.sin(ph))); }
  field.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), fieldM)); }
field.rotation.z = 0.35;
const beamM = new THREE.MeshBasicMaterial({ color: '#9fd6ff', transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
for (const s of [1, -1]) { const b = new THREE.Mesh(new THREE.ConeGeometry(0.55, 7, 32, 1, true), beamM); b.position.y = s * 5.0; b.rotation.x = s > 0 ? Math.PI : 0; field.add(b); }
// stars
const NS = 1800, sp = new Float32Array(NS * 3); for (let i = 0; i < NS; i++) { const v = V(R(-1, 1), R(-1, 1), R(-1, 1)).normalize().multiplyScalar(R(60, 90)); sp.set([v.x, v.y, v.z], i * 3); }
const sGeo = new THREE.BufferGeometry(); sGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
scene.add(new THREE.Points(sGeo, new THREE.PointsMaterial({ size: 0.14, color: '#cfd8ff', transparent: true, opacity: 0.75, depthWrite: false })));
const d = th => V(Math.sin(th), 0, Math.cos(th));
const halfW = t => 0.0001 + (Math.PI / 4) * eio(ramp(t, 0.9, 2.0));
function setCam(t) { const u = cl(t / DUR), s = 0.25 * u + 0.75 * eio(u);
  const a = 0.75 - 0.3 * s, r = 8.35 - 1.2 * eio(ramp(t, 0.4, 3.4)) + 0.9 * sm(ramp(t, 4.4, 6.3)), y = 1.15 - 0.35 * s;
  camera.position.set(Math.sin(a) * r, y, Math.cos(a) * r); camera.lookAt(0.05, 0.05 - 0.25 * sm(ramp(t, 4.4, 6.0)), 0); camera.updateMatrixWorld(); }
const E = id => document.getElementById(id);
const faceP = (r, ang) => { const th = TC + halfW(9) , q = d(th); return [q.x * r * Math.cos(ang), r * Math.sin(ang), q.z * r * Math.cos(ang)]; };
const faceL = (r, ang) => { const th = TC - halfW(9), q = d(th); return [q.x * r * Math.cos(ang), r * Math.sin(ang), q.z * r * Math.cos(ang)]; };
const lab = labels(camera, [
  { el: E('pCr'), t0: 1.7, at: () => faceP(0.965, 0.75), pos: (x, y) => [540, 330] },
  { el: E('pPa'), t0: 2.5, at: () => faceP(0.885, 0.15), col: '#ffb547', pos: (x, y) => [cl(x + 20, 380, 640), cl(y - 170, 470, 900)] },
  { el: E('pCo'), t0: 3.3, at: () => faceL(0.6, -0.5), pos: (x, y) => [cl(x - 40, 400, 560), 1180] },
  { el: E('pIn'), t0: 4.1, at: () => faceL(0.12, 0.3), col: '#ff4a4a', pos: (x, y) => [cl(x + 60, 480, 660), 1305] },
]);
function render(t) {
  t = cl(t, 0, DUR); setCam(t);
  const h = halfW(t), a1 = TC + h, a2 = TC - h;
  P1.normal.set(Math.cos(a1), 0, -Math.sin(a1)); P1.constant = 0;
  P2.normal.set(-Math.cos(a2), 0, Math.sin(a2)); P2.constant = 0;
  f1.rotation.y = a1 - Math.PI / 2; f2.rotation.y = a2 - Math.PI / 2;
  const open = ramp(t, 0.9, 1.1); f1.visible = f2.visible = open > 0;
  surfM.uniforms.uT.value = t; faceM.uniforms.uT.value = t; faceM.uniforms.uHot.value = sm(ramp(t, 4.1, 4.6));
  star.rotation.y = 0; field.rotation.y = t * 0.35; fieldM.opacity = 0.35 * (1 - 0.6 * sm(ramp(t, 1.2, 2.2)));
  glow.position.copy(camera.position).normalize().multiplyScalar(-1.6); beamM.opacity = 0.16 * (1 - sm(ramp(t, 4.7, 5.3))); glow.material.opacity = 0.5 + 0.08 * Math.sin(t * 5.0);
  renderer.render(scene, camera); lab(t);
  const sa = sm(ramp(t, 4.9, 5.3)); E('size').style.opacity = sa; E('size').style.transform = `translateY(${(1 - eout(ramp(t, 4.9, 5.4))) * 30}px)`;
  E('note').style.opacity = sm(ramp(t, 5.2, 5.6));
}
await ready(render);
</script>
</body>
</html>
