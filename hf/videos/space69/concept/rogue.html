<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What if a rogue planet passed Earth</title>
<!-- space69 r1: /what-if a rogue planet passed Earth. Procedural, own look, NOT to scale, a what-if (no numbers).
  Facts: rogue (free-floating) planets drift through the galaxy without a star (NASA: microlensing finds, Roman telescope will survey them).
  Orbit studies of passing objects (e.g. Kaib & Raymond 2024 on passing stars; LiveScience/Space.com coverage) show a close pass can make
  Earth's orbit more elliptical -> bigger swings in sunlight over a year. The chance of such a close pass is extremely small. -->
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head>
<body>
<div id="stage">
  <div id="ov">
    <svg id="lines" width="1080" height="1920"></svg>
    <div class="pill red" id="pRo">A rogue planet: no star, drifting alone</div>
    <div class="pill" id="pTu">Its gravity tugs on Earth</div>
    <div class="pill hot" id="pOr">Earth's orbit could stretch</div>
    <div class="pill" id="pSe">Harsher seasons, every year</div>
    <div id="note">a what-if · odds are extremely low · not to scale</div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { W, H, DUR, cl, ramp, sm, eio, eout, V, mulberry32, setup, softTex, labels, injectCSS, ready } from './studio.js';
injectCSS();
document.head.insertAdjacentHTML('beforeend','<style>#note{position:absolute;left:0;right:0;top:1520px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:27px;color:rgba(200,215,235,.6);opacity:0}</style>');
const { renderer, scene, camera } = setup(40, [.0, .003, .01], [.015, .025, .05]);
const rnd = mulberry32(691); const R = (a, b) => a + rnd() * (b - a);
const NOISE = `
float h3(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float n3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=.5,s=0.; for(int i=0;i<6;i++){ s+=a*n3(p); p*=2.03; a*=.5; } return s; }
`;
const RO = 12, EP = V(RO, 0, 0);
const VS = `varying vec3 vP; varying vec3 vN; varying vec3 vW; void main(){ vP=position; vN=normalize(mat3(modelMatrix)*normal); vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`;
// Earth (procedural, own look), lit from the Sun at the origin
const earthM = new THREE.ShaderMaterial({ uniforms: { uT: { value: 0 } }, vertexShader: VS,
  fragmentShader: NOISE + `uniform float uT; varying vec3 vP; varying vec3 vN; varying vec3 vW;
  void main(){ vec3 p=normalize(vP); float c=fbm(p*2.2+vec3(3.1,1.7,0.4)); float land=smoothstep(0.52,0.56,c);
    float ice=smoothstep(0.80,0.9,abs(p.y));
    vec3 ocean=mix(vec3(0.02,0.08,0.22),vec3(0.03,0.18,0.38),smoothstep(0.3,0.52,c));
    vec3 ground=mix(vec3(0.16,0.30,0.10),vec3(0.50,0.40,0.24),fbm(p*7.0)); vec3 col=mix(ocean,ground,land); col=mix(col,vec3(0.9),ice);
    float cloud=smoothstep(0.55,0.75,fbm(p*4.0+vec3(uT*0.03,0.,0.)));
    vec3 L=normalize(-vW); float d=dot(normalize(vN),L); float day=smoothstep(-0.12,0.2,d);
    vec3 lit=col*(0.06+1.2*max(d,0.))+vec3(cloud)*0.9*max(d,0.);
    float city=land*(1.-ice)*smoothstep(0.62,0.8,fbm(p*26.0))*1.3; vec3 night=vec3(1.0,0.72,0.38)*city*(1.-day);
    vec3 V=normalize(cameraPosition-vW); float rim=pow(1.-max(dot(normalize(vN),V),0.),3.);
    gl_FragColor=vec4(lit*day+night+vec3(0.25,0.5,1.0)*rim*(0.2+0.9*max(d+0.3,0.)),1.); }` });
const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 64), earthM); earth.position.copy(EP); scene.add(earth);
// rogue planet: dark, frozen, only a thin sunlit crescent
const rogueM = new THREE.ShaderMaterial({ uniforms: {}, vertexShader: VS,
  fragmentShader: NOISE + `varying vec3 vP; varying vec3 vN; varying vec3 vW;
  void main(){ vec3 p=normalize(vP); float n=fbm(p*3.0); float b=fbm(vec3(p.y*9.0,p.x*1.5,p.z*1.5));
    vec3 col=mix(vec3(0.16,0.18,0.22),vec3(0.42,0.46,0.52),smoothstep(0.35,0.7,n))*(0.8+0.4*b);
    vec3 L=normalize(-vW); float d=max(dot(normalize(vN),L),0.);
    vec3 V=normalize(cameraPosition-vW); float rim=pow(1.-max(dot(normalize(vN),V),0.),4.);
    gl_FragColor=vec4(col*(0.035+0.9*d)+vec3(0.55,0.65,0.85)*rim*0.18,1.); }` });
const rogue = new THREE.Mesh(new THREE.SphereGeometry(1.5, 128, 64), rogueM); scene.add(rogue);
const RP0 = EP.clone().add(V(-3.2, 4.6, -7)), RP1 = EP.clone().add(V(4.2, 1.6, -2.8)), RP2 = EP.clone().add(V(16, -4, 2));
const rogueAt = t => { const u = cl(t / 2.8); if (t <= 2.8) return RP0.clone().lerp(RP1, u); return RP1.clone().lerp(RP2, cl((t - 2.8) / 3.5)); };
// Sun
const sun = new THREE.Mesh(new THREE.SphereGeometry(0.9, 48, 24), new THREE.MeshBasicMaterial({ color: '#fff4dc' })); scene.add(sun);
const sglow = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex(), color: '#ffcf7a', transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending }));
sglow.scale.setScalar(9); scene.add(sglow);
// orbits (tubes so they read on a phone)
const ring = (pts, r, mat) => new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 400, r, 8, true), mat);
const circ = []; for (let i = 0; i < 200; i++) { const a = i / 200 * Math.PI * 2; circ.push(V(Math.cos(a) * RO, 0, Math.sin(a) * RO)); }
const oldM = new THREE.MeshBasicMaterial({ color: '#cfe3ff', transparent: true, opacity: 0, depthWrite: false });
scene.add(ring(circ, 0.07, oldM));
const e = 0.3, a = RO / (1 + e), c = a * e, b = a * Math.sqrt(1 - e * e);
const ell = []; for (let i = 0; i < 200; i++) { const t = i / 200 * Math.PI * 2; ell.push(V(c + a * Math.cos(t), 0, b * Math.sin(t))); }
const newM = new THREE.MeshBasicMaterial({ color: '#ff6a3d', transparent: true, opacity: 1, depthWrite: false });
const newRing = ring(ell, 0.13, newM); scene.add(newRing);
const NIDX = newRing.geometry.index.count;
// stars
const NS = 2000, sp = new Float32Array(NS * 3); for (let i = 0; i < NS; i++) { const v = V(R(-1, 1), R(-1, 1), R(-1, 1)).normalize().multiplyScalar(R(300, 400)); sp.set([v.x, v.y, v.z], i * 3); }
const sGeo = new THREE.BufferGeometry(); sGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
scene.add(new THREE.Points(sGeo, new THREE.PointsMaterial({ size: 0.6, color: '#cfd8ff', transparent: true, opacity: 0.7, depthWrite: false })));
// camera: close on Earth -> pull up to the top view of the orbit
const C0 = EP.clone().add(V(0.2, 0.3, 7.2)), L0 = EP.clone().add(V(0.1, 1.5, -1.5)), U0 = V(0, 1, 0);
const C1 = V(-17, 66, 0.5), L1 = V(0.6, 0, 0), U1 = V(1, 0, 0);
function setCam(t) { const u = eio(ramp(t, 2.3, 4.7)), drift = 0.25 * sm(ramp(t, 0, 2.4));
  const pos = C0.clone().add(V(0.5 * drift, -0.3 * drift, -1.0 * drift)).lerp(C1, u);
  const look = L0.clone().lerp(L1, u); const up = U0.clone().lerp(U1, u).normalize();
  const z = 1 - 0.06 * sm(ramp(t, 4.7, 6.33)); pos.sub(look).multiplyScalar(z).add(look);
  camera.position.copy(pos); camera.up.copy(up); camera.lookAt(look); camera.updateMatrixWorld(); }
const E = id => document.getElementById(id);
const PER = V(c - a, 0, 0);
const lab = labels(camera, [
  { el: E('pRo'), t0: 0.45, t1: 2.5, at: t => { const p = rogueAt(t); return [p.x, p.y + 1.2, p.z]; }, col: '#ff4a4a', pos: (x, y) => [540, cl(y - 210, 250, 700)] },
  { el: E('pTu'), t0: 1.5, t1: 2.75, at: () => [EP.x - 0.2, EP.y + 0.5, EP.z + 0.6], pos: (x, y) => [cl(x, 360, 720), cl(y + 330, 900, 1350)] },
  { el: E('pOr'), t0: 3.9, at: () => [PER.x, 0, -0.0], col: '#ffb547', pos: (x, y) => [540, cl(y + 170, 900, 1420)] },
  { el: E('pSe'), t0: 4.6, at: () => [EP.x, 0, 0], pos: (x, y) => [540, cl(y - 160, 200, 600)] },
]);
function render(t) {
  t = cl(t, 0, DUR); setCam(t);
  earthM.uniforms.uT.value = t; earth.rotation.y = t * 0.1;
  rogue.position.copy(rogueAt(t)); rogue.rotation.y = t * 0.05;
  oldM.opacity = 0.45 * sm(ramp(t, 3.0, 3.6));
  const dr = eio(ramp(t, 3.5, 4.8)); newRing.geometry.setDrawRange(0, Math.floor(dr * NIDX / 6) * 6); newRing.visible = dr > 0.001;
  renderer.render(scene, camera); lab(t);
  E('note').style.opacity = sm(ramp(t, 5.0, 5.4));
}
await ready(render);
</script>
</body>
</html>
