<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grand Canyon vs Valles Marineris</title>
<!-- earth65 r2: /scale the Grand Canyon versus Valles Marineris. Procedural terrain (no real elevation data, own look), both canyons at the
  same horizontal scale (km), heights x30 for both. Facts: NPS Grand Canyon 277 river miles long, about a mile deep (up to ~6,000 ft);
  NASA Valles Marineris more than 4,000 km (~2,500 mi) long, up to 7 km (~4 mi) deep, would stretch across the United States. -->
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head>
<body>
<div id="stage">
  <div id="ov">
    <svg id="lines" width="1080" height="1920"></svg>
    <div class="pill hot" id="pGc">Grand Canyon<small>277 mi long · 1 mi deep</small></div>
    <div class="pill red" id="pVm">Valles Marineris, Mars<small>2,500 mi long · up to 4 mi deep</small></div>
    <div class="pill" id="pUs">As long as the US is wide</div>
    <div id="note">same scale · heights ×30</div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { W, H, DUR, cl, ramp, sm, eio, eout, V, mulberry32, setup, softTex, labels, injectCSS, ready } from './studio.js';
injectCSS();
document.head.insertAdjacentHTML('beforeend','<style>.pill small{display:block;font-size:31px;font-weight:600;color:#cfd6e0;margin-top:2px;text-align:center}.pill{text-align:center}#note{position:absolute;left:0;right:0;top:1525px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:26px;color:rgba(220,220,230,.6)}</style>');
const { renderer, scene, camera, bgU } = setup(34, [.02, .015, .02], [.10, .07, .07]);
camera.far = 30000; camera.updateProjectionMatrix();
function hsh(i, j, s) { let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(s, 144665); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vn(x, y, s) { const i = Math.floor(x), j = Math.floor(y); let fx = x - i, fy = y - j; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hsh(i, j, s), b = hsh(i + 1, j, s), c = hsh(i, j + 1, s), d = hsh(i + 1, j + 1, s); return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy; }
function fbm(x, y, s) { let t = 0, a = .5, f = 1, n = 0; for (let i = 0; i < 5; i++) { t += a * vn(x * f, y * f, s + i); n += a; f *= 2.1; a *= .5; } return t / n; }
const EX = 30;
// slab: width w (x), length L (along -z), canyon length cl0, half-width hw, depth dep (km); colours
function slab(w, L, CL, hw, dep, seed, cols, segX, segZ) {
  const g = new THREE.PlaneGeometry(w, L, segX, segZ); g.rotateX(-Math.PI / 2); g.translate(0, 0, -L / 2);
  const p = g.attributes.position, col = new Float32Array(p.count * 3); const c = new THREE.Color();
  const m0 = (L - CL) / 2;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = -p.getZ(i);
    const along = (z - m0) / CL; const env = sm(cl(along * 8)) * sm(cl((1 - along) * 8));
    const wig = (fbm(z / (CL * 0.12), 0.5, seed) - 0.5) * hw * 1.6; const wv = hw * (0.55 + 0.8 * fbm(z / (CL * 0.08), 2.5, seed + 9));
    const a = Math.abs(x - wig) / Math.max(1, wv);
    let f = 1 - sm(cl((a - 0.15) / 0.95)); const terr = Math.floor(f * 6) / 6; f = 0.55 * f + 0.45 * (terr + sm(cl((f * 6 - Math.floor(f * 6)) * 3)) / 6);
    const n = fbm(x / (hw * 0.6), z / (hw * 0.6), seed + 3);
    const d = -dep * f * env * (0.8 + 0.4 * n);
    const y = (d + dep * 0.06 * (fbm(x / (hw * 2), z / (hw * 2), seed + 5) - 0.5)) * EX;
    p.setY(i, y);
    const k = cl(-d / dep); const band = 0.5 + 0.5 * Math.sin(-d / dep * 18 + n * 3);
    c.set(cols[0]).lerp(new THREE.Color(cols[1]), k).lerp(new THREE.Color(cols[2]), band * 0.25 * (k > 0.02 ? 1 : 0)); c.multiplyScalar(0.85 + 0.3 * n); if (k < 0.02) c.multiplyScalar(1.1);
    col.set([c.r, c.g, c.b], i * 3); }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, envMapIntensity: 0.12 })); scene.add(m);
  return m; }
const VM = slab(900, 4500, 4000, 100, 7, 11, ['#b5643a', '#5a2a1a', '#d78a55'], 220, 700); VM.position.set(-200, 0, 0);
const GC = slab(160, 560, 446, 14.5, 1.8, 23, ['#c99a64', '#7a3b22', '#e2b07a'], 80, 220); GC.position.set(440, 0, -20);
scene.add(new THREE.HemisphereLight('#ffe6d0', '#2a1a14', 0.35));
const sun = new THREE.DirectionalLight('#fff0dc', 4.2); sun.position.set(-3000, 1100, -400); scene.add(sun);
// motion: start low over the Grand Canyon, pull back and up to show Valles Marineris
function setCam(t) {
  const a = eio(ramp(t, 0.9, 5.6)); const u = cl(t / DUR);
  const look = V(440 - 330 * a, 0, -260 - 1650 * a);
  const dist = 820 + 10600 * a, tilt = 0.95 + 0.5 * a, yaw = 0.18 - 0.2 * a + 0.03 * u;
  camera.position.set(look.x + Math.sin(yaw) * Math.cos(tilt) * dist, Math.sin(tilt) * dist, look.z + Math.cos(yaw) * Math.cos(tilt) * dist);
  camera.lookAt(look); camera.updateMatrixWorld(); }
const E = id => document.getElementById(id);
const lab = labels(camera, [
  { el: E('pGc'), t0: 0.35, at: () => [440, -10, -300], col: '#ffb547', pos: (x, y) => [cl(x - 40, 300, 780), cl(y - 260, 300, 1380)] },
  { el: E('pVm'), t0: 2.5, at: () => [-200, -40, -1600], col: '#ff4a4a', pos: (x, y) => [cl(x, 330, 750), cl(y - 300, 280, 1380)] },
  { el: E('pUs'), t0: 3.9, at: () => [-200, -40, -3300], pos: (x, y) => [cl(x, 330, 750), cl(y - 150, 260, 1380)] },
]);
function render(t) { t = cl(t, 0, DUR); setCam(t); renderer.render(scene, camera); lab(t);
  document.getElementById('note').style.opacity = sm(ramp(t, 2.4, 2.9)); }
await ready(render);
</script>
</body>
</html>
