<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ocean Drive street view</title>
<!-- gta57 r2: /street-view Ocean Drive like GTA 6. Our own rendering of a beachfront boulevard modelled on the real Ocean Drive,
  Miami Beach (pastel 3-storey art-deco hotels on the west side, Lummus Park palms and the beach on the east side), golden hour.
  No Rockstar artwork, logo, font, HUD, character or brand car; no real hotel names or signs (all sign panels are blank).
  draw(t), t in 0..6.33 s: slow dolly forward at car height while a generic open-top car passes. Units = metres. -->
<style>
  body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#f3b58a;font-family:"Inter",system-ui,"Helvetica Neue",Arial,sans-serif}
  canvas{position:absolute;inset:0;display:block;filter:saturate(1.22) contrast(1.08)}
  .shaft{position:absolute;right:-260px;width:1500px;height:120px;transform-origin:100% 50%;mix-blend-mode:screen;filter:blur(18px);background:linear-gradient(270deg,rgba(255,214,150,.42),rgba(255,200,140,.16) 55%,rgba(255,200,140,0))}
  #ov{position:absolute;inset:0;pointer-events:none}
  #glow,#flare,#streak{position:absolute;left:0;top:0;border-radius:50%;mix-blend-mode:screen;transform:translate(-50%,-50%)}
  #glow{width:1500px;height:1500px;background:radial-gradient(circle,rgba(255,236,190,.95) 0,rgba(255,196,120,.62) 7%,rgba(255,150,90,.30) 22%,rgba(255,120,90,.10) 42%,rgba(255,120,90,0) 62%)}
  #flare{width:260px;height:260px;background:radial-gradient(circle,rgba(255,255,244,1) 0,rgba(255,244,200,.9) 28%,rgba(255,220,150,0) 70%)}
  #streak{width:1900px;height:26px;border-radius:13px;background:linear-gradient(90deg,rgba(255,210,150,0),rgba(255,226,170,.55) 50%,rgba(255,210,150,0))}
  .gh{position:absolute;border-radius:50%;mix-blend-mode:screen;transform:translate(-50%,-50%)}
  #grade{position:absolute;inset:0;background:
     radial-gradient(120% 80% at 50% 46%,rgba(0,0,0,0) 58%,rgba(40,10,30,.36) 100%),
     linear-gradient(180deg,rgba(255,150,120,.10) 0,rgba(255,170,110,.05) 45%,rgba(60,20,70,.12) 100%)}
  #lines{position:absolute;inset:0}
  .pin{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;background:rgba(22,14,26,.78);border:2px solid rgba(255,255,255,.55);
       border-radius:18px;padding:12px 24px 14px;color:#fff;box-shadow:0 12px 34px rgba(40,10,20,.35)}
  .pin b{display:block;font-weight:800;font-size:46px;letter-spacing:-.5px;line-height:1.05}
  .pin span{display:block;font-weight:600;font-size:34px;color:#ffd9b8;margin-top:4px}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./"}}</script>
</head>
<body>
<div id="stage">
  <div id="ov">
    <div class="shaft" style="top:520px;transform:rotate(-13deg)"></div><div class="shaft" style="top:640px;transform:rotate(-19deg);height:80px;opacity:.8"></div><div class="shaft" style="top:760px;transform:rotate(-25deg);height:150px;opacity:.7"></div><div id="glow"></div><div id="streak"></div><div id="flare"></div>
    <div class="gh" id="g1" style="width:120px;height:120px;background:radial-gradient(circle,rgba(255,170,120,.30),rgba(255,170,120,0) 70%)"></div>
    <div class="gh" id="g2" style="width:210px;height:210px;background:radial-gradient(circle,rgba(150,220,255,.16),rgba(150,220,255,0) 70%)"></div>
    <div class="gh" id="g3" style="width:70px;height:70px;background:radial-gradient(circle,rgba(255,240,200,.34),rgba(255,240,200,0) 70%)"></div>
    <div id="grade"></div>
    <svg id="lines" width="1080" height="1920"><line id="ld" stroke="rgba(255,255,255,.75)" stroke-width="3"/><circle id="dot" r="9" fill="#ff5a2a" stroke="#fff" stroke-width="3"/></svg>
    <div class="pin" id="pin"><b>Vice City</b><span>Ocean Drive, Miami Beach</span></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/RoundedBoxGeometry.js';

window.DUR = 6.33;
const W = 1080, H = 1920;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(11);
const R = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const sm = x => x * x * (3 - 2 * x);
const eio = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;

const SUN = new THREE.Vector3(0.74, 0.44, -0.64).normalize();        // low sun ahead, a little to the right (over the beach side)
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xf3b596, 0.0034);

// ---------- sky ----------
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { uSun: { value: SUN }, uK: { value: 1 } },
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vD; uniform vec3 uSun; uniform float uK;
    void main(){ vec3 d = normalize(vD); float h = clamp(d.y, -0.2, 1.0);
      vec3 top = vec3(0.24,0.42,0.74), mid = vec3(0.98,0.63,0.60), hor = vec3(1.0,0.80,0.56), low = vec3(0.97,0.70,0.55);
      vec3 c = mix(hor, mid, smoothstep(0.0, 0.20, h)); c = mix(c, top, smoothstep(0.14, 0.72, h)); c = mix(low, c, smoothstep(-0.06, 0.02, h));
      float s = max(dot(d, normalize(uSun)), 0.0);
      c += vec3(1.0,0.62,0.30) * pow(s, 6.0) * 0.55 + vec3(1.0,0.86,0.60) * pow(s, 60.0) * 0.9 + vec3(1.0,0.97,0.86) * pow(s, 1400.0) * 3.0;
      gl_FragColor = vec4(c * uK, 1.0); }` });
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), skyMat); sky.frustumCulled = false; scene.add(sky);
// environment for reflections = the same sky
{ const es = new THREE.Scene(); const em = skyMat.clone(); em.uniforms.uSun = { value: SUN }; em.uniforms.uK = { value: .42 }; es.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), em));
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(es, 0.02).texture; }

// soft clouds (sprites drawn on a canvas)
function cloudTex(seed){ const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d'); const r = mulberry32(seed);
  for (let i = 0; i < 46; i++){ const x = 60 + r() * 392, y = 110 + (r() - .5) * 70 * (1 - Math.abs(x - 256) / 300), rad = 26 + r() * 54;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, 'rgba(255,255,255,.34)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const clouds = [];
[[-260, 250, -700, 420, 0xffd9c4, 3], [190, 330, -760, 520, 0xffc4b0, 5], [-90, 430, -720, 380, 0xfff0e2, 8], [330, 200, -640, 360, 0xffb59a, 13], [-420, 180, -600, 330, 0xffcab2, 21], [60, 160, -820, 460, 0xffe2c8, 34]]
  .forEach(([x, y, z, s, col, seed]) => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex(seed), color: col, transparent: true, depthWrite: false, fog: false, opacity: .95 }));
    sp.position.set(x, y, z); sp.scale.set(s * 1.5, s * .22, 1); scene.add(sp); clouds.push(sp); });

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xffcdbb, 0x6a4f66, 0.62));
const sun = new THREE.DirectionalLight(0xffb870, 4.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.08; sun.shadow.radius = 3;
Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 420 }); sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xa9b4ff, 0.42); fill.position.set(-40, 50, 70); scene.add(fill);   // cool sky fill on shaded facades

// ---------- helpers ----------
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .82, metalness: 0, ...o });
function box(w, h, d, mat, x = 0, y = 0, z = 0, r = 0){ const m = new THREE.Mesh(r ? new RoundedBoxGeometry(w, h, d, 4, r) : new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; return m; }
function cyl(rt, rb, h, mat, x = 0, y = 0, z = 0, seg = 20){ const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; return m; }
function canvasTex(w, h, fn, rep){ const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }

// ---------- ground: wet-look asphalt, sidewalks, park, beach, sea ----------
const X_CURB_L = -4.7, X_CURB_R = 4.7, ZN = 60, ZF = -420, ZL = ZN - ZF, ZC = (ZN + ZF) / 2;
const asphaltTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#7b7480'; g.fillRect(0, 0, w, h); const r = mulberry32(5);
  for (let i = 0; i < 5200; i++){ const v = 90 + r() * 60; g.fillStyle = `rgba(${v + 8},${v},${v + 10},${.18 + r() * .25})`; g.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 2); }
  for (let i = 0; i < 26; i++){ g.strokeStyle = `rgba(20,18,26,${.10 + r() * .14})`; g.lineWidth = 1 + r() * 2; g.beginPath(); let x = r() * w, y = r() * h; g.moveTo(x, y);
    for (let k = 0; k < 6; k++){ x += (r() - .5) * 60; y += r() * 50; g.lineTo(x, y); } g.stroke(); } }, [3, 120]);
const roughTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#5a5a5a'; g.fillRect(0, 0, w, h); const r = mulberry32(9);
  for (let i = 0; i < 70; i++){ const x = r() * w, y = r() * h, rad = 16 + r() * 60; const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(${r() < .55 ? '20,20,20' : '150,150,150'},.55)`); gr.addColorStop(1, 'rgba(90,90,90,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill(); } }, [2, 60]);
roughTex.colorSpace = THREE.NoColorSpace;
const road = new THREE.Mesh(new THREE.PlaneGeometry(X_CURB_R - X_CURB_L, ZL), new THREE.MeshStandardMaterial({ map: asphaltTex, roughnessMap: roughTex, roughness: .55, metalness: .0, envMapIntensity: 1.0 }));
road.rotation.x = -Math.PI / 2; road.position.set(0, 0, ZC); road.receiveShadow = true; scene.add(road);
const pudTex = canvasTex(256, 256, (g, w, h) => { g.clearRect(0, 0, w, h); const r = mulberry32(31);
  for (let i = 0; i < 9; i++){ const x = 128 + (r() - .5) * 120, y = 128 + (r() - .5) * 120, rad = 30 + r() * 46; const gr = g.createRadialGradient(x, y, rad * .15, x, y, rad);
    gr.addColorStop(0, 'rgba(255,255,255,.8)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill(); } });
const pudMat = new THREE.MeshStandardMaterial({ color: 0x2b2630, roughness: .03, metalness: .0, envMapIntensity: 3.0, alphaMap: pudTex, transparent: true, depthWrite: false, opacity: .55 });
for (let i = 0; i < 16; i++){ const m = new THREE.Mesh(new THREE.PlaneGeometry(R(1.4, 2.6), R(7, 16)), pudMat); m.rotation.x = -Math.PI / 2; m.rotation.z = R(-.06, .06);
  m.position.set(pick([-2.0, -1.0, 1.0, 2.0, 2.2, -2.3]) + R(-.3, .3), .006, 10 - i * 8.5 + R(-2, 2)); m.receiveShadow = true; scene.add(m); }
// lane paint
const paintY = std(0xf2c230, { roughness: .6 }), paintW = std(0xf1ece2, { roughness: .6 });
[-0.14, 0.14].forEach(x => { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.12, ZL), paintY); m.rotation.x = -Math.PI / 2; m.position.set(x, .012, ZC); m.receiveShadow = true; scene.add(m); });
[-2.55, 2.55].forEach(x => { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.11, ZL), paintW); m.rotation.x = -Math.PI / 2; m.position.set(x, .012, ZC); m.receiveShadow = true; scene.add(m); });
for (let z = 30; z > -260; z -= 6.2) [-1, 1].forEach(s => { const m = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 0.11), paintW); m.rotation.x = -Math.PI / 2; m.position.set(s * 3.62, .012, z); m.receiveShadow = true; scene.add(m); });
for (let i = 0; i < 9; i++){ const m = new THREE.Mesh(new THREE.PlaneGeometry(X_CURB_R - X_CURB_L - 1, 0.55), paintW); m.rotation.x = -Math.PI / 2; m.position.set(0, .012, -52 - i * 1.05); m.receiveShadow = true; scene.add(m); }   // crosswalk

const paveTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#e9d9cc'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(150,120,110,.45)'; g.lineWidth = 2;
  for (let i = 0; i <= 4; i++){ g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); }
  const r = mulberry32(3); for (let i = 0; i < 900; i++){ g.fillStyle = `rgba(120,95,90,${r() * .12})`; g.fillRect(r() * w, r() * h, 2, 2); } });
function slab(x0, x1, y, mat, texRep){ const g = new THREE.BoxGeometry(x1 - x0, .16, ZL); const m = new THREE.Mesh(g, mat); m.position.set((x0 + x1) / 2, y - .08, ZC); m.receiveShadow = true; m.castShadow = false; scene.add(m); return m; }
const paveL = paveTex.clone(); paveL.wrapS = paveL.wrapT = THREE.RepeatWrapping; paveL.repeat.set(3, 240); paveL.needsUpdate = true;
const paveR = paveTex.clone(); paveR.wrapS = paveR.wrapT = THREE.RepeatWrapping; paveR.repeat.set(1.5, 240); paveR.needsUpdate = true;
slab(-9.6, X_CURB_L, .16, std(0xffffff, { map: paveL, roughness: .9 }));
slab(X_CURB_R, 7.9, .16, std(0xffffff, { map: paveR, roughness: .9 }));
slab(-60, -9.6, .14, std(0xd9c9bd));                                         // under the hotels
const grassTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#6fa04a'; g.fillRect(0, 0, w, h); const r = mulberry32(17);
  for (let i = 0; i < 5000; i++){ g.fillStyle = `rgba(${60 + r() * 70},${120 + r() * 70},${40 + r() * 40},.35)`; g.fillRect(r() * w, r() * h, 2, 3 + r() * 4); } }, [8, 200]);
slab(7.9, 30, .12, std(0xffffff, { map: grassTex, roughness: 1 }));
slab(30, 62, .10, std(0xf0d9b4, { roughness: 1 }));                           // sand
const sea = new THREE.Mesh(new THREE.PlaneGeometry(900, ZL + 600), new THREE.MeshStandardMaterial({ color: 0x2f9db0, roughness: .16, metalness: .1, envMapIntensity: 1.6 }));
sea.rotation.x = -Math.PI / 2; sea.position.set(62 + 450, .02, ZC); scene.add(sea);
// low coral rock wall along the park + winding park path
for (let z = 44; z > -300; z -= 5.2) scene.add(box(.55, .62, 4.9, std(0xe7d3c0, { roughness: 1 }), 8.4, .42, z, .12));
{ const m = new THREE.Mesh(new THREE.PlaneGeometry(2.6, ZL), std(0xf3e2cf, { roughness: 1 })); m.rotation.x = -Math.PI / 2; m.position.set(15.5, .135, ZC); m.receiveShadow = true; scene.add(m); }

// ---------- art-deco hotels (west side, facades face the street) ----------
const stripe = (a, b) => canvasTex(256, 64, (g, w, h) => { for (let i = 0; i < 8; i++){ g.fillStyle = i % 2 ? a : b; g.fillRect(i * 32, 0, 32, h); } }, [3, 1]);
const glassDark = new THREE.MeshStandardMaterial({ color: 0x27384a, roughness: .12, metalness: .55, envMapIntensity: 1.8 });
const glassWarm = new THREE.MeshStandardMaterial({ color: 0xffd9a0, roughness: .35, emissive: 0xffb760, emissiveIntensity: .75 });
const white = std(0xfff8ee, { roughness: .7 });
function hotel(o){   // local: width along X, facade at z = +d/2 looking +Z; rotated so +Z -> world +X
  const { w, floors = 3, d = 15, col, acc, awn, style = 0 } = o; const fh = 3.55, h = floors * fh + 1.0; const G = new THREE.Group();
  const wall = std(col, { roughness: .78 }), accent = std(acc, { roughness: .7 }), zf = d / 2;
  G.add(box(w, h, d, wall, 0, h / 2, 0, .55));
  G.add(box(w + .5, .34, d + .5, white, 0, h + .02, 0, .12));                                   // parapet
  G.add(box(w + .2, .22, d + .2, accent, 0, h - .55, 0, .08));
  const bays = Math.max(4, Math.round(w / 3.1)); const bw = w / bays;
  for (let f = 0; f < floors; f++){ const y0 = f * fh + 1.15 + (f === 0 ? .25 : 0);
    for (let b = 0; b < bays; b++){ const cx = -w / 2 + bw * (b + .5); const mid = Math.abs(cx) < 1.7;
      if (mid && style !== 2) continue;                                                       // the centre bay is the fin
      if (f === 0){ // lobby glazing
        const gl = new THREE.Mesh(new THREE.PlaneGeometry(bw * .78, 2.5), rnd() < .6 ? glassWarm : glassDark); gl.position.set(cx, 1.55, zf + .03); G.add(gl); continue; }
      const win = new THREE.Mesh(new THREE.PlaneGeometry(bw * .62, 1.72), rnd() < .22 ? glassWarm : glassDark); win.position.set(cx, y0 + .9, zf + .03); G.add(win);
      G.add(box(bw * .66, .07, .1, white, cx, y0 + .9, zf + .06));                              // mullion
      G.add(box(bw * .7, .1, .3, white, cx, y0 - .02, zf + .14));                               // sill
    }
    if (f > 0) G.add(box(w * .965, .13, .95, f % 2 ? accent : white, 0, y0 + 2.0, zf + .42, .05));   // "eyebrow" sun shade
  }
  // racing stripes near the two rounded corners
  [-1, 1].forEach(s => { for (let k = 0; k < 3; k++) G.add(box(1.9, .13, .12, accent, s * (w / 2 - 1.25), fh * 1.02 + 2.6 + k * .32, zf + .05)); });
  // centre fin / tower with stepped tiers and a blank vertical sign
  if (style !== 2){ const th = h + (style === 1 ? 5.2 : 3.6);
    G.add(box(3.1, th, 1.3, wall, 0, th / 2, zf + .35, .28));
    G.add(box(2.2, th + 1.3, 1.0, accent, 0, (th + 1.3) / 2, zf + .55, .22));
    G.add(box(1.25, th + 2.5, .8, white, 0, (th + 2.5) / 2, zf + .72, .16));
    [-1, 1].forEach(s => G.add(box(.34, th - 1.4, .9, white, s * 1.95, (th - 1.4) / 2, zf + .5, .1)));
    G.add(box(.62, 5.2, .16, new THREE.MeshStandardMaterial({ color: 0xfff3dc, emissive: 0xffd9a6, emissiveIntensity: .55, roughness: .5 }), 0, th - 3.4, zf + 1.14, .06));   // blank sign
    G.add(cyl(.045, .07, 3.4, white, 0, th + 4.1, zf + .72, 8));
  } else { // corner drum
    G.add(cyl(3.0, 3.0, h + 2.2, wall, -w / 2 + 1.6, (h + 2.2) / 2, zf - 1.4, 36));
    G.add(cyl(3.25, 3.25, .3, white, -w / 2 + 1.6, h + 2.3, zf - 1.4, 36));
    for (let k = 1; k < floors + 1; k++) G.add(cyl(3.2, 3.2, .16, accent, -w / 2 + 1.6, k * fh + .9, zf - 1.4, 36));
    G.add(cyl(.05, .08, 4.2, white, -w / 2 + 1.6, h + 4.4, zf - 1.4, 8)); }
  // porch: slab, round columns, striped awning, steps
  G.add(box(w * .97, .26, 2.7, white, 0, 3.52, zf + 1.35, .1));
  G.add(box(w * .97, .5, .22, accent, 0, 3.26, zf + 2.62, .06));
  const nc = Math.max(4, Math.round(w / 4.4)); for (let i = 0; i < nc; i++) G.add(cyl(.2, .2, 3.3, white, -w * .45 + i * (w * .9 / (nc - 1)), 1.72, zf + 2.4, 18));
  G.add(box(w * .97, .34, 2.8, std(0xe9d9cc), 0, .33, zf + 1.4));
  const aw = new THREE.Mesh(new THREE.PlaneGeometry(w * .93, 1.9), new THREE.MeshStandardMaterial({ map: stripe(awn, '#fff8ee'), side: THREE.DoubleSide, roughness: .9 }));
  aw.position.set(0, 3.0, zf + 3.45); aw.rotation.x = -Math.PI / 2 + .42; aw.castShadow = true; G.add(aw);
  // sidewalk café: umbrellas + tables
  const um = std(awn, { roughness: .9 });
  for (let x = -w / 2 + 2.2; x < w / 2 - 1.5; x += 3.5){ const z = zf + 4.05 + R(-.15, .15);
