{ const cg = new THREE.CircleGeometry(1, 9); cg.rotateX(-Math.PI / 2); const N = 620, im = new THREE.InstancedMesh(cg, new THREE.MeshStandardMaterial({ roughness: .9 }), N); const col = new THREE.Color(); const cols = ['#2f8f86', '#3a9c8f', '#74b86a', '#9ccf6c', '#4c9a62', '#2a7f7c'];

  [-12.5, -82, RY + .3], [-13, -70, RY + .3], [-14.5, -56, RY], [-17, -42, RY], [-18.5, -28, RY], [-21, -17, RY], [-22, -9, RY + .2], [-19.5, -3, BY], [-17, 3, RY],

KEYS.forEach(([x, z, a, b, r]) => { for (let i = 0; i < 12; i++) { const u = (rnd() - .5) * a * 1.6, v = (rnd() - .5) * b * 1.5; if (Math.abs(v) < 1.6) continue; addPalm(x + u * Math.cos(r) - v * Math.sin(r), z + u * Math.sin(r) + v * Math.cos(r), .85); } });
const trunkG = new THREE.CylinderGeometry(.09, .16, 2.4, 5); trunkG.translate(0, 1.2, 0);
const leafG = new THREE.ConeGeometry(.28, 1.7, 4); leafG.rotateZ(-Math.PI / 2 - .45); leafG.translate(.78, 2.25, 0); leafG.scale(1, 1, .45);
const trunkI = new THREE.InstancedMesh(trunkG, std('#9a6f4d'), palmPos.length), leafI = new THREE.InstancedMesh(leafG, std('#3f9a4a'), palmPos.length * 7);
const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), UP = V(0, 1, 0);
palmPos.forEach(([x, z, s, r], i) => { M4.compose(V(x, .6, z), Q.setFromAxisAngle(UP, r), V(s, s, s)); trunkI.setMatrixAt(i, M4); for (let k = 0; k < 7; k++) { M4.compose(V(x, .6, z), Q.setFromAxisAngle(UP, r + k / 7 * 6.2832), V(s, s, s)); leafI.setMatrixAt(i * 7 + k, M4); } });
trunkI.castShadow = leafI.castShadow = true; scene.add(trunkI, leafI);

// ---------- cars ----------
function car(body, police = false) {
  const g = new THREE.Group();
  const prof = new THREE.Shape(); [[-1.75, .22], [1.75, .22], [1.78, .55], [1.1, .66], [.45, 1.05], [-.75, 1.08], [-1.4, .74], [-1.78, .7]].forEach((q, i) => i ? prof.lineTo(q[0], q[1]) : prof.moveTo(q[0], q[1]));
  const bg = new THREE.ExtrudeGeometry(prof, { depth: 1.5, bevelEnabled: true, bevelSize: .06, bevelThickness: .06, bevelSegments: 1 }); bg.translate(0, 0, -.75); bg.rotateY(-Math.PI / 2);
  const b = new THREE.Mesh(bg, new THREE.MeshStandardMaterial({ color: body, roughness: .3, metalness: .35 })); g.add(b);
  const c = new THREE.Mesh(new THREE.BoxGeometry(1.36, .34, 1.15), new THREE.MeshStandardMaterial({ color: '#141a26', roughness: .15, metalness: .6 })); c.position.set(0, .86, -.12); g.add(c);
  if (police) { const d1 = new THREE.Mesh(new THREE.BoxGeometry(1.64, .3, 1.2), std('#f4f6fb')); d1.position.set(0, .52, -.1); g.add(d1); }
  const wG = new THREE.CylinderGeometry(.34, .34, .3, 10); wG.rotateZ(Math.PI / 2); [[-.75, 1.05], [.75, 1.05], [-.75, -1.05], [.75, -1.05]].forEach(([x, z]) => { const w = new THREE.Mesh(wG, std('#15151a')); w.position.set(x, .34, z); g.add(w); });
  if (police) {
    g.userData.L = [['#ff2a2a', -.36], ['#2a66ff', .36]].map(([col, x]) => { const l = new THREE.Mesh(new THREE.BoxGeometry(.5, .2, .34), new THREE.MeshBasicMaterial({ color: col, fog: false, toneMapped: false })); l.position.set(x, 1.2, -.15); g.add(l);
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloSprite(col), blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true })); s.position.set(x, 1.5, -.15); s.scale.set(5, 5, 1); g.add(s); return [l, s]; }); }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; }); g.scale.setScalar(1.25); scene.add(g); return g;
}
function haloSprite(col) { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const r = g.createRadialGradient(64, 64, 2, 64, 64, 64); r.addColorStop(0, col); r.addColorStop(.25, col + 'aa'); r.addColorStop(1, col + '00'); g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); }
const hero = car('#e0246e'), cop1 = car('#1b2130', true), cop2 = car('#1b2130', true);
function place(g, u, lane = 0) { u = cl(u); const p = curve.getPointAt(u), q = curve.getPointAt(cl(u + .004)); const dx = q.x - p.x, dz = q.z - p.z, l = Math.hypot(dx, dz) || 1; g.position.set(p.x - dz / l * lane, p.y + .16, p.z + dx / l * lane); g.rotation.y = Math.atan2(dx, dz); }

// ---------- boats + wakes ----------
const wakeT = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.beginPath(); g.moveTo(32, 0); g.lineTo(64, 256); g.lineTo(48, 256); g.lineTo(32, 40); g.lineTo(16, 256); g.lineTo(0, 256); g.closePath(); g.fill(); return new THREE.CanvasTexture(c); })();
const boats = [[20, -80, 2.4, 1.1], [12, -98, -.6, .9], [3, -76, 1.2, 1], [24, -104, 3.6, 1], [-2, -10, .5, 1.2], [-8, 14, 2.2, 1], [-40, 28, 1.0, 1.1], [-60, 44, 2.6, 1], [-30, 52, 4.2, 1.2], [-76, 80, 1.6, 1.1], [44, -92, 0.3, 1.3], [-52, 70, 5.2, 1]].map(([x, z, r, s]) => {
  const g = new THREE.Group(); const h = new THREE.Mesh(new THREE.ConeGeometry(.55, 2.4, 4), std('#ffffff', { flatShading: true })); h.rotation.x = Math.PI / 2; h.scale.set(1, 1, .5); h.position.y = .25; g.add(h);
  const cb = new THREE.Mesh(new THREE.BoxGeometry(.6, .4, .7), std('#2b3a55')); cb.position.set(0, .55, -.3); g.add(cb);
  const w = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 11), new THREE.MeshBasicMaterial({ map: wakeT, transparent: true, depthWrite: false, opacity: .8 })); w.rotation.x = -Math.PI / 2; w.position.set(0, .06, -6.2); w.renderOrder = 2; g.add(w);
  g.position.set(x, 0, z); g.rotation.y = r; g.scale.setScalar(s); g.userData = { x, z, r }; h.castShadow = true; scene.add(g); return g; });

// ---------- overlay ----------
const wanted = document.getElementById('wanted'); const stars = [];
for (let i = 0; i < 5; i++) { wanted.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.2 6.8.8-5 4.7 1.3 6.7-6-3.3-6 3.3 1.3-6.7-5-4.7 6.8-.8z" fill="#3b3446" stroke="#6a6276" stroke-width="1.2" stroke-linejoin="round"/></svg>'); stars.push(wanted.lastChild.firstChild); }
const pA = document.getElementById('pA'), pB = document.getElementById('pB'), tmp = V(0, 0, 0);
function pin(el, wp, a) { tmp.copy(wp).project(cam); const x = Math.max(215, Math.min(W - 250, (tmp.x * .5 + .5) * W)), y = (-tmp.y * .5 + .5) * H; el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.opacity = tmp.z < 1 ? a : 0; el.style.transform = el.classList.contains('down') ? `translate(-14%,-11px) scale(${.6 + .4 * a})` : `translate(-50%,-100%) scale(${.6 + .4 * a})`; el.style.transformOrigin = el.classList.contains('down') ? '50% 0' : '50% 100%'; }

// ---------- camera ----------
const HEAD3 = curve.getPointAt(prog(3.2));
const CAM = [   // t, position, look-at  (one calm crane move, always heading south-west, into the sunset)
  [0.0, V(100, 17, -118), V(21, 7, -83)],
  [1.3, V(90, 27, -110), V(10, 4, -78)],
  [3.2, HEAD3.clone().add(V(30, 24, -30)), HEAD3.clone().add(V(-14, 2, 12))],
  [4.9, V(92, 150, -200), V(-28, 0, -14)],
  [6.33, V(98, 160, -212), V(-29, 0, -11)]];
function camAt(t) { let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++; const a = CAM[i], b = CAM[i + 1], k = sm(cl((t - a[0]) / (b[0] - a[0])));
  // smooth through keys with a Catmull-Rom on the key list
  const g = (j) => CAM[Math.max(0, Math.min(CAM.length - 1, j))]; const cr = (n, kk) => { const p0 = g(i - 1)[n], p1 = a[n], p2 = b[n], p3 = g(i + 2)[n]; const o = V(0, 0, 0); ['x', 'y', 'z'].forEach(ax => { const v0 = p0[ax], v1 = p1[ax], v2 = p2[ax], v3 = p3[ax]; o[ax] = .5 * ((2 * v1) + (-v0 + v2) * kk + (2 * v0 - 5 * v1 + 4 * v2 - v3) * kk * kk + (-v0 + 3 * v1 - 3 * v2 + v3) * kk * kk * kk); }); return o; };
  const kk = cl((t - a[0]) / (b[0] - a[0])); cam.position.copy(cr(1, kk)); cam.lookAt(cr(2, kk)); cam.position.y += Math.sin(t * 1.3) * .25; }

// ---------- timeline ----------
function prog(t) { const x = ramp(t, 0.0, 5.7); return 0.06 + 0.94 * (0.35 * x + 0.65 * io(x)); }
window.draw = function (t) {
  t = Math.max(0, Math.min(window.DUR, +t || 0));
  const u = cl(prog(t)); const n = Math.floor(u * NS) * 6;
  route.geometry.setDrawRange(0, n); glow.geometry.setDrawRange(0, n);
  place(hero, u, -.35); place(cop1, u - 0.034 - .004 * Math.sin(t * 2), .45); place(cop2, u - 0.056 + .004 * Math.sin(t * 1.7), -.5);
  camAt(t); const far = cl((cam.position.y - 30) / 70); [hero, cop1, cop2].forEach(g => g.scale.setScalar(1.0 + far * 2.0));
  [cop1, cop2].forEach((c, ci) => c.userData.L.forEach(([l, s], k) => { const on = (Math.floor(t * 7 + ci) + k) % 2 === 0; l.material.opacity = on ? 1 : .25; l.material.transparent = true; s.material.opacity = on ? .95 : .12; s.scale.setScalar(on ? 2.4 + far * 2.2 : 1.4); }));
  boats.forEach((b, i) => { const d = t * (1.2 + (i % 3) * .5); b.position.set(b.userData.x + Math.sin(b.userData.r) * d, 0, b.userData.z + Math.cos(b.userData.r) * d); });
  water.material.uniforms.t.value = t; water.material.uniforms.camP.value.copy(cam.position);
  cam.updateMatrixWorld();
  const lit = 1 + Math.floor(ramp(t, 0.5, 4.6) * 4.001); stars.forEach((s, i) => { const on = i < lit; s.setAttribute('fill', on ? '#ffc23a' : '#3b3446'); s.setAttribute('stroke', on ? '#fff0c2' : '#6a6276'); });
  pin(pA, V(31, 3.2, -79), sm(ramp(t, 0.05, 0.45)) * (1 - sm(ramp(t, 2.0, 2.5))) + sm(ramp(t, 4.3, 4.9)));
  pin(pB, V(-106, 3.2, 72), sm(ramp(t, 4.6, 5.3)));
  renderer.render(scene, cam);
};
window.DBG={route,glow,hero,cam,scene,THREE,curve};
const q = new URLSearchParams(location.search); window.draw(+(q.get('t') || 0));
requestAnimationFrame(() => { document.title = 'ok'; });
