<!doctype html>
<html lang="en">

<meta charset="utf-8">
<title>loading</title>
<!-- gta57 r0: "/3d-map the GTA 6 map in real life" (STYLE FRAMES; draw(t) is ready for animation, t = 0..6.33 s).
     A 3D model of REAL south Florida at golden hour, drawn in code. Coast, islands, lakes, urban areas and roads: Natural Earth 1:10m
     (public domain), see map3d_data.js. Miami Beach barrier island and the two causeways are added by hand at their real positions.
     Labels put GTA VI's place names (as plain text) over their real-life counterparts:
       Vice City ~ Miami, Leonida Keys ~ Florida Keys, Grassrivers ~ Everglades.
     Names as published on Rockstar's GTA VI site (reported by Game Informer, 2025-05-06: Vice City, Leonida Keys, Grassrivers,
     Port Gellhorn, Ambrosia, Mount Kalaga National Park). Our own rendering and label design: no Rockstar map art, logo, font or character. -->
<style>

canvas{position:absolute;inset:0;width:1080px;height:1920px;display:block}
#grade{position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(120% 85% at 50% 46%,rgba(0,0,0,0) 55%,rgba(30,8,20,.42) 100%),
            linear-gradient(180deg,rgba(255,150,90,.10) 0%,rgba(255,170,120,0) 34%,rgba(20,30,70,.10) 100%)}
.lb{position:absolute;left:0;top:0;opacity:0;will-change:transform;color:#fff;text-align:center;white-space:nowrap;transform-origin:50% 100%}
.lb b{display:block;font-weight:800;font-size:76px;letter-spacing:-.02em;line-height:1;text-shadow:0 2px 0 rgba(40,14,10,.35),0 6px 28px rgba(40,14,10,.55),0 0 60px rgba(40,14,10,.35)}
.lb i{display:block;font-style:normal;font-weight:600;font-size:36px;letter-spacing:.01em;margin-top:12px;color:#fff3e4;text-shadow:0 2px 14px rgba(40,14,10,.7),0 0 30px rgba(40,14,10,.4)}
.lb u{display:block;text-decoration:none;width:3px;margin:18px auto 0;background:linear-gradient(180deg,#fff,rgba(255,255,255,.75));box-shadow:0 0 14px rgba(40,14,10,.5);border-radius:2px}
.lb s{display:block;text-decoration:none;width:20px;height:20px;margin:-2px auto 0;border-radius:50%;background:#fff;box-shadow:0 0 0 7px rgba(255,255,255,.28),0 4px 16px rgba(40,14,10,.6)}

  for (let i = 0; i < 9000; i++) tryAdd(lerp(-81.4, -80.38, r()), lerp(25.1, 25.42, r()), .12 + .16 * r());            // mangrove coast
  for (let i = 0; i < 26000; i++) tryAdd(lerp(-81.85, -80.3, r()), lerp(24.52, 25.3, r()), .09 + .12 * r());           // the Keys
  for (let i = 0; i < 9000; i++) tryAdd(lerp(-82.3, -80.0, r()), lerp(26.5, 27.45, r()), .12 + .2 * r());              // flatwoods north
  const geo = new THREE.IcosahedronGeometry(1, 1); const mat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1, flatShading: true });
  const im = new THREE.InstancedMesh(geo, mat, pts.length); const o = new THREE.Object3D(), col = new THREE.Color();
  pts.forEach(([lo, la, s], i) => { o.position.set(wx(lo), TOP + s * .55, wz(la)); o.scale.set(s * (1 + .6 * r()), s * (.8 + .5 * r()), s * (1 + .6 * r())); o.rotation.y = r() * 6.3; o.updateMatrix(); im.setMatrixAt(i, o.matrix); col.setHSL(.29 + .07 * r(), .5 + .2 * r(), .2 + .14 * r()); im.setColorAt(i, col); });
  im.castShadow = true; im.receiveShadow = true; scene.add(im);
})();
lap('trees');
// buildings: real urban footprints; tall where the real skylines are
(function () {
  const r = rng(33), cores = [[-80.191, 25.772, 2.7, .035], [-80.193, 25.758, 2.3, .022], [-80.131, 25.80, 1.25, .028], [-80.122, 25.87, .95, .03], [-80.14, 26.12, 1.4, .03], [-80.055, 26.712, 1.1, .03], [-80.27, 25.75, .5, .04], [-80.19, 25.81, 1.2, .03]];
  const pts = [];
  const hAt = (lo, la) => { let h = 0; for (const [cx, cy, hh, sg] of cores) { const d = Math.hypot((lo - cx) * CO, la - cy); h = Math.max(h, hh * Math.exp(-d * d / (2 * sg * sg))); } return h; };
  const urb = D.urban.filter(u => u[0][0] > -80.6 && u[0][1] < 27.2);
  for (let i = 0; i < 120000 && pts.length < 15000; i++) { const lo = lerp(-80.5, -80.0, r()), la = lerp(25.4, 26.95, r()); if (!onLand(lo, la)) continue; if (!urb.some(u => inPoly(u, lo, la))) continue; pts.push([lo, la, .07 + .12 * r() + hAt(lo, la) * (.35 + .65 * r())]); }
  for (let i = 0; i < 2600; i++) { const [cx, cy, hh, sg] = cores[Math.floor(r() * 4)], a = r() * 6.3, d = Math.abs((r() + r() + r() - 1.5)) * sg * 1.5, lo = cx + Math.cos(a) * d / CO, la = cy + Math.sin(a) * d; if (onLand(lo, la)) pts.push([lo, la, .2 + hAt(lo, la) * (.45 + .55 * r())]); }
  for (let i = 0; i < 420; i++) { const la = lerp(25.765, 25.93, r()), k = (la - 25.762) / (25.935 - 25.762), lo = lerp(-80.129, -80.1235, k) + (r() - .5) * .006; if (onLand(lo, la)) pts.push([lo, la, .25 + .9 * r() * (1 - .5 * k)]); } // Miami Beach hotel strip
  const geo = new THREE.BoxGeometry(1, 1, 1); geo.translate(0, .5, 0);
  const mat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: .55, metalness: .1 });
  const im = new THREE.InstancedMesh(geo, mat, pts.length); const o = new THREE.Object3D(), col = new THREE.Color();
  pts.forEach(([lo, la, h], i) => { const w = h > .8 ? .13 + .1 * r() : .1 + .12 * r(); o.position.set(wx(lo), TOP - .02, wz(la)); o.scale.set(w, h, w * (.7 + .6 * r())); o.rotation.y = (r() < .8 ? 0 : .5) + .05 * (r() - .5); o.updateMatrix(); im.setMatrixAt(i, o.matrix);
    const p = r(); if (p < .55) col.set('#fbe9d6'); else if (p < .75) col.set('#f6c9b6'); else if (p < .88) col.set('#bfe3e0'); else col.set('#ffe2a8'); col.multiplyScalar(.82 + .22 * r()); im.setColorAt(i, col); });
  im.castShadow = true; im.receiveShadow = true; scene.add(im);
})();
lap('buildings');
// Overseas Highway (real US-1 from Natural Earth) + the two Miami Beach causeways: a pale concrete ribbon just above the water
(function () {
  const us1 = D.roads.filter(rd => rd.n === '1' && rd.c[0][1] < 25.5 || (rd.n === '1' && rd.c[rd.c.length - 1][1] < 25.5));
  const strips = us1.map(rd => rd.c).concat([[[-80.186, 25.777], [-80.166, 25.776], [-80.146, 25.772], [-80.135, 25.771]], [[-80.186, 25.812], [-80.16, 25.812], [-80.133, 25.813]], [[-80.19, 25.748], [-80.172, 25.735], [-80.162, 25.705]]]);
  const mat = new THREE.MeshStandardMaterial({ color: '#f4e6cf', roughness: .8, emissive: '#5a4630', emissiveIntensity: .35 });
  strips.forEach(c => { const pts = c.map(([lo, la]) => new THREE.Vector3(wx(lo), TOP + .1, wz(la))); if (pts.length < 2) return; const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', .2); const g = new THREE.TubeGeometry(curve, Math.max(8, pts.length * 6), .09, 5, false); const m = new THREE.Mesh(g, mat); m.scale.y = .5; m.position.y = (TOP + .1) * .5; m.castShadow = true; scene.add(m); });
})();

// ---------- camera path: Miami -> across the Everglades -> the Keys
const P = (lo, la, h) => new THREE.Vector3(wx(lo), h, wz(la));
const KEYS = [
  { t: 0.0, p: P(-79.985, 25.905, 7.6), q: P(-80.20, 25.765, 0.6) },
  { t: 1.2, p: P(-79.975, 25.90, 8.2), q: P(-80.215, 25.76, 0.6) },
  { t: 3.2, p: P(-80.27, 26.30, 30), q: P(-80.82, 25.50, 0) },
  { t: 5.2, p: P(-80.22, 25.36, 13.5), q: P(-80.98, 24.80, 0) },
  { t: 6.33, p: P(-80.26, 25.33, 12.6), q: P(-81.04, 24.775, 0) },
];
function camAt(t) { t = Math.max(0, Math.min(DUR, t)); let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1].t) i++; const a = KEYS[i], b = KEYS[i + 1], k = eio((t - a.t) / (b.t - a.t)); return { p: a.p.clone().lerp(b.p, k), q: a.q.clone().lerp(b.q, k) }; }
const LABELS = [
  { el: document.getElementById('l0'), at: P(-80.191, 25.772, 2.9), on: 0.15, off: 2.25, len: 250 },
  { el: document.getElementById('l1'), at: P(-80.80, 25.70, TOP), on: 2.45, off: 4.35, len: 300 },
  { el: document.getElementById('l2'), at: P(-80.83, 24.86, TOP + .2), on: 4.75, off: 9, len: 300 },
];
const v = new THREE.Vector3();
function draw(t) {
  const c = camAt(t); cam.position.copy(c.p); cam.lookAt(c.q); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
  // sun + shadow frustum follow the look-at point
  sun.target.position.copy(c.q); sun.position.copy(c.q).addScaledVector(sunDir, 260);
  const sc = sun.shadow.camera, ext = 20 + cam.position.y * 3.2; sc.left = -ext; sc.right = ext; sc.top = ext; sc.bottom = -ext; sc.near = 20; sc.far = 520; sc.updateProjectionMatrix();
  scene.getObjectByName('sky').position.copy(cam.position);
  rippleTex.offset.set(t * .012, t * .02);
  renderer.render(scene, cam);
  LABELS.forEach(L => { const a = eo((t - L.on) / .45) * (1 - eo((t - L.off) / .35)); v.copy(L.at).project(cam); const x = (v.x * .5 + .5) * W, y = (-v.y * .5 + .5) * H; const el = L.el; el.querySelector('u').style.height = (L.len * eo((t - L.on - .1) / .5)) + 'px';
    el.style.opacity = v.z < 1 ? a : 0; const w = el.offsetWidth, h = el.offsetHeight; el.style.transform = `translate(${x - w / 2}px,${y - h + 10}px) scale(${.92 + .08 * a})`; });
}
lap('pre-draw'); window.draw = draw; window.DURATION = DUR;
const q = new URLSearchParams(location.search); draw(parseFloat(q.get('t') || '0.6')); lap('first draw');
document.fonts.ready.then(() => { draw(parseFloat(q.get('t') || '0.6')); document.title = 'ok'; });
</script>
