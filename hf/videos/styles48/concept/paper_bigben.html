// styles48 r1: /paper-collage why Big Ben is leaning. Generic gothic clock tower drawn in code (no photo, no logo).
// Facts (Wikipedia "Big Ben", https://en.wikipedia.org/wiki/Big_Ben, checked 2026-11-17):

const g=document.getElementById('c').getContext('2d'), MK="'Permanent Marker',cursive";
const STEP=(t)=>Math.floor(t*12)/12; // stop-motion step clock for jitter
function jit(t,seed,a){const R=R0(1+seed*131+Math.floor(t*12)*977);R();return [(R()-.5)*2*a,(R()-.5)*2*a,(R()-.5)*0.006*a];}
// ---------- background newsprint (screen space) ----------
const BG=off(1080,1920,(p,w,h)=>{p.fillStyle='#ece3cf';p.fillRect(0,0,w,h);const R=R0(4);
  for(let i=0;i<9000;i++){p.strokeStyle='rgba(120,95,60,'+(R()*.08)+')';p.lineWidth=1;const x=R()*w,y=R()*h,a=R()*6.28,l=4+R()*14;p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);p.stroke();}

  p.fillStyle='rgba(60,50,40,.10)';for(let c=0;c<4;c++)for(let y=30;y<h;y+=22){const x0=30+c*262,L=(R()<.08)?60+R()*100:210+R()*30;p.fillRect(x0,y,L,7);}});
// ---------- world sheets ----------
const SKY=off(1400,1250,(p,w,h)=>{p.save();p.translate(20,20);tornPath(p,0,0,w-40,h-40,5,14);const sk=p.createLinearGradient(0,0,0,h);sk.addColorStop(0,'#7fb3cc');sk.addColorStop(1,'#cfe2df');
  p.shadowColor='rgba(60,40,20,.35)';p.shadowBlur=16;p.shadowOffsetY=8;p.fillStyle=sk;p.fill();p.shadowColor='transparent';p.clip();

// SKY world origin: (-160,-180)
function cloud(seed,w){return sticker(off(w,w*0.42,(p)=>{const R=R0(seed);p.fillStyle='#fbf8f0';for(let i=0;i<6;i++){const x=w*(0.18+0.64*i/5),r=w*(0.12+R()*0.08);p.beginPath();p.arc(x,w*0.42-r*0.9-R()*w*0.05,r,0,7);p.fill();}
  p.fillRect(w*0.1,w*0.3,w*0.8,w*0.12);p.fillStyle='rgba(120,140,160,.25)';for(let y=0;y<w*.42;y+=9)for(let x=(y/9%2)*4;x<w;x+=9){p.globalCompositeOperation='source-atop';p.beginPath();p.arc(x,y,1.3*(y/(w*.42)),0,7);p.fill();}}),5);}
const C1=cloud(11,300),C2=cloud(23,220),C3=cloud(37,260);
// generic low gothic building behind the tower (kraft paper strip)
const HALL=off(1400,230,(p,w,h)=>{p.fillStyle='#c4a066';p.beginPath();p.moveTo(0,h);const R=R0(8);let x=0;p.lineTo(0,110);
  while(x<w){const bw=60+R()*50;p.lineTo(x,110);p.lineTo(x+6,70);p.lineTo(x+12,110);p.lineTo(x+bw-12,110);p.lineTo(x+bw-6,70+R()*20);p.lineTo(x+bw,110);x+=bw;}
  p.lineTo(w,h);p.closePath();p.shadowColor='rgba(60,40,20,.3)';p.shadowBlur=10;p.shadowOffsetY=5;p.fill();p.shadowColor='transparent';
  p.globalCompositeOperation='source-atop';for(let y=128;y<h-10;y+=34)for(let x=10;x<w;x+=26){p.fillStyle='rgba(80,55,25,.35)';p.beginPath();p.moveTo(x,y+22);p.lineTo(x,y+6);p.quadraticCurveTo(x+6,y-2,x+12,y+6);p.lineTo(x+12,y+22);p.fill();}
  for(let y=110;y<h;y+=9)for(let x=(y/9%2)*4;x<w;x+=9){p.fillStyle='rgba(110,70,35,.18)';p.beginPath();p.arc(x,y,1.4,0,7);p.fill();}});
// HALL world origin: (-160,790)
// ---------- the tower (offscreen coords: axis x=150, finial tip y=35, base y=800, slab to 840) ----------
const TOWER=sticker(off(300,845,(p)=>{const cx=150;
  const dots=(x0,y0,w,h,col,s)=>{p.save();p.beginPath();p.rect(x0,y0,w,h);p.clip();for(let y=y0;y<y0+h;y+=s)for(let x=x0+((y-y0)/s%2)*s/2;x<x0+w;x+=s){p.fillStyle=col;p.beginPath();p.arc(x,y,s*0.17,0,7);p.fill();}p.restore();};
  // concrete slab
  p.fillStyle='#9a9a94';p.fillRect(cx-112,800,224,40);dots(cx-112,800,224,40,'rgba(40,40,40,.25)',8);
  // shaft

  p.fillStyle=sh;p.fillRect(cx-85,440,170,345);p.fillStyle='#b48a48';p.fillRect(cx-95,775,190,25);
  p.strokeStyle='rgba(110,75,35,.55)';p.lineWidth=2;for(let x=cx-85+17;x<cx+85;x+=17){p.beginPath();p.moveTo(x,450);p.lineTo(x,775);p.stroke();}
  for(let y=500;y<775;y+=55){p.fillStyle='rgba(110,75,35,.45)';p.fillRect(cx-85,y,170,5);}
  for(let y=470;y<760;y+=55)for(let x of [cx-34,cx,cx+34]){p.fillStyle='#4a3a28';p.beginPath();p.moveTo(x-6,y+30);p.lineTo(x-6,y+10);p.lineTo(x,y);p.lineTo(x+6,y+10);p.lineTo(x+6,y+30);p.fill();}
  dots(cx-85,440,170,345,'rgba(110,70,35,.22)',9);
  // clock stage
  p.fillStyle='#d6b06c';p.fillRect(cx-97,290,194,155);p.fillStyle='#b48a48';p.fillRect(cx-100,438,200,12);p.fillRect(cx-100,284,200,10);
  p.fillStyle='#e8a33a';p.fillRect(cx-80,300,160,140);
  p.fillStyle='#fbf6e6';p.beginPath();p.arc(cx,370,64,0,7);p.fill();p.strokeStyle='#1d2630';p.lineWidth=6;p.stroke();
  p.lineWidth=2;p.beginPath();p.arc(cx,370,52,0,7);p.stroke();
  for(let i=0;i<12;i++){const a=i/12*6.283;p.lineWidth=i%3?3:5;p.beginPath();p.moveTo(cx+Math.cos(a)*54,370+Math.sin(a)*54);p.lineTo(cx+Math.cos(a)*62,370+Math.sin(a)*62);p.stroke();}
  p.lineCap='round';p.lineWidth=6;p.beginPath();p.moveTo(cx,370);p.lineTo(cx+22,370-34);p.stroke();p.lineWidth=4;p.beginPath();p.moveTo(cx,370);p.lineTo(cx-4,370-50);p.stroke();
  p.fillStyle='#1d2630';p.beginPath();p.arc(cx,370,6,0,7);p.fill();dots(cx-97,290,194,155,'rgba(110,70,35,.16)',9);
  // belfry with pointed arches
  p.fillStyle='#d9b877';p.fillRect(cx-82,215,164,72);
  for(const x of [cx-52,cx,cx+52]){p.fillStyle='#3a3226';p.beginPath();p.moveTo(x-15,280);p.lineTo(x-15,240);p.quadraticCurveTo(x-15,222,x,214);p.quadraticCurveTo(x+15,222,x+15,240);p.lineTo(x+15,280);p.fill();}
  // corner pinnacles
  p.fillStyle='#b48a48';for(const x of [cx-100,cx+100]){p.beginPath();p.moveTo(x-10,292);p.lineTo(x,236);p.lineTo(x+10,292);p.fill();}
  for(const x of [cx-84,cx+84]){p.beginPath();p.moveTo(x-9,218);p.lineTo(x,160);p.lineTo(x+9,218);p.fill();}
  // slate roof + spire
  p.fillStyle='#3d4b5a';p.beginPath();p.moveTo(cx-78,218);p.lineTo(cx-36,118);p.lineTo(cx+36,118);p.lineTo(cx+78,218);p.closePath();p.fill();
  p.strokeStyle='rgba(255,255,255,.18)';p.lineWidth=2;for(let y=128;y<218;y+=12){const k=(y-118)/100;p.beginPath();p.moveTo(cx-36-42*k,y);p.lineTo(cx+36+42*k,y);p.stroke();}
  p.fillStyle='#e8a33a';p.fillRect(cx-40,112,80,8);
  p.fillStyle='#2f3b48';p.beginPath();p.moveTo(cx-32,112);p.lineTo(cx,52);p.lineTo(cx+32,112);p.closePath();p.fill();
  p.fillStyle='#e8a33a';p.fillRect(cx-2.5,22,5,34);p.beginPath();p.arc(cx,48,6,0,7);p.fill();p.fillRect(cx-9,30,18,4);
  }),6);
// ---------- ground cross-section (world origin (-160,995)) ----------
const SOIL=off(1400,640,(p,w,h)=>{const R=R0(3);
  p.fillStyle='#d2b27a';p.fillRect(0,0,w,110); // gravel band (world 995..1105)
  for(let i=0;i<2600;i++){const x=R()*w,y=6+R()*100,r=2+R()*6;p.fillStyle=['#a8875a','#8f7a5e','#e6d2a6','#7b6a52','#bfa071'][Math.floor(R()*5)];p.beginPath();p.ellipse(x,y,r*1.3,r,R()*3,0,7);p.fill();}
  // London Clay: blue-grey/brown, layered
  const cl=p.createLinearGradient(0,110,0,h);cl.addColorStop(0,'#8d7f6c');cl.addColorStop(1,'#6c6a66');p.fillStyle=cl;
  p.beginPath();p.moveTo(0,110);for(let x=0;x<=w;x+=40)p.lineTo(x,108+Math.sin(x*.03)*5+(R()-.5)*4);p.lineTo(w,h);p.lineTo(0,h);p.closePath();p.fill();
  p.strokeStyle='rgba(50,40,30,.25)';p.lineWidth=3;for(let y=150;y<h;y+=42){p.beginPath();for(let x=0;x<=w;x+=20){const yy=y+Math.sin(x*.012+y)*7;x?p.lineTo(x,yy):p.moveTo(x,yy);}p.stroke();}
  for(let y=120;y<h;y+=11)for(let x=(y/11%2)*5;x<w;x+=11){p.fillStyle='rgba(30,25,20,.16)';p.beginPath();p.arc(x,y,1.8,0,7);p.fill();}
  p.fillStyle='rgba(40,30,20,.35)';p.fillRect(0,0,w,3);});
// pavement / lawn cover sheet that tears away (world origin (-160,985))
const COVER=off(1460,700,(p,w,h)=>{p.save();tornPath(p,10,10,w-20,h-20,31,16);p.shadowColor='rgba(40,30,20,.45)';p.shadowBlur=22;p.shadowOffsetY=-6;p.fillStyle='#7d9656';p.fill();p.shadowColor='transparent';p.clip();
  p.fillStyle='#b9b4a6';p.fillRect(0,0,w,46);p.strokeStyle='rgba(60,60,60,.3)';p.lineWidth=2;for(let x=0;x<w;x+=70){p.beginPath();p.moveTo(x,10);p.lineTo(x,46);p.stroke();}
  for(let y=50;y<h;y+=10)for(let x=(y/10%2)*5;x<w;x+=10){p.fillStyle='rgba(30,60,20,.25)';p.beginPath();p.arc(x,y,1.7,0,7);p.fill();}
  // print on back of the sheet: hint of newsprint
  p.fillStyle='rgba(20,40,10,.18)';const R=R0(5);for(let y=90;y<h;y+=26){p.fillRect(60,y,300+R()*500,8);}p.restore();});
// ---------- labels (screen space) ----------
function tag(lt,t0,x,y,rot,W,lines,seed,side,grow){ if(lt<t0) return; const a=EBK((lt-t0)/0.45);
  let H=30; lines.forEach(L=>{L._y=H+L.s*0.8;H+=L.s*1.05*(L.k==null?1:L.k);}); H+=18;
  const j=jit(lt,seed,1.2);
  g.save(); g.translate(x+W/2+j[0],y+H/2+j[1]); g.rotate(rot+j[2]+(1-a)*0.25); g.scale(0.4+0.6*a,0.4+0.6*a); g.globalAlpha=CL((lt-t0)/0.12); g.translate(-W/2,-H/2);
  tornPath(g,0,0,W,H,seed,7); g.fillStyle='#f6f1e4'; g.shadowColor='rgba(30,20,10,.4)'; g.shadowBlur=18; g.shadowOffsetY=10; g.fill(); g.shadowColor='transparent';
  lines.forEach(L=>{ const la=L.k==null?1:L.k; if(la<=0.01) return; g.save(); g.globalAlpha*=CL(la*1.4-0.3); g.font=L.f; const w=g.measureText(L.t).width;
    if(L.hl!=null){const hl=EIO((lt-t0-L.hl)/0.4); if(hl>0){ g.fillStyle='rgba(255,214,0,.9)'; g.beginPath(); g.moveTo(24,L._y-L.s*0.78); g.lineTo(24+(w+24)*hl,L._y-L.s*0.84); g.lineTo(24+(w+24)*hl,L._y+L.s*0.22); g.lineTo(24,L._y+L.s*0.2); g.closePath(); g.fill(); }}
    g.fillStyle=L.c; g.fillText(L.t,36,L._y); g.restore(); });
  g.fillStyle='rgba(240,232,200,.85)'; g.save(); g.translate(side?W-30:30,-4); g.rotate(side?0.5:-0.5); g.fillRect(-46,-14,92,30); g.restore(); g.restore(); }
function birds(lt,cx,cy){g.save();g.strokeStyle='#26313b';g.lineWidth=4;g.lineCap='round';for(let i=0;i<4;i++){const x=cx+i*46+lt*38+(i%2)*14,y=cy+(i%2)*26+Math.sin(lt*3+i)*6,f=Math.sin(STEP(lt)*14+i*2)*7;
  g.beginPath();g.moveTo(x-13,y-4-f);g.quadraticCurveTo(x-5,y-8,x,y);g.quadraticCurveTo(x+5,y-8,x+13,y-4-f);g.stroke();}g.restore();}
const TH=5*Math.PI/180; // drawn tilt (exaggerated)
function draw(lt){
  // camera
  let s,fx,fy,sx,sy; {const c=EIO((lt-2.9)/1.3); s=1.42+0.04*CL(lt/2.9)-c*(0.46+0.04)+0.02*CL((lt-4.2)/2.1); fx=540+18*(1-c); fy=610+260*c; sx=540; sy=880;}
  g.setTransform(1,0,0,1,0,0); g.drawImage(BG,0,0);
  g.save(); g.translate(sx,sy); g.scale(s,s); g.translate(-fx,-fy);
  g.drawImage(SKY,-180,-200);
  const cj=(n)=>jit(lt,n,1.5);
  {let j=cj(1);g.drawImage(C1,-120+lt*14+j[0],60+j[1]);j=cj(2);g.drawImage(C2,760-lt*10+j[0],330+j[1]);j=cj(3);g.drawImage(C3,90+lt*9+j[0],520+j[1]);}
  birds(lt,640,170);
  g.drawImage(SOIL,-160,995);
  {const j=cj(4);g.drawImage(HALL,-160+j[0]*.5,775);}
  // tilt
  const tt=E3((lt-1.45)/1.5), th=TH*tt+ (lt>1.45?Math.sin((lt-1.45)*5)*0.004*Math.exp(-(lt-1.45)*1.6):0);
  // sinking hints under the NW (left) side of the slab: little arrows into the clay
  if(lt>4.5){const a=E3((lt-4.5)/0.5);for(let i=0;i<3;i++){const x=440+i*36,y=1080+i*10+((lt*40+i*12)%28);g.globalAlpha=a*0.85;marker(g,[[x,y],[x-6,y+42]],1,7,'#d7262e');arrowHead(g,x-6,y+42,1.71,16,7,'#d7262e');}g.globalAlpha=1;}
  {const j=jit(lt,7,0.8);g.save();g.translate(540+j[0],1040+j[1]);g.rotate(-th);g.drawImage(TOWER,-150-TOWER.ox,-840-TOWER.oy);g.restore();}
  // plumb line: hangs straight down from where the tip would be if upright
  const pf=E3((lt-0.55)/1.0);
  if(pf>0){const yb=200+760*pf; g.save(); g.strokeStyle='#d7262e'; g.lineWidth=5; g.setLineDash([18,14]); g.lineDashOffset=-lt*10; g.beginPath(); g.moveTo(540,200); g.lineTo(540,yb); g.stroke(); g.setLineDash([]);
    const sw=Math.sin(lt*6)*0.12*Math.exp(-lt*1.2); g.translate(540,yb); g.rotate(sw); g.fillStyle='#d7262e'; g.shadowColor='rgba(30,20,10,.4)'; g.shadowBlur=8; g.shadowOffsetY=4;
    g.beginPath(); g.moveTo(-14,0); g.lineTo(14,0); g.lineTo(0,34); g.closePath(); g.fill(); g.restore();
    g.fillStyle='#d7262e'; g.beginPath(); g.arc(540,200,8,0,7); g.fill(); }
  // gap arrow at the top (between the plumb line and the leaning tip)
  const gf=E3((lt-2.3)/0.5); if(gf>0){const y=262, xt=540-Math.sin(th)*(1040-y)+4; const xa=540-(540-xt)*gf;
    marker(g,[[536,y],[xa,y]],1,6,'#17222b'); if(gf>0.6){arrowHead(g,xa,y,Math.PI,14,6,'#17222b');arrowHead(g,536,y,0,14,6,'#17222b');}}
  // cover sheet tears away to reveal the ground
  const cp=EIO((lt-3.05)/1.0); if(cp<1){g.save(); g.translate(540+cp*760,985+cp*420); g.rotate(cp*0.42); g.translate(-700,0); g.drawImage(COVER,0,0); g.restore();}
  g.restore();
  // labels
  const nw=EIO((lt-4.85)/0.5);
  tag(lt,2.35,575,236,0.015,430,[{t:'leans ~50 cm',f:"400 62px "+DISP,s:62,c:'#17222b',hl:0.3},{t:'at the top',f:"400 62px "+DISP,s:62,c:'#17222b'},
     {t:'to the north-west',f:"400 50px "+DISP,s:50,c:'#b3261e',k:nw},{t:'tilt exaggerated',f:"italic 500 34px "+SERIF,s:34,c:'#4c4338'}],21,1);
  tag(lt,3.85,80,1012,-0.02,250,[{t:'gravel',f:"400 60px "+DISP,s:60,c:'#17222b',hl:0.25}],12,0);
  tag(lt,4.25,80,1235,0.015,390,[{t:'London Clay',f:"400 60px "+DISP,s:60,c:'#17222b',hl:0.25},{t:'soft ground',f:"italic 500 40px "+SERIF,s:40,c:'#4c4338'}],17,0);
  g.drawImage(GRAIN,0,0);}
