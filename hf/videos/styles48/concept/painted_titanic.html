function strokes(p,n,R,x0,y0,w,h,cols,len,wid,ang,a0,a1){a0=a0??0.08;a1=a1??0.22;for(let i=0;i<n;i++){const x=x0+R()*w,y=y0+R()*h,l=len*(0.5+R()),a=(ang||0)+(R()-.5)*0.5;

const WW=2600, WH=4200, SURF=640, BED=3930, BX=2190, BY=3700, BR=235;

  const s=p.createLinearGradient(0,0,0,SURF);s.addColorStop(0,'#070b1c');s.addColorStop(.6,'#16203e');s.addColorStop(1,'#2c3658');p.fillStyle=s;p.fillRect(0,0,w,SURF);
  strokes(p,2600,R,-40,0,w+80,SURF,['#0e1630','#1c2848','#26325a','#0a0f22'],170,30,0);
  for(let k=0;k<6;k++){const cy=150+k*70+R()*30;strokes(p,140,R,-60+R()*1600,cy,900+R()*500,24,['#3a4a72','#55658e','#1a2440'],120,14,-0.02,0.1,0.22);}
  for(let i=0;i<260;i++){p.fillStyle='rgba(235,240,255,'+(R()*.75)+')';p.beginPath();p.arc(R()*w,R()*SURF*.8,R()*2.4,0,7);p.fill();}

  p.fillStyle='#f4f0dc';p.beginPath();p.arc(980,250,46,0,7);p.fill();p.fillStyle='rgba(200,195,170,.5)';p.beginPath();p.arc(966,240,10,0,7);p.arc(994,266,7,0,7);p.fill();
  // water column: moonlit blue near the surface, black-blue in the deep

  strokes(p,2200,R,-40,SURF,w+80,900,['#1e4a6a','#0c2440','#2a5a7a','#081a30'],180,26,0.05,0.06,0.16);

  // god rays from the moon in the top water

  // sea surface: moon glitter and painted swell
  strokes(p,900,R,-40,SURF-14,w+80,30,['#4a6a92','#1a3050','#7a92b8'],90,8,0,0.2,0.3);
  for(let i=0;i<26;i++){const y=SURF-6+i*7,ww=180-i*5+R()*60;p.fillStyle='rgba(230,235,255,'+(0.55-i*.02)+')';p.fillRect(980-ww/2+(R()-.5)*60,y,ww,3);}

  p.fillStyle='#0a0d18';p.beginPath();p.moveTo(70,-40);p.lineTo(640,-40);p.lineTo(660,-8);p.lineTo(640,14);p.lineTo(120,14);p.quadraticCurveTo(70,-10,40,-56);p.closePath();p.fill(); // hull
  p.fillStyle='#d8dbe0';p.globalAlpha=.85;p.beginPath();p.moveTo(46,-52);p.lineTo(640,-42);p.lineTo(640,-36);p.lineTo(70,-38);p.closePath();p.fill();p.globalAlpha=1; // white sheer line
  p.fillStyle='#141a2a';p.fillRect(130,-110,260,72);p.fillRect(160,-160,190,52);p.fillRect(200,-205,120,46); // superstructure
  p.fillRect(255,-290,8,90);p.fillRect(225,-262,68,5);p.fillRect(380,-120,30,82); // mast

function plate(p,R,x,y,s,col){p.save();p.translate(x,y);p.rotate((R()-.5)*0.8);p.scale(s,s*0.55);p.fillStyle=col;p.beginPath();const n=7;for(let i=0;i<n;i++){const a=i/n*6.283,r=30*(0.6+R()*0.6);i?p.lineTo(Math.cos(a)*r*1.6,Math.sin(a)*r):p.moveTo(Math.cos(a)*r*1.6,Math.sin(a)*r);}p.closePath();p.fill();
  p.fillStyle='rgba(250,200,140,.35)';p.fillRect(-36,-14,50,5);p.fillStyle='rgba(20,10,6,.7)';for(let i=0;i<4;i++){p.beginPath();p.arc(-30+i*16,4,2.4,0,7);p.fill();}p.restore();}

  p.save();p.clip();strokes(p,2600,R,-40,BED-50,w+80,330,['#9a9070','#6a6450','#4a4638','#b0a480'],60,10,0,0.08,0.2);
  for(let i=0;i<500;i++){p.fillStyle='rgba(30,26,20,'+(R()*.4)+')';p.beginPath();p.ellipse(R()*w,BED+R()*260,2+R()*8,1+R()*3,0,0,7);p.fill();}p.restore();
  // the debris trail: rusty plates, beams, a pipe, scattered toward the boiler
  const rust=['#7a3a1e','#5a2a18','#94502a','#3a2016','#6a4428'];
  for(let i=0;i<70;i++){const t=Math.pow(R(),0.7),x=900+t*1250+(R()-.5)*120,y=BED-10+Math.sin(x*.004)*30+R()*120*(0.6+t*0.4);plate(p,R,x,y,0.4+R()*0.9*(0.5+t),rust[Math.floor(R()*rust.length)]);}
  for(let i=0;i<14;i++){const x=1000+R()*1100,y=BED+10+R()*90+Math.sin(x*.004)*30;p.save();p.translate(x,y);p.rotate((R()-.5)*0.6);p.fillStyle=rust[Math.floor(R()*5)];p.fillRect(-60,-6,120+R()*60,12);p.fillStyle='rgba(240,190,130,.35)';p.fillRect(-60,-6,120,3);p.restore();}

  p.strokeStyle='#5a3220';p.lineWidth=16;p.lineCap='round';p.beginPath();p.moveTo(1500,BED+40);p.quadraticCurveTo(1580,BED-20,1660,BED+30);p.stroke();
  p.strokeStyle='rgba(230,170,110,.4)';p.lineWidth=4;p.beginPath();p.moveTo(1500,BED+34);p.quadraticCurveTo(1580,BED-26,1660,BED+24);p.stroke();
  strokes(p,900,R,880,BED-40,1400,180,['#3a2014','#a05a30','#2a1810'],22,5,0,0.08,0.18);
});
// the boiler: a huge riveted drum lying on the seabed, front face with three furnace mouths (generic shape)
const BOIL_C=off(WW,WH,(p)=>{const R=R0(9);p.save();p.translate(BX,BY);
  // shadow + sediment piled at its foot
  p.fillStyle='rgba(10,8,6,.6)';p.beginPath();p.ellipse(60,BR-10,BR*1.25,40,0,0,7);p.fill();
  // drum side (seen slightly from the side)
  p.fillStyle='#3a1e12';p.beginPath();p.moveTo(0,-BR);p.lineTo(170,-BR+14);p.lineTo(170,BR-14);p.lineTo(0,BR);p.closePath();p.fill();

  const fg=p.createRadialGradient(-70,-80,20,0,0,BR);fg.addColorStop(0,'#b0602e');fg.addColorStop(.6,'#7a3a1c');fg.addColorStop(1,'#3a1a0e');p.fillStyle=fg;p.beginPath();p.ellipse(0,0,BR*0.9,BR,0,0,7);p.fill();
  p.save();p.beginPath();p.ellipse(0,0,BR*0.9,BR,0,0,7);p.clip();strokes(p,500,R,-BR,-BR,2*BR,2*BR,['#c8743a','#5a2a14','#2a120a','#d89050','#8a4a24'],30,6,1.2,0.15,0.3);
  // rust streaks dripping down
  strokes(p,120,R,-BR,-BR,2*BR,2*BR,['#e09858','#3a180c'],70,4,1.57,0.15,0.25);p.restore();
  p.strokeStyle='#2a1208';p.lineWidth=10;p.beginPath();p.ellipse(0,0,BR*0.9,BR,0,0,7);p.stroke();
  // two rings of rivets
  [[BR*0.84,BR*0.94,44],[BR*0.62,BR*0.7,34]].forEach(([rx,ry,n])=>{for(let i=0;i<n;i++){const a=i/n*6.283,x=Math.cos(a)*rx,y=Math.sin(a)*ry;p.fillStyle='#2a1208';p.beginPath();p.arc(x+1.5,y+1.5,6,0,7);p.fill();p.fillStyle='#e8a062';p.beginPath();p.arc(x-1,y-1,4.4,0,7);p.fill();}});
  // three furnace mouths
  [[-78,60],[78,60],[0,-58]].forEach(([x,y])=>{p.fillStyle='#120804';p.beginPath();p.ellipse(x,y,46,50,0,0,7);p.fill();p.strokeStyle='#c87a40';p.lineWidth=6;p.beginPath();p.ellipse(x,y,50,54,0,Math.PI*1.05,Math.PI*1.9);p.stroke();
    p.strokeStyle='#3a1a0c';p.lineWidth=8;p.beginPath();p.ellipse(x,y,54,58,0,0,7);p.stroke();});

  strokes(p,140,R,-BR*1.1,BR-40,BR*2.2+100,60,['#9a9070','#4a4638'],40,7,0,0.15,0.25);
  p.restore();});
// ---------- the camera sled ----------
function sled(c,x,y,a,lt){c.save();c.translate(x,y);c.rotate(a);
  c.fillStyle='#d6a020';c.fillRect(-110,-34,220,16); // top float (yellow)
  c.strokeStyle='#b8b8b0';c.lineWidth=7;c.lineCap='round';c.beginPath();c.moveTo(-104,-18);c.lineTo(-104,40);c.moveTo(104,-18);c.lineTo(104,40);c.moveTo(-104,40);c.lineTo(104,40);c.moveTo(-104,10);c.lineTo(104,10);c.moveTo(-104,40);c.lineTo(-40,-18);c.moveTo(40,-18);c.lineTo(104,40);c.stroke();
  c.fillStyle='#e8e4d8';c.fillRect(-60,0,70,22);c.fillStyle='#b0aca0';c.beginPath();c.arc(30,30,16,0,7);c.fill();c.fillStyle='#101418';c.beginPath();c.arc(30,30,9,0,7);c.fill();
  c.fillStyle='#ffe9b0';c.beginPath();c.arc(84,44,9,0,7);c.arc(-20,44,7,0,7);c.fill();
  c.strokeStyle='rgba(230,230,220,.7)';c.lineWidth=3;c.beginPath();c.moveTo(-104,-34);c.lineTo(0,-70);c.lineTo(104,-34);c.stroke();
  c.restore();}
// path of the sled (world) -- one continuous move: down the cable, then along the trail
const PATH=[[520,1080],[600,1600],[760,2380],[930,2960],[1150,3300],[1500,3420],[1790,3430],[1900,3420]];
function cr(pts,t){t=CL(t)*(pts.length-1);const k=Math.min(pts.length-2,Math.floor(t)),u=t-k;const a=pts[Math.max(0,k-1)],b=pts[k],c=pts[k+1],d=pts[Math.min(pts.length-1,k+2)];
  const f=(p0,p1,p2,p3)=>0.5*((2*p1)+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u*u+(-p0+3*p1-3*p2+p3)*u*u*u);return [f(a[0],b[0],c[0],d[0]),f(a[1],b[1],c[1],d[1])];}
const SNOW=(()=>{const R=R0(3);const a=[];for(let i=0;i<420;i++)a.push([R()*1400-160,R()*2300-190,0.3+R()*0.9,R()*6.28]);return a;})();
const L=off(1080,1920,()=>{}),LG=L.getContext('2d'),M=off(1080,1920,()=>{}),MG=M.getContext('2d');
const BOILN=off(1080,1920,(p)=>{const R=R0(17);strokes(p,420,R,-50,0,1180,1920,['#a8c8e0','#02060c','#3a6a8a'],120,22,0.1,0.02,0.05);});
function sOf(lt){const x=CL(lt/6.3);return 0.12*x+0.88*EIO(x);}
function cap(t,t0,t1,lt,i){if(lt<t0||lt>t1+0.5)return;const e=t0<=0?1:E3((lt-t0)/0.5),o=E3((lt-t1)/0.45);g.save();g.textAlign='left';g.font='italic 500 64px '+SERIF;const w=g.measureText(t).width+64,y=250;
  g.translate(72-(1-e)*(w+160)-o*(w+160),y);g.rotate(-0.012+(1-e)*0.03);tornPath(g,0,0,w,96,80+i,6);g.fillStyle='#f3e6c8';g.shadowColor='rgba(0,5,15,.6)';g.shadowBlur=14;g.shadowOffsetY=8;g.fill();g.shadowColor='transparent';
  g.strokeStyle='rgba(150,100,50,.35)';g.lineWidth=3;g.stroke();g.fillStyle=i===2?'#8a1c10':'#2c1c0e';g.fillText(t,32,68);g.restore();}
function draw(lt){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;

  const W2S=(x,y)=>[540+(x-cx)*z,900+(y-cy)*z];
  g.save();g.translate(540,900);g.scale(z,z);g.translate(-cx,-cy);
  g.fillStyle='#10182f';g.fillRect(-400,-800,WW+800,800);g.drawImage(WORLD,0,0);

  g.strokeStyle='rgba(20,24,30,.9)';g.lineWidth=4/z+1;g.beginPath();g.moveTo(640,SURF-150);g.bezierCurveTo(700,SURF+500,sx-260,(SURF+sy)/2+400,sx,sy-70);g.stroke();
  g.strokeStyle='rgba(150,180,210,.25)';g.lineWidth=1.5;g.stroke();
  g.restore();
  // light mask from the sled lamps (screen space)
  const [ssx,ssy]=W2S(sx,sy),la=0.85+ang;MG.setTransform(1,0,0,1,0,0);MG.clearRect(0,0,1080,1920);
  const fx=ssx+Math.cos(la)*360*z,fy=ssy+Math.sin(la)*360*z,flick=1+Math.sin(lt*13)*0.02;
  let rg=MG.createRadialGradient(fx,fy,20,fx,fy,560*z*flick);rg.addColorStop(0,'rgba(0,0,0,1)');rg.addColorStop(.5,'rgba(0,0,0,.75)');rg.addColorStop(1,'rgba(0,0,0,0)');MG.fillStyle=rg;MG.fillRect(0,0,1080,1920);
  rg=MG.createRadialGradient(ssx,ssy,10,ssx,ssy,900*z);rg.addColorStop(0,'rgba(0,0,0,.22)');rg.addColorStop(1,'rgba(0,0,0,0.02)');MG.fillStyle=rg;MG.fillRect(0,0,1080,1920);
  {const by=W2S(0,BED)[1],pool=MG.createRadialGradient(ssx+60,by,20,ssx+60,by,520*z);pool.addColorStop(0,'rgba(0,0,0,.8)');pool.addColorStop(1,'rgba(0,0,0,0)');MG.fillStyle=pool;MG.fillRect(0,0,1080,1920);}
  LG.setTransform(1,0,0,1,0,0);LG.globalCompositeOperation='source-over';LG.clearRect(0,0,1080,1920);
  LG.save();LG.translate(540,900);LG.scale(z,z);LG.translate(-cx,-cy);LG.drawImage(BEDL,0,0);LG.globalAlpha=0.12+0.88*E3((lt-4.1)/1.1);LG.drawImage(BOIL_C,0,0);LG.globalAlpha=1;LG.restore();
  LG.globalCompositeOperation='destination-in';LG.drawImage(M,0,0);LG.globalCompositeOperation='source-over';
  g.drawImage(L,0,0);
  // volumetric beam (additive)
  g.save();g.globalCompositeOperation='lighter';
  const bw=0.42,BL=760*z;const bg=g.createRadialGradient(ssx,ssy+30*z,10,ssx,ssy+30*z,BL);bg.addColorStop(0,'rgba(200,230,255,.32)');bg.addColorStop(.6,'rgba(120,170,220,.08)');bg.addColorStop(1,'rgba(100,150,200,0)');
  g.fillStyle=bg;g.beginPath();g.moveTo(ssx+60*z,ssy+40*z);g.lineTo(ssx+Math.cos(la-bw)*BL,ssy+Math.sin(la-bw)*BL);g.lineTo(ssx+Math.cos(la+bw)*BL,ssy+Math.sin(la+bw)*BL);g.closePath();g.fill();

  const vy=(sy0-1080), vx=(sx-520)*0.4;
  SNOW.forEach(([x0,y0,d,ph])=>{let x=((x0-vx*d*0.25+Math.sin(lt*.8+ph)*12)%1400+1400)%1400-160,y=((y0-vy*d*0.35-lt*14*d)%2300+2300)%2300-190;
    const dd=Math.hypot(x-fx,y-fy),lit=Math.max(0,1-dd/(600*z)),deep=CL((sy0-1400)/800);const a=(0.05+0.6*lit)*d*(0.4+0.6*deep)+0.05*(1-deep);if(a<0.02)return;
    g.fillStyle='rgba(220,235,255,'+a.toFixed(3)+')';g.fillRect(x,y,2.2*d+1,2.2*d+1+Math.min(14,Math.abs(vy)*0.0)*0);});
  g.restore();
