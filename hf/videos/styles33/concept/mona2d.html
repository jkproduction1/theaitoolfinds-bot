<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'DM Serif Display';src:url(dm-serif-display-latin-400-normal.woff2)}

html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script id="main" type="text/plain">
// styles33: /paper-collage the theft that made the Mona Lisa famous. Clean white gallery wall, the painting moves off its hooks,
// paper labels + marker arrows in the styles28 look. Facts: History.com / Smithsonian (21 Aug 1911, ~7:15 am, Vincenzo Peruggia,
// former Louvre handyman; crowds came to see the empty wall; found in Florence, Dec 1913). Portrait = own stylised drawing (public-domain work).
const E3=(x)=>x<0?0:x>1?1:1-Math.pow(1-x,3), EIO=(x)=>x<0?0:x>1?1:x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, CL=(x)=>x<0?0:x>1?1:x;
const EBK=(x)=>{ x=CL(x); const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };
const SERIF="'EB Garamond','Lora','DejaVu Serif',Georgia,serif", DISP="'DM Serif Display','EB Garamond','Lora','DejaVu Serif',serif", SANS="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif";
function R0(s){ return function(){ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function off(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); return c; }
function tornPath(g,x,y,w,h,seed,j){ const R=R0(seed); j=j||6; g.beginPath(); g.moveTo(x,y+R()*j);
  for(let i=1;i<=24;i++) g.lineTo(x+w*i/24,y+(R()-.5)*j); for(let i=1;i<=12;i++) g.lineTo(x+w+(R()-.5)*j,y+h*i/12);
  for(let i=23;i>=0;i--) g.lineTo(x+w*i/24,y+h+(R()-.5)*j); for(let i=11;i>=1;i--) g.lineTo(x+(R()-.5)*j,y+h*i/12); g.closePath(); }
function blobPath(g,cx,cy,r,seed,amp,n,t,bulge){ const R=R0(seed); const ph=[],fq=[]; for(let i=0;i<4;i++){ ph.push(R()*6.28); fq.push(2+Math.floor(R()*4)); }
  g.beginPath(); for(let i=0;i<=n;i++){ const a=i/n*Math.PI*2; let rr=r; for(let k=0;k<4;k++) rr+=r*amp*Math.sin(a*fq[k]+ph[k]+t*(0.6+k*0.3))/(k+1);
    if(bulge) rr+=bulge(a); const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i?g.lineTo(x,y):g.moveTo(x,y); } g.closePath(); }
const GRAIN=off(1080,1920,(p,w,h)=>{ const R=R0(77); for(let i=0;i<140000;i++){ p.fillStyle=R()<.5?'rgba(0,0,0,'+(R()*.10)+')':'rgba(255,255,255,'+(R()*.10)+')'; p.fillRect(R()*w,R()*h,1+R()*2,1+R()*2); } });
// hand-drawn marker line through pts (Catmull-Rom), drawn up to fraction f; returns the end point + angle
function marker(g,pts,f,width,col,dash){ const N=80, P=[]; for(let i=0;i<=N;i++){ const t=i/N*(pts.length-1), k=Math.min(pts.length-2,Math.floor(t)), u=t-k; const a=pts[Math.max(0,k-1)],b=pts[k],c=pts[k+1],d=pts[Math.min(pts.length-1,k+2)];
    const cr=(p0,p1,p2,p3)=>0.5*((2*p1)+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u*u+(-p0+3*p1-3*p2+p3)*u*u*u); P.push([cr(a[0],b[0],c[0],d[0]),cr(a[1],b[1],c[1],d[1])]); }
  const n=Math.max(1,Math.floor(N*CL(f))); g.save(); g.strokeStyle=col; g.lineCap='round'; g.lineJoin='round'; if(dash) g.setLineDash(dash);
  for(let pass=0;pass<(dash?1:2);pass++){ g.lineWidth=width*(pass?0.55:1); g.globalAlpha=pass?0.55:0.9; g.beginPath(); for(let i=0;i<=n;i++){ const j=pass?Math.sin(i*1.7)*1.6:0; i?g.lineTo(P[i][0]+j,P[i][1]-j):g.moveTo(P[i][0]+j,P[i][1]-j); } g.stroke(); }
  g.restore(); const e=P[n], q=P[Math.max(0,n-3)]; return [e[0],e[1],Math.atan2(e[1]-q[1],e[0]-q[0])]; }
function arrowHead(g,x,y,ang,s,width,col){ g.save(); g.translate(x,y); g.rotate(ang); g.strokeStyle=col; g.lineWidth=width; g.lineCap='round'; g.lineJoin='round'; g.beginPath(); g.moveTo(-s,-s*0.62); g.lineTo(0,0); g.lineTo(-s*0.85,s*0.7); g.stroke(); g.restore(); }
// white sticker edge + drop shadow around any drawn cut-out (content origin moves to [r+20, r+20])
function sticker(src,r){ const w=src.width+2*r+40, h=src.height+2*r+60, ox=r+20, oy=r+20;
  const sil=off(src.width,src.height,(q)=>{ q.drawImage(src,0,0); q.globalCompositeOperation='source-in'; q.fillStyle='#fbfaf5'; q.fillRect(0,0,src.width,src.height); });
  const ring=off(w,h,(q)=>{ for(let i=0;i<28;i++){ const a=i/28*6.283; q.drawImage(sil,ox+Math.cos(a)*r,oy+Math.sin(a)*r); } q.drawImage(sil,ox,oy); });
  const c=off(w,h,(p)=>{ p.shadowColor='rgba(20,30,45,.45)'; p.shadowBlur=24; p.shadowOffsetY=16; p.drawImage(ring,0,0); p.shadowColor='transparent'; p.drawImage(src,ox,oy); }); c.ox=ox; c.oy=oy; return c; }
function paperTag(g,lt,t0,x,y,r,h,s,seed,side){ if(lt<t0) return; const a=EBK((lt-t0)/0.4);
  g.font="400 66px "+DISP; const hw=g.measureText(h).width; g.font="italic 500 40px "+SERIF; const sw=g.measureText(s).width; const W=Math.max(hw,sw)+76, H=146;
  g.save(); g.translate(x+W/2,y+H/2); g.rotate(r+(1-a)*0.25); g.scale(0.4+0.6*a,0.4+0.6*a); g.globalAlpha=CL((lt-t0)/0.12); g.translate(-W/2,-H/2);
  tornPath(g,0,0,W,H,seed,7); g.fillStyle='#f6f1e4'; g.shadowColor='rgba(30,20,10,.4)'; g.shadowBlur=18; g.shadowOffsetY=10; g.fill(); g.shadowColor='transparent';
  const hl=EIO((lt-t0-0.3)/0.4); if(hl>0){ g.fillStyle='rgba(255,214,0,.9)'; g.beginPath(); g.moveTo(26,22); g.lineTo(26+(hw+22)*hl,18); g.lineTo(26+(hw+22)*hl,86); g.lineTo(26,82); g.closePath(); g.fill(); }
  g.fillStyle='#17222b'; g.font="400 66px "+DISP; g.fillText(h,36,74); g.fillStyle='#4c4338'; g.font="italic 500 40px "+SERIF; g.fillText(s,36,124);
  g.fillStyle='rgba(240,232,200,.8)'; g.save(); g.translate(side?W-30:30,-4); g.rotate(side?0.5:-0.5); g.fillRect(-46,-14,92,30); g.restore(); g.restore(); return W; }


const g=document.getElementById('c').getContext('2d');
function portrait(w,h){return off(w,h,(p)=>{
  const bg=p.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#9aa58a');bg.addColorStop(.35,'#7f8c6c');bg.addColorStop(.6,'#5c6446');bg.addColorStop(1,'#2e2a1a');p.fillStyle=bg;p.fillRect(0,0,w,h);
  p.filter='blur(14px)';const L=(pts,c)=>{p.fillStyle=c;p.beginPath();pts.forEach((q,i)=>i?p.lineTo(q[0]*w,q[1]*h):p.moveTo(q[0]*w,q[1]*h));p.fill();};
  L([[0,.42],[.12,.30],[.25,.36],[.36,.31],[.42,.5],[0,.62]],'rgba(170,190,170,.7)');L([[1,.36],[.86,.27],[.72,.34],[.6,.3],[.58,.52],[1,.6]],'rgba(170,190,170,.7)');
  L([[0,.55],[.2,.5],[.3,.62],[0,.7]],'rgba(120,100,60,.8)');L([[1,.5],[.8,.48],[.7,.6],[1,.68]],'rgba(120,100,60,.8)');
  p.strokeStyle='rgba(210,180,120,.8)';p.lineWidth=w*.012;p.beginPath();p.moveTo(w*.06,h*.62);p.bezierCurveTo(w*.16,h*.55,w*.04,h*.5,w*.22,h*.46);p.stroke();
  p.beginPath();p.moveTo(w*.9,h*.56);p.bezierCurveTo(w*.84,h*.5,w*.95,h*.46,w*.8,h*.42);p.stroke();p.filter='blur(2px)';
  // body / dress
  const dr=p.createLinearGradient(0,h*.5,0,h);dr.addColorStop(0,'#3a2c1a');dr.addColorStop(1,'#16110a');p.fillStyle=dr;
  p.beginPath();p.moveTo(w*.12,h);p.bezierCurveTo(w*.16,h*.66,w*.3,h*.55,w*.5,h*.53);p.bezierCurveTo(w*.7,h*.55,w*.84,h*.66,w*.9,h);p.fill();
  // skin: neck/chest
  const sk=(x,y)=>{const r=p.createRadialGradient(x,y,2,x,y,w*.18);r.addColorStop(0,'#e6c08a');r.addColorStop(1,'#a87e4c');return r;};
  p.fillStyle=sk(w*.5,h*.52);p.beginPath();p.moveTo(w*.4,h*.5);p.quadraticCurveTo(w*.5,h*.66,w*.61,h*.5);p.lineTo(w*.58,h*.43);p.lineTo(w*.42,h*.43);p.closePath();p.fill();
  // hair: thin dark cap + two curtains falling past the face to the shoulders
  p.fillStyle='#1d150c';p.beginPath();p.ellipse(w*.5,h*.27,w*.135,h*.125,0,Math.PI,0);p.fill();
  [[-1],[1]].forEach(([s])=>{p.beginPath();p.moveTo(w*(.5+s*.11),h*.24);p.bezierCurveTo(w*(.5+s*.16),h*.32,w*(.5+s*.15),h*.44,w*(.5+s*.22),h*.57);p.lineTo(w*(.5+s*.13),h*.57);p.bezierCurveTo(w*(.5+s*.1),h*.46,w*(.5+s*.11),h*.36,w*(.5+s*.09),h*.3);p.closePath();p.fill();});
  // face (soft, sfumato)
  p.filter='blur(3px)';const fg=p.createRadialGradient(w*.48,h*.28,4,w*.5,h*.31,w*.13);fg.addColorStop(0,'#f0cf9a');fg.addColorStop(.7,'#d3a86c');fg.addColorStop(1,'#9c7343');
  p.fillStyle=fg;p.beginPath();p.ellipse(w*.5,h*.315,w*.098,h*.112,0,0,7);p.fill();
  p.fillStyle='rgba(110,70,35,.28)';p.beginPath();p.ellipse(w*.565,h*.33,w*.03,h*.08,0,0,7);p.fill();
  p.filter='blur(1.5px)';p.fillStyle='rgba(70,45,25,.55)';[[.462,.3],[.54,.3]].forEach(([x,y])=>{p.beginPath();p.ellipse(w*x,h*y,w*.018,h*.006,0,0,7);p.fill();});
  p.fillStyle='rgba(120,80,45,.25)';p.beginPath();p.moveTo(w*.5,h*.305);p.lineTo(w*.49,h*.345);p.lineTo(w*.507,h*.348);p.fill();
  p.strokeStyle='rgba(120,65,45,.6)';p.lineWidth=w*.005;p.beginPath();p.moveTo(w*.468,h*.37);p.quadraticCurveTo(w*.5,h*.38,w*.534,h*.366);p.stroke();
  p.filter='blur(2px)';
  // veil line + hands
  p.strokeStyle='rgba(40,30,20,.5)';p.lineWidth=w*.004;p.beginPath();p.moveTo(w*.38,h*.24);p.quadraticCurveTo(w*.5,h*.19,w*.62,h*.24);p.stroke();
  p.fillStyle=sk(w*.5,h*.85);p.beginPath();p.ellipse(w*.46,h*.87,w*.15,h*.05,-.12,0,7);p.fill();p.beginPath();p.ellipse(w*.58,h*.85,w*.12,h*.045,.15,0,7);p.fill();
  p.filter='none';
  // varnish + craquelure
  p.fillStyle='rgba(200,170,60,.16)';p.fillRect(0,0,w,h);const R=R0(9);p.strokeStyle='rgba(40,30,10,.18)';p.lineWidth=1;
  for(let i=0;i<500;i++){let x=R()*w,y=R()*h;p.beginPath();p.moveTo(x,y);for(let k=0;k<4;k++){x+=(R()-.5)*30;y+=(R()-.5)*30;p.lineTo(x,y);}p.stroke();}
  const v=p.createRadialGradient(w/2,h*.45,w*.25,w/2,h*.5,w*.85);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(30,20,5,.55)');p.fillStyle=v;p.fillRect(0,0,w,h);});}
const PW=420,PH=626;
const PAINT=sticker(off(PW+40,PH+40,(p)=>{const fr=p.createLinearGradient(0,0,PW+40,PH+40);fr.addColorStop(0,'#e3c26e');fr.addColorStop(.5,'#9c7426');fr.addColorStop(1,'#e8c97a');
  p.fillStyle=fr;p.fillRect(0,0,PW+40,PH+40);p.drawImage(portrait(PW,PH),20,20);p.strokeStyle='rgba(60,40,10,.6)';p.lineWidth=2;p.strokeRect(20,20,PW,PH);}),10);
const WALL=off(1080,1920,(p,w,h)=>{p.fillStyle='#f2efe8';p.fillRect(0,0,w,h);const R=R0(3);
  for(let i=0;i<2200;i++){p.strokeStyle='rgba(120,110,90,'+R()*.06+')';const x=R()*w,y=R()*h,a=R()*6.28,l=6+R()*22;p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);p.stroke();}
  const top=p.createLinearGradient(0,0,0,h);top.addColorStop(0,'rgba(255,250,235,.0)');top.addColorStop(1,'rgba(150,140,120,.18)');p.fillStyle=top;p.fillRect(0,0,w,h);
  // picture rail
  p.fillStyle='#d8d2c4';p.fillRect(0,250,w,10);p.fillStyle='rgba(0,0,0,.08)';p.fillRect(0,260,w,6);});
const HOOKS=[[355,640],[725,640],[355,1210],[725,1210]];
function draw(T){const lt=T, q=Math.floor(lt*12)/12;g.setTransform(1,0,0,1,0,0);g.drawImage(WALL,0,0);
  const z=1+0.03*EIO(lt/8);g.save();g.translate(540,960);g.scale(z,z);g.translate(-540,-960);
  // ghost of where it hung + the 4 hooks
  g.save();g.fillStyle='rgba(255,255,250,.6)';g.fillRect(320,600,440,660);g.strokeStyle='rgba(120,105,80,.35)';g.lineWidth=5;g.setLineDash([18,12]);g.strokeRect(320,600,440,660);g.setLineDash([]);g.restore();
  HOOKS.forEach(([x,y])=>{g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(x+5,y+8,11,7,0,0,7);g.fill();g.fillStyle='#3b3a36';g.beginPath();g.arc(x,y,9,0,7);g.fill();g.fillStyle='#8c8a82';g.beginPath();g.arc(x-3,y-3,3,0,7);g.fill();});
  // museum label next to the ghost
  g.save();g.translate(800,640);g.fillStyle='#fffdf8';g.shadowColor='rgba(0,0,0,.15)';g.shadowBlur=8;g.shadowOffsetY=3;g.fillRect(0,0,230,120);g.shadowColor='transparent';
  g.fillStyle='#1b1a18';g.font='600 24px Inter';g.fillText('Leonardo da Vinci',16,36);g.font='italic 500 26px '+SERIF;g.fillText('Mona Lisa',16,70);g.font='500 20px Inter';g.fillStyle='#55524a';g.fillText('c. 1503, oil on poplar',16,100);g.restore();
  // headline
  g.fillStyle='#2f5f86';g.font='500 84px '+SERIF;g.fillText('The theft that made her',60,170);
  g.save();g.fillStyle='#27425a';g.font='italic 400 250px '+DISP;g.fillText('famous',70,440);g.restore();
  // the painting, lifted off its hooks and moving away (mid-move)
  const mv=EIO((lt-0.6)/3.2), wob=0.004*Math.sin(q*2.3);
  const px=540+mv*230, py=930+mv*380, rot=-0.02-0.16*mv+wob;
  // dashed marker path hooks -> painting
  g.save();g.translate(px,py);g.rotate(rot);g.drawImage(PAINT,-PAINT.width/2,-PAINT.height/2);g.restore();
  const e=marker(g,[[470,760],[600,700],[px+60,py-PH/2-40]],CL(mv*1.4),8,'#d6331a',[20,14]);if(mv>.6)arrowHead(g,e[0],e[1],e[2],26,8,'#d6331a');
  // orange torn label
  g.save();g.rotate(-0.014);tornPath(g,-20,520,470,92,31,5);g.fillStyle='#f0541c';g.shadowColor='rgba(30,20,10,.35)';g.shadowBlur=14;g.shadowOffsetY=8;g.fill();g.shadowColor='transparent';
  g.fillStyle='#fff';g.font='500 66px '+SERIF;g.fillText('21 Aug 1911',50,586);g.restore();
  // paper tags with marker arrows
  paperTag(g,lt,0,54,1380,-0.03,'7:15 am','a handyman walks out with her',50,0);
  const e2=marker(g,[[330,1390],[420,1330],[px-150,py+60]],1,6,'#23313d');arrowHead(g,e2[0],e2[1],e2[2],22,6,'#23313d');
  paperTag(g,lt,0,430,1640,0.025,'2 years','hidden in a trunk in Paris',51,1);
  g.restore();
  g.globalCompositeOperation='multiply';g.fillStyle='rgba(244,236,214,.28)';g.fillRect(0,0,1080,1920);g.globalCompositeOperation='source-over';g.drawImage(GRAIN,0,0);
  const vg=g.createRadialGradient(540,900,500,540,900,1250);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(30,25,15,.22)');g.fillStyle=vg;g.fillRect(0,0,1080,1920);}
window.DUR=8;window.draw=draw;draw(2.6);document.title='ok';
</script>
