<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#wrap{position:relative;width:1080px;height:1920px}
canvas{display:block}
.ui{position:absolute;inset:0;pointer-events:none;font-family:Inter,'DejaVu Sans',Arial,sans-serif}
.hl{position:absolute;left:60px;top:110px;font-weight:800;font-size:82px;line-height:1.08;color:#fff;letter-spacing:-1px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.hl span{display:block;opacity:0}
.hl .y{color:#ffd34d}
.lab{position:absolute;color:#fff;font-weight:700;font-size:34px;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.9);opacity:0}
.lab:before{content:'';position:absolute;left:-26px;top:12px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff}
.box{position:absolute;right:50px;top:1360px;width:400px;padding:22px 28px;border:3px solid #ffd34d;border-radius:18px;background:rgba(8,14,22,.82);opacity:0}
.box b{display:block;color:#ffd34d;font-size:64px;font-weight:800}
.box i{display:block;color:#d9e2ea;font-style:normal;font-size:32px;font-weight:500;line-height:1.25}
.tag{position:absolute;left:60px;top:300px;color:#9fb3c4;font-size:30px;font-weight:600;letter-spacing:6px;opacity:0}
</style>
<script src="three.min.js"></script><script src="three-extras.js"></script><script src="geo.js"></script><script src="world50.js"></script></head><body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas>
<div class="ui">
  <div class="tag" id="tag">EGYPT · 1,000,000 KM²</div>
  <div class="hl" id="hl"><span>95% of Egyptians</span><span class="y">live on 5% of the land</span></div>
  <div class="lab" id="l0">Cairo</div><div class="lab" id="l1">Luxor</div><div class="lab" id="l2">Aswan</div><div class="lab" id="l3">Alexandria</div>
  <div class="box" id="box"><b>~10 km</b><i>of green on each side,<br>then pure desert</i></div>
</div></div>
<script>
// styles33 concept v2: /map-doc why Egyptians live along the Nile. Three.js globe -> zoom -> Egypt border traced -> Nile traced -> population spikes.
// Natural Earth (public domain) coastlines via world-atlas 50m. Nile course = hand-placed waypoints (approximate). Facts to verify before final.
const CL=x=>x<0?0:x>1?1:x, E3=x=>1-Math.pow(1-CL(x),3), EIO=x=>{x=CL(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const EBK=x=>{x=CL(x);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
function R0(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;};}
function off(w,h,d){const c=document.createElement('canvas');c.width=w;c.height=h;d(c.getContext('2d'),w,h);return c;}
const D=Math.PI/180;
function P(lon,lat,r){const ph=(lon+180)*D,th=(90-lat)*D;return new THREE.Vector3(-r*Math.cos(ph)*Math.sin(th),r*Math.cos(th),r*Math.sin(ph)*Math.sin(th));}
const W=window.WORLD50, LAND=topojson.feature(W,W.objects.land), CTRY=topojson.feature(W,W.objects.countries);
const EG=CTRY.features.find(f=>f.id==='818');
const NILE=[[31.4,21.9],[31.3,22.4],[31.9,23.0],[32.9,24.1],[32.88,24.6],[32.75,25.2],[32.64,25.7],[32.3,26.1],[31.85,26.5],[31.4,27.0],[31.18,27.25],[30.85,27.8],[30.75,28.4],[30.95,29.0],[31.2,29.6],[31.24,30.04],[31.15,30.35]];
const DW=[[31.15,30.35],[30.9,30.7],[30.5,31.1],[30.3,31.45]], DE=[[31.15,30.35],[31.35,30.8],[31.6,31.15],[31.82,31.5]];

const ren=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true,logarithmicDepthBuffer:true});
ren.setSize(1080,1920,false);ren.toneMapping=THREE.ACESFilmicToneMapping;ren.outputColorSpace=THREE.SRGBColorSpace;
const sc=new THREE.Scene();sc.background=new THREE.Color(0x05080d);
const cam=new THREE.PerspectiveCamera(34,1080/1920,0.005,80);
sc.add(new THREE.AmbientLight(0xffffff,0.55));const sun=new THREE.DirectionalLight(0xfff1d8,2.2);sun.position.set(-2,3,4);sc.add(sun);

// ---- base globe texture (equirectangular)
function drawWorld(p,w,h,proj,{ocean,land,stroke}){const path=d3.geoPath(proj,p);
  p.fillStyle=ocean;p.fillRect(0,0,w,h);p.fillStyle=land;p.beginPath();path(LAND);p.fill();
  if(stroke){p.strokeStyle=stroke;p.lineWidth=1.2;p.beginPath();path(topojson.mesh(W,W.objects.countries,(a,b)=>a!==b));p.stroke();}}
const baseC=off(4096,2048,(p,w,h)=>{const proj=d3.geoEquirectangular().translate([w/2,h/2]).scale(w/(2*Math.PI));
  const oc=p.createLinearGradient(0,0,0,h);drawWorld(p,w,h,proj,{ocean:'#0b1a2a',land:'#3a3f44',stroke:'rgba(255,255,255,.10)'});
  const R=R0(4);for(let i=0;i<60000;i++){p.fillStyle='rgba(255,255,255,'+R()*.04+')';p.fillRect(R()*w,R()*h,2,2);}});
const tex=c=>{const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;};
const globe=new THREE.Mesh(new THREE.SphereGeometry(1,160,120),new THREE.MeshLambertMaterial({map:tex(baseC)}));sc.add(globe);

// ---- hi-res regional patches (lon 22..40, lat 19..34)
const LO0=22,LO1=40,LA0=19,LA1=34, PW=2400, PH=Math.round(PW*(LA1-LA0)/(LO1-LO0)/Math.cos(26*D)*1.0);
const pproj=d3.geoEquirectangular().scale(1).translate([0,0]);
// linear lon/lat -> pixel (plate carree inside the patch)
const px=([lo,la])=>[(lo-LO0)/(LO1-LO0)*PW,(LA1-la)/(LA1-LA0)*PH];
const lin={stream:s=>({point:(x,y)=>{const q=px([x,y]);s.point(q[0],q[1]);},sphere:()=>s.sphere(),lineStart:()=>s.lineStart(),lineEnd:()=>s.lineEnd(),polygonStart:()=>s.polygonStart(),polygonEnd:()=>s.polygonEnd()})};
function patch(draw,r,transparent){const c=off(PW,PH,(p)=>draw(p,d3.geoPath(lin,p)));
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,200,170,(LO0+180)*D,(LO1-LO0)*D,(90-LA1)*D,(LA1-LA0)*D),
    new THREE.MeshLambertMaterial({map:tex(c),transparent:!!transparent,depthWrite:!transparent}));sc.add(m);return m;}
patch((p,path)=>{p.fillStyle='#0b1a2a';p.fillRect(0,0,PW,PH);p.fillStyle='#3a3f44';p.beginPath();path(LAND);p.fill();
  // fake relief: soft light/dark blotches on land
  p.save();p.beginPath();path(LAND);p.clip();const R=R0(9);p.filter='blur(18px)';for(let i=0;i<0;i++){p.fillStyle=(R()<.5?'rgba(255,255,255,':'rgba(0,0,0,')+R()*.04+')';p.beginPath();p.arc(R()*PW,R()*PH,20+R()*90,0,7);p.fill();}p.filter='none';p.restore();
  p.strokeStyle='rgba(255,255,255,.14)';p.lineWidth=2;p.beginPath();path(topojson.mesh(W,W.objects.countries,(a,b)=>a!==b));p.stroke();},1.0004);
const sand=patch((p,path)=>{p.save();p.beginPath();path(EG);p.clip();const gr=p.createLinearGradient(0,0,PW,PH);gr.addColorStop(0,'#d8b072');gr.addColorStop(1,'#b8874c');p.fillStyle=gr;p.fillRect(0,0,PW,PH);
  const R=R0(12);for(let i=0;i<2600;i++){p.strokeStyle='rgba(255,236,190,'+R()*.22+')';p.lineWidth=2+R()*2;const x=R()*PW,y=R()*PH,l=20+R()*50;p.beginPath();p.moveTo(x,y);p.quadraticCurveTo(x+l/2,y-10,x+l,y);p.stroke();}
  p.filter='blur(22px)';for(let i=0;i<120;i++){p.fillStyle='rgba(120,80,30,'+R()*.18+')';p.beginPath();p.arc(R()*PW,R()*PH,30+R()*90,0,7);p.fill();}p.restore();},1.0008,true);
sand.material.opacity=0;
const green=patch((p,path)=>{const line=(pts,w)=>{p.beginPath();pts.map(px).forEach((q,i)=>i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]));p.stroke();};
  p.lineCap='round';p.lineJoin='round';p.filter='blur(5px)';p.strokeStyle='#3f8f3a';p.lineWidth=30;line(NILE);p.lineWidth=16;line(DW);line(DE);
  const a=px([31.15,30.35]),b=px([30.1,31.45]),c=px([31.95,31.5]);p.fillStyle='#3f8f3a';p.beginPath();p.moveTo(a[0],a[1]);p.lineTo(b[0],b[1]);p.quadraticCurveTo((b[0]+c[0])/2,b[1]-50,c[0],c[1]);p.closePath();p.fill();
  // Faiyum oasis
  const f=px([30.8,29.3]);p.beginPath();p.arc(f[0],f[1],22,0,7);p.fill();p.filter='none';},1.0011,true);
green.material.opacity=0;

// ---- glowing tubes (progressive)
class Poly extends THREE.Curve{constructor(pts){super();this.p=pts;}getPoint(t,o=new THREE.Vector3()){const n=this.p.length-1,u=t*n,k=Math.min(n-1,Math.floor(u));return o.copy(this.p[k]).lerp(this.p[k+1],u-k);}}
function tube(lonlat,r,rad,col){const pts=lonlat.map(([a,b])=>P(a,b,r));const segs=pts.length*3;const geo=new THREE.TubeGeometry(new Poly(pts),segs,rad,6,false);
  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:col,toneMapped:false}));m.userData.total=segs*6*6;geo.setDrawRange(0,0);sc.add(m);return m;}
let ring=EG.geometry.type==='MultiPolygon'?EG.geometry.coordinates.map(p=>p[0]).sort((a,b)=>b.length-a.length)[0]:EG.geometry.coordinates[0];
// start the trace at the south-west corner and densify
const dens=(r)=>{const o=[];for(let i=0;i<r.length-1;i++){const a=r[i],b=r[i+1],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/0.15));for(let k=0;k<n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]);}o.push(r[r.length-1]);return o;};
const border=tube(dens(ring),1.0012,0.00055,new THREE.Color(1.5,1.35,1.0));
const nile=tube(dens(NILE),1.0013,0.00045,new THREE.Color(0.45,1.25,2.0));
const dw=tube(dens(DW),1.0013,0.0003,new THREE.Color(0.5,1.6,2.6)), de=tube(dens(DE),1.0013,0.0003,new THREE.Color(0.5,1.6,2.6));

// ---- population spikes
const R=R0(8), SP=[];
for(let i=0;i<520;i++){const k=R()*(NILE.length-1),a=NILE[Math.floor(k)],b=NILE[Math.min(NILE.length-1,Math.floor(k)+1)],u=k%1;
  SP.push([a[0]+(b[0]-a[0])*u+(R()-.5)*.14,a[1]+(b[1]-a[1])*u+(R()-.5)*.1,0.25+R()*.6]);}
for(let i=0;i<420;i++){const v=R(),w=R()*(1-v)*1.0;SP.push([31.15+(-1.05*v+0.75*w)*1+(R()-.5)*.1,30.35+1.1*Math.max(v,w)+(R()-.5)*.1,0.35+R()*.7]);}
for(let i=0;i<70;i++)SP.push([31.24+(R()-.5)*.35,30.05+(R()-.5)*.3,1.0+R()*0.9]);   // Cairo
for(let i=0;i<30;i++)SP.push([29.92+(R()-.5)*.3,31.2+(R()-.5)*.08,0.8+R()*0.5]);  // Alexandria
const spG=new THREE.CylinderGeometry(0.00028,0.00028,1,5);spG.translate(0,0.5,0);
const spikes=new THREE.InstancedMesh(spG,new THREE.MeshBasicMaterial({color:new THREE.Color(1.6,1.15,0.35),toneMapped:false}),SP.length);sc.add(spikes);
const UP=new THREE.Vector3(0,1,0),M=new THREE.Matrix4(),Q=new THREE.Quaternion(),S=new THREE.Vector3();
function setSpikes(t){SP.forEach(([lo,la,h],i)=>{const p=P(lo,la,1.0012),n=p.clone().normalize();Q.setFromUnitVectors(UP,n);
  const delay=(32-la)/11*0.9; const f=EBK((t-6.0-delay*0.9)/0.7)*CL((t-6.0-delay*0.9)/0.05);S.set(1,Math.max(1e-4,f*h*h*0.009),1);M.compose(p,Q,S);spikes.setMatrixAt(i,M);});spikes.instanceMatrix.needsUpdate=true;}

// ---- atmosphere + stars
sc.add(new THREE.Mesh(new THREE.SphereGeometry(1.06,96,64),new THREE.ShaderMaterial({side:THREE.BackSide,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:'varying vec3 n;varying vec3 v;void main(){n=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);v=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
  fragmentShader:'varying vec3 n;varying vec3 v;void main(){float f=pow(1.-abs(dot(n,v)),3.);gl_FragColor=vec4(.35,.6,1.,1.)*f*1.6;}'})));
{const g=new THREE.BufferGeometry(),a=[];const r=R0(3);for(let i=0;i<2500;i++){const v=new THREE.Vector3(r()-.5,r()-.5,r()-.5).normalize().multiplyScalar(30+r()*20);a.push(v.x,v.y,v.z);}
 g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));sc.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xaabbdd,size:0.06,sizeAttenuation:true})));}

const comp=new THREE.EffectComposer(ren);comp.addPass(new THREE.RenderPass(sc,cam));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(1080,1920),0.45,0.35,0.95);comp.addPass(bloom);
if(THREE.OutputPass)comp.addPass(new THREE.OutputPass());

// ---- camera path
const lerp=(a,b,f)=>a+(b-a)*f;
function camAt(t){const z=EIO((t-0.9)/2.6), orb=E3((t-6.5)/2.5);
  const cLon=lerp(lerp(-25,12,E3(t/1.4)),31.6,z)+orb*-3.0, cLat=lerp(12,13.0,z)+orb*0.8, cR=lerp(3.7,1.19,z)-orb*0.012;
  cam.position.copy(P(cLon,cLat,cR));
  const tgt=P(lerp(cLon,30.6,z),lerp(cLat,24.6,z),1).multiplyScalar(z);cam.up.set(0,1,0);cam.lookAt(tgt);cam.updateMatrixWorld();}

const el=id=>document.getElementById(id);
const LABS=[['l0',31.24,30.04,5.6],['l1',32.64,25.69,5.3],['l2',32.9,24.09,5.1],['l3',29.92,31.2,5.9]];
function draw(t){camAt(t);
  const fb=E3((t-3.3)/1.5);border.geometry.setDrawRange(0,Math.floor(border.userData.total*fb/6)*6);
  sand.material.opacity=E3((t-4.2)/0.8);
  const fn=EIO((t-4.8)/1.3);nile.geometry.setDrawRange(0,Math.floor(nile.userData.total*fn/6)*6);
  const fd=E3((t-5.9)/0.5);[dw,de].forEach(m=>m.geometry.setDrawRange(0,Math.floor(m.userData.total*fd/6)*6));
  green.material.opacity=E3((t-5.0)/1.0);
  spikes.visible=t>5.9;setSpikes(t);comp.render();
  LABS.forEach(([id,lo,la,t0])=>{const v=P(lo,la,1.002).project(cam);const e=el(id);e.style.left=(v.x*.5+.5)*1080+30+'px';e.style.top=(-v.y*.5+.5)*1920-20+'px';e.style.opacity=E3((t-t0)/.35);});
  el('tag').style.opacity=E3((t-3.8)/.4)*(1-E3((t-6.4)/.3));
  const s=el('hl').children;[6.5,6.9].forEach((t0,i)=>{const a=EBK((t-t0)/.4);s[i].style.opacity=CL((t-t0)/.15);s[i].style.transform=`translateY(${(1-a)*40}px) scale(${.85+.15*a})`;});
  el('box').style.opacity=E3((t-7.6)/.35);el('box').style.transform=`scale(${.8+.2*EBK((t-7.6)/.4)})`;
}
window.DUR=9.4;window.draw=draw;draw(0);document.title='ok';
</script></body></html>
