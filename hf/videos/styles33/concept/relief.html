<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="three.min.js"></script><script src="three-extras.js"></script><script src="geo.js"></script><script src="world50.js"></script></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// styles33 concept v3 (Jan, 2026-11-13, reference: grey relief map + raised highlighted country): /map-doc why Egyptians live along the Nile.
// Relief is STYLISED (procedural, shaped to Egypt's real layout: Red Sea hills, south Sinai mountains, Nile valley); coastlines/borders = Natural Earth.
const CL=x=>x<0?0:x>1?1:x, E3=x=>1-Math.pow(1-CL(x),3), EIO=x=>{x=CL(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const EBK=x=>{x=CL(x);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
function R0(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;};}
function off(w,h,d){const c=document.createElement('canvas');c.width=w;c.height=h;d(c.getContext('2d'),w,h);return c;}
const W=window.WORLD50, LAND=topojson.feature(W,W.objects.land), CTRY=topojson.feature(W,W.objects.countries), EG=CTRY.features.find(f=>f.id==='818');
const NILE=[[31.4,21.9],[31.3,22.4],[31.9,23.0],[32.9,24.1],[32.88,24.6],[32.75,25.2],[32.64,25.7],[32.3,26.1],[31.85,26.5],[31.4,27.0],[31.18,27.25],[30.85,27.8],[30.75,28.4],[30.95,29.0],[31.2,29.6],[31.24,30.04],[31.15,30.35]];
const DW=[[31.15,30.35],[30.9,30.7],[30.5,31.1],[30.3,31.45]], DE=[[31.15,30.35],[31.35,30.8],[31.6,31.15],[31.82,31.5]];
// plane coords: mercator, centred on 30E/26N, 1 unit ~ 10 degrees of longitude
const MP=d3.geoMercator().center([30,26]).scale(1).translate([0,0]); const K=180/Math.PI/10;
const XY=([lo,la])=>{const q=MP([lo,la]);return [q[0]*K,-q[1]*K];};      // x east, y north
const EXT=[-1.6,-1.6,1.6,1.6]; // plane extent (x0,y0,x1,y1)
const HM=1024, toPix=([x,y])=>[(x-EXT[0])/(EXT[2]-EXT[0])*HM,(EXT[3]-y)/(EXT[3]-EXT[1])*HM];
const pproj={stream:s=>({point:(lo,la)=>{const q=toPix(XY([lo,la]));s.point(q[0],q[1]);},sphere:()=>s.sphere(),lineStart:()=>s.lineStart(),lineEnd:()=>s.lineEnd(),polygonStart:()=>s.polygonStart(),polygonEnd:()=>s.polygonEnd()})};

// ---- value noise fbm
const PERM=(()=>{const R=R0(7),p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(R()*(i+1));[p[i],p[j]]=[p[j],p[i]];}return p.concat(p);})();
const hash=(x,y)=>PERM[(PERM[x&255]+y)&255]/255;
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vn(x*f,y*f);f*=2.03;a*=.5;}return s;}
function ridged(x,y,o){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*Math.pow(1-Math.abs(vn(x*f,y*f)*2-1),2);f*=2.1;a*=.5;}return s;}

// ---- masks
const landC=off(HM,HM,(p)=>{p.fillStyle='#000';p.fillRect(0,0,HM,HM);p.fillStyle='#fff';p.beginPath();d3.geoPath(pproj,p)(LAND);p.fill();});
const coastC=off(HM,HM,(p)=>{p.filter='blur(26px)';p.drawImage(landC,0,0);});
const egC=off(HM,HM,(p)=>{p.fillStyle='#000';p.fillRect(0,0,HM,HM);p.fillStyle='#fff';p.beginPath();d3.geoPath(pproj,p)(EG);p.fill();});
const nileC=off(HM,HM,(p)=>{p.fillStyle='#000';p.fillRect(0,0,HM,HM);p.strokeStyle='#fff';p.lineCap='round';p.lineJoin='round';p.filter='blur(4px)';
  [[NILE,10],[DW,6],[DE,6]].forEach(([L,w])=>{p.lineWidth=w;p.beginPath();L.map(q=>toPix(XY(q))).forEach((q,i)=>i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]));p.stroke();});});
const px=c=>c.getContext('2d').getImageData(0,0,HM,HM).data;
const LM=px(landC),CM=px(coastC),NM=px(nileC),EM=px(egC);
const H=new Float32Array(HM*HM);
for(let j=0;j<HM;j++)for(let i=0;i<HM;i++){const k=j*HM+i, land=LM[k*4]/255; if(land<0.5){H[k]=0;continue;}
  const x=EXT[0]+i/HM*(EXT[2]-EXT[0]), y=EXT[3]-j/HM*(EXT[3]-EXT[1]); const lo=30+x*10, la=26+y*8.8;
  let h=0.04+0.10*fbm(x*5,y*5,6)+0.035*ridged(x*12,y*12,5);                                   // desert plateau
  const coast=1-CM[k*4]/255;                                          // ~1 near the sea
  const redsea=CL((lo-32.3)/1.2)*CL((29.5-la)/2)*CL(coast*2.2);      // Red Sea hills
  const sinai=CL((29.0-la)/1.0)*CL((lo-33.3)/.5)*CL((35-lo)/.5);       // south Sinai
  const south=CL((16-la)/2)*CL((lo-35)/2);                             // Ethiopian highlands edge
  h+=(redsea*0.38+sinai*0.5+south*0.8)*ridged(x*9,y*9,6);
  h-=0.07*CL((22.8-la)*0)+0.0;                                         // (placeholder)
  h*=1-0.85*NM[k*4]/255;                                               // Nile valley cut
  h*=CL(land*1.2); h+=0.22*(EM[k*4]/255); H[k]=h;}

const ren=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
ren.setSize(1080,1920,false);ren.toneMapping=THREE.ACESFilmicToneMapping;ren.outputColorSpace=THREE.SRGBColorSpace;ren.shadowMap.enabled=true;ren.toneMappingExposure=0.75;
const sc=new THREE.Scene();sc.background=new THREE.Color(0x1a1b20);sc.fog=new THREE.Fog(0x1a1b20,3.6,7.5);
const cam=new THREE.PerspectiveCamera(38,1080/1920,0.01,50);
sc.add(new THREE.HemisphereLight(0xd8dcff,0x30302c,0.35));
const key=new THREE.DirectionalLight(0xffffff,1.7);key.position.set(-3,1.4,-0.6);sc.add(key);   // low raking light = hillshade
const tex=(c,srgb)=>{const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;};

// ---- terrain
const SEG=640, Z=0.16;
const tg=new THREE.PlaneGeometry(EXT[2]-EXT[0],EXT[3]-EXT[1],SEG,SEG);const pos=tg.attributes.position;
const sampleH=(x,y)=>{const i=Math.min(HM-1,Math.max(0,Math.round((x-EXT[0])/(EXT[2]-EXT[0])*HM))),j=Math.min(HM-1,Math.max(0,Math.round((EXT[3]-y)/(EXT[3]-EXT[1])*HM)));return H[j*HM+i];};
for(let v=0;v<pos.count;v++){pos.setZ(v,sampleH(pos.getX(v),pos.getY(v))*Z);}tg.computeVertexNormals();
const albedo=off(HM,HM,(p)=>{p.drawImage(landC,0,0);p.globalCompositeOperation='source-in';p.fillStyle='#5d5f66';p.fillRect(0,0,HM,HM);p.globalCompositeOperation='source-over';p.save();p.beginPath();d3.geoPath(pproj,p)(EG);p.clip();p.fillStyle='#b52f95';p.fillRect(0,0,HM,HM);p.restore();
  const R=R0(3);for(let i=0;i<120000;i++){p.fillStyle='rgba('+(R()<.5?'0,0,0,':'255,255,255,')+R()*.05+')';p.fillRect(R()*HM,R()*HM,1,1);}});
function egGlow(){return off(HM,HM,(p)=>{p.fillStyle='#000';p.fillRect(0,0,HM,HM);p.fillStyle='#5a0a48';p.beginPath();d3.geoPath(pproj,p)(EG);p.fill();});}
const terr=new THREE.Mesh(tg,new THREE.MeshStandardMaterial({map:tex(albedo,true),roughness:.85,metalness:0,emissive:0xffffff,emissiveMap:tex(egGlow(),true),emissiveIntensity:.35,transparent:true,alphaTest:.5,alphaMap:tex(landC)}));
terr.rotation.x=-Math.PI/2;sc.add(terr);
// ---- sea: pale silver with a dot grid
const seaC=off(2048,2048,(p,w,h)=>{const gr=p.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#c4c7d3');gr.addColorStop(1,'#a9adbc');p.fillStyle=gr;p.fillRect(0,0,w,h);
  p.fillStyle='rgba(120,125,150,.55)';for(let y=0;y<h;y+=14)for(let x=(y/14%2)*7;x<w;x+=14){p.beginPath();p.arc(x,y,1.5,0,7);p.fill();}});
const sea=new THREE.Mesh(new THREE.PlaneGeometry(24,24),new THREE.MeshStandardMaterial({map:tex(seaC,true),roughness:.35,metalness:.1,emissive:0xffffff,emissiveMap:tex(seaC,true),emissiveIntensity:.55}));sea.rotation.x=-Math.PI/2;sea.position.y=-0.002;sc.add(sea);
function lineOnTerrain(rings,col,op,dy){rings.forEach(r=>{const pts=[];for(let i=0;i<r.length-1;i++){const a=r[i],b=r[i+1],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/0.05));for(let k=0;k<n;k++){const q=[a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n];const [x,z]=XY(q);pts.push(new THREE.Vector3(x,sampleMax(x,z)*Z+dy,-z));}}
  sc.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op,toneMapped:false})));});}
const sampleMax=(x,y)=>{let m=0;for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){m=Math.max(m,sampleH(x+dx*0.003,y+dy*0.003));}return m;};
// coast glow line
function lineOf(rings,y,col,op){const g=new THREE.Group();rings.forEach(r=>{const pts=r.map(q=>{const [x,z]=XY(q);return new THREE.Vector3(x,y,-z);});
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op,toneMapped:false})));});sc.add(g);return g;}
const ringsOf=f=>(f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates).map(p=>p[0]);
lineOf(LAND.features.flatMap(ringsOf),0.002,new THREE.Color(1.2,1.2,1.35),.8);

// ---- Egypt: raised slab
const egR=ringsOf(EG).sort((a,b)=>b.length-a.length);
const egG=new THREE.Group();sc.add(egG);
lineOnTerrain(egR,new THREE.Color(2.0,1.2,2.0),1,0.004);
// Nile + green strip on the slab
function tubeOf(L0,r,col){const L=[];for(let i=0;i<L0.length-1;i++){const a=L0[i],b=L0[i+1],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/0.05));for(let k=0;k<n;k++)L.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]);}L.push(L0[L0.length-1]);
  const pts=L.map(q=>{const [x,z]=XY(q);return new THREE.Vector3(x,sampleMax(x,z)*Z+0.005,-z);});const c=new THREE.CatmullRomCurve3(pts);
  const m=new THREE.Mesh(new THREE.TubeGeometry(c,600,r,6,false),new THREE.MeshBasicMaterial({color:col,toneMapped:false}));sc.add(m);return m;}
tubeOf(NILE,0.0042,new THREE.Color(0.4,1.6,2.4));tubeOf(DW,0.003,new THREE.Color(0.4,1.6,2.4));tubeOf(DE,0.003,new THREE.Color(0.4,1.6,2.4));
// population: small glowing squares rising along the valley
const R=R0(8),SP=[];
for(let i=0;i<150;i++){const k=R()*(NILE.length-1),a=NILE[Math.floor(k)],b=NILE[Math.min(NILE.length-1,Math.floor(k)+1)],u=k%1;SP.push([a[0]+(b[0]-a[0])*u+(R()-.5)*.16,a[1]+(b[1]-a[1])*u+(R()-.5)*.12,.3+R()*.5]);}
for(let i=0;i<120;i++){const v=R(),w=R()*(1-v);SP.push([31.15-1.05*v+0.75*w+(R()-.5)*.1,30.35+1.1*Math.max(v,w)+(R()-.5)*.1,.4+R()*.6]);}
for(let i=0;i<40;i++)SP.push([31.24+(R()-.5)*.3,30.05+(R()-.5)*.25,1.2+R()*1.2]);
const spG=new THREE.BoxGeometry(0.006,1,0.006);spG.translate(0,.5,0);
const spk=new THREE.InstancedMesh(spG,new THREE.MeshBasicMaterial({color:new THREE.Color(1.5,1.35,0.9),toneMapped:false}),SP.length);sc.add(spk);
const M=new THREE.Matrix4();SP.forEach(([lo,la,h],i)=>{const [x,z]=XY([lo,la]);M.makeScale(.6,h*0.022,.6);M.setPosition(x,sampleH(x,z)*Z,-z);spk.setMatrixAt(i,M);});

// ---- labels printed on the map (flat) and city markers (standing)
function textPlane(txt,size,col,w,spacing,font){const c=off(1024,160,(p)=>{p.font=font||('600 '+size+'px Inter');p.fillStyle=col;p.textAlign='center';p.textBaseline='middle';
    if(spacing){p.letterSpacing=spacing+'px';}p.fillText(txt,512,80);});
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w*160/1024),new THREE.MeshBasicMaterial({map:tex(c,true),transparent:true,depthWrite:false,toneMapped:false}));m.rotation.x=-Math.PI/2;sc.add(m);return m;}
const put=(m,lo,la,y)=>{const [x,z]=XY([lo,la]);m.position.set(x,y,-z);};
put(textPlane('EGYPT',110,'#ffffff',0.9,24,'800 110px Inter'),28.4,26.4,0.22*Z+0.06);
put(textPlane('LIBYA',70,'rgba(225,225,235,.75)',0.6,18),21.5,27.5,0.03);
put(textPlane('SUDAN',70,'rgba(225,225,235,.75)',0.6,18),30,18.4,0.03);
put(textPlane('SAUDI ARABIA',60,'rgba(225,225,235,.75)',0.8,14),40,25.5,0.05);
put(textPlane('RED SEA',60,'rgba(90,95,120,.85)',0.55,16),36.6,22.8,0.004);
put(textPlane('MEDITERRANEAN SEA',60,'rgba(90,95,120,.85)',0.9,14),27.5,33.6,0.004);
// city markers: little square + label standing up
function city(n,lo,la){const c=off(512,128,(p)=>{p.fillStyle='rgba(20,20,26,.85)';p.fillRect(4,24,80,80);p.strokeStyle='#fff';p.lineWidth=6;p.strokeRect(24,44,40,40);
    p.font='700 64px Inter';p.fillStyle='#fff';p.fillText(n,104,88);});
  const m=new THREE.Sprite(new THREE.SpriteMaterial({map:tex(c,true),toneMapped:false,depthWrite:false}));m.scale.set(.36,.09,1);m.center.set(0,0);const [x,z]=XY([lo,la]);m.position.set(x-0.02,sampleH(x,z)*Z+0.03,-z);sc.add(m);return m;}
city('Cairo',31.24,30.04);city('Luxor',32.64,25.69);city('Aswan',32.9,24.09);

// ---- post: bloom + depth of field
const comp=new THREE.EffectComposer(ren);comp.addPass(new THREE.RenderPass(sc,cam));
const bok=new THREE.BokehPass(sc,cam,{focus:2.2,aperture:0.0022,maxblur:0.008});comp.addPass(bok);
comp.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(1080,1920),0.35,0.4,0.92));
if(THREE.OutputPass)comp.addPass(new THREE.OutputPass());

function draw(t){const f=EIO(t/8);
  const lo=29.6+1.5*f, la=26.4+0.9*f;const tgt=new THREE.Vector3(...(()=>{const [x,z]=XY([lo,la]);return [x,0.03,-z];})());
  const ang=-0.30+0.32*f, dist=3.5-1.5*f, hgt=1.75-0.95*f;
  cam.position.set(tgt.x+Math.sin(ang)*dist,hgt,tgt.z+Math.cos(ang)*dist);cam.lookAt(tgt);
  bok.uniforms.focus.value=cam.position.distanceTo(tgt);comp.render();}
window.DUR=8;window.draw=draw;draw(0);document.title='ok';
</script></body></html>
