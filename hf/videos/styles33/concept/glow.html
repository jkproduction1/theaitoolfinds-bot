<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script>
// styles33 concept: /glow-science what happens to your body in space without a suit (flat glow look of styles19/29; own design).
// Facts TO VERIFY before the final build (NASA): ~15 s of useful consciousness; you don't explode and don't freeze instantly;
// moisture on the tongue boils (low pressure); the body swells (ebullism); rescue within ~1-2 min can be survived.
const g=document.getElementById('c').getContext('2d'),SANS="Inter,'DejaVu Sans',Arial,sans-serif";
const CL=x=>x<0?0:x>1?1:x,E3=x=>1-Math.pow(1-CL(x),3);
function R0(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;};}
function off(w,h,d){const c=document.createElement('canvas');c.width=w;c.height=h;d(c.getContext('2d'),w,h);return c;}
const bg=off(1080,1920,(p,w,h)=>{const gr=p.createRadialGradient(w*.5,h*.52,60,w*.5,h*.5,1300);gr.addColorStop(0,'#232a7a');gr.addColorStop(.5,'#12154a');gr.addColorStop(1,'#04051c');p.fillStyle=gr;p.fillRect(0,0,w,h);
  p.filter='blur(90px)';[[160,560,260,'rgba(120,90,255,.30)'],[960,1420,300,'rgba(40,190,255,.24)'],[900,620,220,'rgba(255,110,190,.16)']].forEach(([x,y,r,c])=>{p.fillStyle=c;p.beginPath();p.arc(x,y,r,0,7);p.fill();});});
const R=R0(9),ST=[];for(let i=0;i<170;i++)ST.push([R()*1080,R()*1920,.8+R()*R()*4,R()*6]);
function label(txt,x,y,tx,ty,col){g.save();g.font='800 40px '+SANS;const w=g.measureText(txt).width+52;g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=4;g.beginPath();g.moveTo(x+w/2,y);g.lineTo(tx,ty);g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(tx,ty,9,0,7);g.fill();
  g.fillStyle='rgba(9,12,44,.88)';g.beginPath();g.roundRect(x,y-36,w,72,36);g.fill();g.strokeStyle=col||'rgba(255,255,255,.25)';g.lineWidth=2;g.stroke();g.fillStyle='#fff';g.fillText(txt,x+26,y+14);g.restore();}
function draw(t){g.drawImage(bg,0,0);ST.forEach(([x,y,r,ph])=>{g.globalAlpha=.25+.3*(.5+.5*Math.sin(t*2+ph));g.fillStyle='#e8e4ff';g.beginPath();g.arc(x,y,r,0,7);g.fill();});g.globalAlpha=1;
  // Facts (Healthline; 2012 study, 13 adults): cold cools the roof of the mouth; blood flow in the front brain arteries jumps;
  // nerves behind the nose (near the trigeminal nerve) send pain to the front of the head; lasts seconds to a minute or two; tongue to the palate helps.
  const HX=470,HY=980;g.save();g.translate(HX,HY);
  // head in profile (facing right), flat with glow
  g.shadowColor='rgba(140,200,255,.7)';g.shadowBlur=60;g.fillStyle='#f3c9a0';g.beginPath();
  g.moveTo(-40,-360);g.bezierCurveTo(170,-380,300,-250,300,-110);g.bezierCurveTo(302,-60,330,-30,356,10);g.bezierCurveTo(366,28,340,36,318,38);
  g.bezierCurveTo(322,60,318,78,300,84);g.bezierCurveTo(312,104,306,122,290,128);g.bezierCurveTo(300,190,260,236,180,232);g.lineTo(120,236);g.lineTo(110,400);g.lineTo(-190,400);
  g.bezierCurveTo(-170,300,-230,220,-270,120);g.bezierCurveTo(-340,-80,-280,-340,-40,-360);g.closePath();g.fill();g.shadowBlur=0;
  // hair
  g.fillStyle='#3a2a6a';g.beginPath();g.moveTo(-40,-360);g.bezierCurveTo(120,-380,230,-320,270,-230);g.bezierCurveTo(160,-250,60,-230,-20,-160);g.bezierCurveTo(-80,-100,-150,-40,-190,60);g.bezierCurveTo(-240,60,-262,120,-270,120);g.bezierCurveTo(-340,-80,-280,-340,-40,-360);g.fill();
  // eye squeezed shut (pain) + brow
  g.strokeStyle='#1a1436';g.lineWidth=10;g.lineCap='round';g.beginPath();g.moveTo(196,-70);g.lineTo(246,-54);g.moveTo(246,-54);g.lineTo(200,-38);g.stroke();g.beginPath();g.moveTo(180,-112);g.lineTo(262,-92);g.stroke();
  // mouth cavity + palate (cold blue)
  g.fillStyle='#5b1e4a';g.beginPath();g.moveTo(296,108);g.bezierCurveTo(230,96,150,96,110,116);g.bezierCurveTo(150,150,240,150,292,132);g.closePath();g.fill();
  const pulse=.5+.5*Math.sin(t*5);g.strokeStyle='#8fe6ff';g.shadowColor='#8fe6ff';g.shadowBlur=30+20*pulse;g.lineWidth=14;g.beginPath();g.moveTo(286,104);g.bezierCurveTo(230,90,150,90,112,112);g.stroke();g.shadowBlur=0;
  // brain (pink, flat) inside the skull
  g.fillStyle='#ff8fb8';g.beginPath();g.moveTo(-30,-290);g.bezierCurveTo(120,-310,240,-220,236,-140);g.bezierCurveTo(232,-90,150,-70,100,-76);g.bezierCurveTo(60,-20,-40,-20,-90,-50);g.bezierCurveTo(-200,-60,-210,-270,-30,-290);g.fill();
  g.strokeStyle='rgba(180,60,110,.55)';g.lineWidth=7;[[ -120,-200,-40,-250,40,-200],[-60,-130,20,-170,100,-130],[90,-230,150,-200,190,-160],[-150,-120,-100,-90,-40,-100]].forEach(([a,b,c,d,e,f])=>{g.beginPath();g.moveTo(a,b);g.quadraticCurveTo(c,d,e,f);g.stroke();});
  // artery from the palate up to the front of the brain: glowing red, swelling
  g.strokeStyle='#ff4d5e';g.shadowColor='#ff4d5e';g.shadowBlur=36;g.lineWidth=14+10*pulse;g.beginPath();g.moveTo(190,96);g.bezierCurveTo(200,30,150,-20,170,-90);g.bezierCurveTo(180,-130,200,-150,206,-170);g.stroke();
  // nerve (yellow dashed) from behind the nose to the forehead
  g.strokeStyle='#ffe066';g.shadowColor='#ffe066';g.shadowBlur=24;g.lineWidth=8;g.setLineDash([18,14]);g.lineDashOffset=-t*60;g.beginPath();g.moveTo(230,60);g.bezierCurveTo(270,0,280,-90,268,-190);g.stroke();g.setLineDash([]);
  // pain burst at the forehead
  g.shadowColor='#ffe066';g.shadowBlur=40;g.strokeStyle='#ffe066';g.lineWidth=12;for(let i=0;i<7;i++){const a=-1.5+i*.42,r0=70+10*pulse,r1=120+26*pulse;g.beginPath();g.moveTo(290+Math.cos(a)*r0,-210+Math.sin(a)*r0);g.lineTo(290+Math.cos(a)*r1,-210+Math.sin(a)*r1);g.stroke();}
  g.restore();
  // ice-cream cone coming to the mouth
  g.save();g.translate(900,1150+Math.sin(t*1.5)*8);g.rotate(-.55);g.shadowColor='rgba(143,230,255,.9)';g.shadowBlur=50;g.fillStyle='#bff3ff';g.beginPath();g.arc(0,-70,86,0,7);g.fill();g.fillStyle='#8fe6ff';g.beginPath();g.arc(-30,-110,56,0,7);g.arc(34,-116,50,0,7);g.fill();g.shadowBlur=0;
  g.fillStyle='#e9a857';g.beginPath();g.moveTo(-84,-40);g.lineTo(84,-40);g.lineTo(0,220);g.closePath();g.fill();g.strokeStyle='rgba(120,70,20,.5)';g.lineWidth=5;for(let i=-3;i<4;i++){g.beginPath();g.moveTo(i*26,-40);g.lineTo(i*26+50,60);g.moveTo(i*26,-40);g.lineTo(i*26-50,60);g.stroke();}g.restore();
  label('1  Cold hits the roof of your mouth',60,1500,HX+200,HY+104,'#8fe6ff');label('2  Blood rushes to the front',60,560,HX+170,HY-90,'#ff4d5e');label('3  Pain in your forehead',470,1620,HX+300,HY-150,'#ffe066');
  g.save();g.textAlign='center';g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=20;g.fillStyle='#fff';g.font='800 84px '+SANS;g.fillText('Why ice cream',540,270);const a='gives you ',b='brain freeze';g.font='800 76px '+SANS;const wa=g.measureText(a).width,wb=g.measureText(b).width,x0=540-(wa+wb)/2;g.textAlign='left';g.fillText(a,x0,370);g.fillStyle='#8fe6ff';g.shadowColor='rgba(143,230,255,.9)';g.shadowBlur=30;g.fillText(b,x0+wa,370);g.restore();}
window.DUR=6;window.draw=draw;document.fonts.load('800 40px Inter').then(()=>{draw(2);document.title='ok';});
</script></body></html>
