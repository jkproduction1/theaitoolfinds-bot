<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yellowstone supervolcano erupting</title>
<!-- yellow71 r0: /simulate the Yellowstone supervolcano erupting. Procedural plateau + ring-fracture eruption (own look), inspired by the
  Lava Creek eruption. Facts: USGS "Summary of Yellowstone eruption history" (usgs.gov/volcanoes/yellowstone): Lava Creek Tuff, 0.640 Ma
  ("640,000 years ago"), Yellowstone caldera 85 x 45 km, 1,000 km3 erupted (~240 mi3, own conversion). Caldera = collapse of the roof
  over the emptied magma chamber. Distances in km, terrain height exaggerated, time sped up. -->
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head>
<body>
<div id="stage">
  <div id="ov">
    <svg id="lines" width="1080" height="1920"></svg>
    <div class="pill hot" id="pRing">The ground cracks open</div>
    <div class="pill red" id="pCal">Caldera: 85 × 45 km<small>53 × 28 miles</small></div>
    <div class="pill" id="pVol">1,000 km³ of rock and ash<small>about 240 cubic miles</small></div>
    <div id="note">inspired by Lava Creek, 640,000 years ago · time sped up</div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { W, H, DUR, cl, ramp, sm, eio, eout, V, mulberry32, setup, softTex, labels, injectCSS, ready } from './studio.js';
injectCSS();
document.head.insertAdjacentHTML('beforeend','<style>.pill small{display:block;font-size:31px;font-weight:600;color:#cfd6e0;margin-top:2px;text-align:center}.pill{text-align:center}#note{position:absolute;left:40px;right:40px;top:1560px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:25px;color:rgba(230,225,220,.7)}</style>');
const { renderer, scene, camera } = setup(34, [.07, .05, .05], [.42, .30, .24]);
camera.far = 5000; camera.updateProjectionMatrix();
scene.fog = new THREE.Fog('#5a4a40', 420, 1300);
const rnd = mulberry32(71); const R = (a, b) => a + rnd() * (b - a);
const RX = 42.5, RZ = 22.5; // caldera half-axes (km)
const ell = (x, z) => Math.hypot(x / RX, z / RZ);
// ---- plateau (km); heights exaggerated x3 for readability
const HS = (i, j) => { let h = Math.imul(i, 374761393) + Math.imul(j, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function vn(x, z) { const i = Math.floor(x), j = Math.floor(z), fx = x - i, fz = z - j, u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  return (HS(i, j) * (1 - u) + HS(i + 1, j) * u) * (1 - v) + (HS(i, j + 1) * (1 - u) + HS(i + 1, j + 1) * u) * v; }
function n2(x, z) { let s = 0, a = 1, f = 1 / 38; for (let o = 0; o < 5; o++) { s += a * (vn(x * f + 17, z * f + 3) - .5); a *= .5; f *= 2.03; } return s * 1.6; }
const TG = new THREE.PlaneGeometry(700, 700, 260, 260); TG.rotateX(-Math.PI / 2);
const tp = TG.attributes.position, tx = Float32Array.from({ length: tp.count }, (_, i) => tp.getX(i)), tz = Float32Array.from({ length: tp.count }, (_, i) => tp.getZ(i));
const base = Float32Array.from({ length: tp.count }, (_, i) => 0.9 + 0.9 * n2(tx[i], tz[i]) + 1.6 * sm(cl((Math.hypot(tx[i], tz[i]) - 110) / 220)) * (0.6 + n2(tx[i] * 2, tz[i] * 2)));
const TC = new Float32Array(tp.count * 3); TG.setAttribute('color', new THREE.BufferAttribute(TC, 3));
const forest = new THREE.Color('#2f4a2c'), rock = new THREE.Color('#6b6356'), ash = new THREE.Color('#9d958b'), glow = new THREE.Color('#ff6a1f'), cc = new THREE.Color();
const terrain = new THREE.Mesh(TG, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95, metalness: 0, emissive: '#000', }));
scene.add(terrain);
scene.add(new THREE.HemisphereLight('#f0d9c4', '#2a1a12', 1.0));
const sunL = new THREE.DirectionalLight('#ffd1a0', 2.4); sunL.position.set(-200, 160, 120); scene.add(sunL);
const fire = new THREE.PointLight('#ff6a20', 0, 400, 1.2); fire.position.set(0, 8, 0); scene.add(fire);
function updTerrain(t) {
  const crack = sm(ramp(t, -0.6, 0.6)), sink = eio(ramp(t, 2.2, 5.6)), ashK = sm(ramp(t, 2.6, 6.2));
  const ashR = 20 + 230 * eout(ramp(t, 1.8, 6.3));
  for (let i = 0; i < tp.count; i++) {
    const x = tx[i], z = tz[i], e = ell(x, z), d = Math.hypot(x, z);
    let y = base[i] * 2.2;
    y -= 4 * sink * sm(cl((1.04 - e) / .12));            // roof collapses into the emptied chamber
    const ring = Math.exp(-Math.pow((e - 1) / .035, 2));
    y -= 1.5 * ring * crack;
    tp.setY(i, y);
    const hgt = base[i];
    cc.copy(forest).lerp(rock, cl((hgt - 1.6) / 1.4));
    const covered = ashK * sm(cl((ashR - d) / 40)) * (0.55 + 0.45 * cl(1.2 - d / 300));
    cc.lerp(ash, covered);
    cc.lerp(glow, ring * crack * (0.85 + 0.15 * Math.sin(x * .7 + t * 8)));
    if (e < 1) cc.lerp(glow, 0.55 * sink * sm(cl((1 - e) / .3)) * (1 - 0.6 * ashK));
    TC[i * 3] = cc.r; TC[i * 3 + 1] = cc.g; TC[i * 3 + 2] = cc.b;
  }
  tp.needsUpdate = true; TG.attributes.color.needsUpdate = true; TG.computeVertexNormals();
}
// ---- particles: ring-vent columns, collapsing flows, umbrella cloud
const N = 12000, T0 = -1.0;
const P = new Float32Array(N * 3), C = new Float32Array(N * 3), S = new Float32Array(N), A = new Float32Array(N);
const birth = new Float32Array(N), th = new Float32Array(N), rr = new Float32Array(N), kind = new Float32Array(N), sp = new Float32Array(N);
for (let i = 0; i < N; i++) { kind[i] = i < 3000 ? 1 : 0; th[i] = R(0, Math.PI * 2); rr[i] = rnd(); sp[i] = R(.75, 1.25);
  birth[i] = kind[i] ? R(0.9, DUR) : T0 + (DUR - T0) * Math.pow(rnd(), 1.2); }
const PG = new THREE.BufferGeometry();
PG.setAttribute('position', new THREE.BufferAttribute(P, 3)); PG.setAttribute('color', new THREE.BufferAttribute(C, 3));
PG.setAttribute('size', new THREE.BufferAttribute(S, 1)); PG.setAttribute('alpha', new THREE.BufferAttribute(A, 1));
const PM = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { map: { value: softTex() } },
  vertexShader: `attribute float size; attribute float alpha; attribute vec3 color; varying vec3 vC; varying float vA;
    void main(){ vC=color; vA=alpha; vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=size*900./(-mv.z); gl_Position=projectionMatrix*mv; }`,
  fragmentShader: `uniform sampler2D map; varying vec3 vC; varying float vA; void main(){ vec4 m=texture2D(map,gl_PointCoord); gl_FragColor=vec4(vC, m.a*vA); }` });
const cloud = new THREE.Points(PG, PM); cloud.frustumCulled = false; scene.add(cloud);
const HT = 46, col = new THREE.Color(), dark = new THREE.Color('#4a423c'), light = new THREE.Color('#f1e8dc'), hot = new THREE.Color('#ff8a3c');
function updCloud(t) {
  for (let i = 0; i < N; i++) {
    const age = t - birth[i]; let a = 0, x = 0, y = 0, z = 0, s = 1;
    const vx = Math.cos(th[i]) * RX, vz = Math.sin(th[i]) * RZ;
    if (age > 0) {
      if (kind[i]) { // pyroclastic flow: column collapse, races outward hugging the ground
        const u = age * sp[i]; const r = 2 + 34 * (1 - Math.exp(-u / 1.3)) * (0.5 + rr[i]);
        const dx = Math.cos(th[i]), dz = Math.sin(th[i]);
        x = vx + dx * r + Math.sin(th[i] * 9 + u) * 3; z = vz + dz * r; y = 4 + 5 * Math.exp(-u) + 3 * rr[i];
        s = 6 + 5 * u; a = 0.28 * sm(cl(age / .3)) * cl(1.4 - u / 3.5);
        col.copy(dark).lerp(light, 0.35 + 0.3 * rr[i]); if (u < .6) col.lerp(hot, .45 * (1 - u / .6));
      } else { // ring-vent columns merging into one umbrella cloud
        const tau = 1.6 * sp[i]; const h = HT * (1 - Math.exp(-age / tau)) * (0.9 + 0.15 * rr[i]);
        const top = sm(cl((h - 26) / 12)); const pull = sm(cl(h / 30));
        const umb = top * (30 + 90 * eout(cl((age - 1.2) / 5))) * Math.sqrt(rr[i]);
        const cx = vx * (1 - .55 * pull), cz = vz * (1 - .55 * pull);
        x = cx + Math.cos(th[i] * 7 + age * .3) * (1.2 + h * .12) * rr[i] + Math.cos(th[i] + 1.7) * umb;
        z = cz + Math.sin(th[i] * 7 + age * .3) * (1.2 + h * .12) * rr[i] + Math.sin(th[i] + 1.7) * umb * .8;
        y = h + 2.5 * Math.sin(th[i] * 5 + age);
        s = 3 + h * .22 + top * 9; a = (0.5 - 0.2 * top) * sm(cl(age / .25));
        const lit = cl(0.4 + 0.35 * (-x / 120) + 0.35 * (y / HT)); col.copy(dark).lerp(light, lit);
        if (y < 7) col.lerp(hot, 0.5 * (1 - y / 7));
      }
    }
    P[i * 3] = x; P[i * 3 + 1] = y; P[i * 3 + 2] = z; S[i] = s; A[i] = a; C[i * 3] = col.r; C[i * 3 + 1] = col.g; C[i * 3 + 2] = col.b;
  }
  PG.attributes.position.needsUpdate = PG.attributes.color.needsUpdate = PG.attributes.size.needsUpdate = PG.attributes.alpha.needsUpdate = true;
}
// ---- dashed caldera outline (85 x 45 km)
const ringPts = []; for (let k = 0; k <= 128; k++) { const a = k / 128 * Math.PI * 2; ringPts.push(V(Math.cos(a) * RX, 9, Math.sin(a) * RZ)); }
const outline = new THREE.Line(new THREE.BufferGeometry().setFromPoints(ringPts), new THREE.LineDashedMaterial({ color: '#ff4a4a', dashSize: 3, gapSize: 2, transparent: true, opacity: 0, depthTest: false }));
outline.computeLineDistances(); outline.renderOrder = 5; scene.add(outline);
// ---- camera: low over the forest at the ring, then up and back to the whole caldera + cloud
function setCam(t) { const a = eio(ramp(t, 0.4, 6.0)), u = cl(t / DUR);
  const dist = 175 + 200 * a, yaw = 0.9 - 0.4 * a + 0.05 * u;
  camera.position.set(Math.sin(yaw) * dist, 16 + 60 * a, Math.cos(yaw) * dist);
  camera.lookAt(0, 30 + 2 * a, 0); camera.updateMatrixWorld(); }
const E = id => document.getElementById(id);
const lab = labels(camera, [
  { el: E('pRing'), t0: 0.35, t1: 2.6, at: () => [Math.cos(1.2) * RX, 3, Math.sin(1.2) * RZ], col: '#ffb547', pos: (x, y) => [cl(x - 40, 330, 750), cl(y + 260, 300, 1480)] },
  { el: E('pCal'), t0: 3.0, at: () => [-RX, 9, 0], col: '#ff4a4a', pos: (x, y) => [cl(x + 60, 330, 750), cl(y + 240, 300, 1480)] },
  { el: E('pVol'), t0: 4.1, at: () => [10, HT - 4, -6], pos: (x, y) => [cl(x, 330, 750), cl(y - 200, 230, 1400)] },
]);
function render(t) { t = cl(t, 0, DUR); setCam(t); updTerrain(t); updCloud(t);
  fire.intensity = 900 * sm(ramp(t, 0.3, 1.5)) * (0.8 + 0.2 * Math.sin(t * 11));
  outline.material.opacity = 0.95 * sm(ramp(t, 2.8, 3.3));
  renderer.render(scene, camera); lab(t);
  E('note').style.opacity = sm(ramp(t, 0.5, 1.0)); }
await ready(render);
</script>
</body>
</html>
