  dust bin, main brush roll + side brush, two drive wheels, suction fan.
  - Dreame "Know Your Robot Vacuum Parts": https://www.dreametech.com/blogs/blog/robot-vacuum-parts
  - Ecovacs "How does a robot vacuum work": https://www.ecovacs.com/us/blog/how-does-a-robot-vacuum-cleaner-work
  - Narwal "Robot vacuum components": https://us.narwal.com/blogs/product/main-components-of-robot-vacuum
  Typical size ~35 cm diameter, ~9.5 cm tall (+ LiDAR turret). Units in scene = cm. -->

  .pill.hot{border-color:#ffb547;box-shadow:0 0 30px rgba(255,170,60,.45),0 8px 30px rgba(0,0,0,.4)}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./"}}</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';

const DUR = 6.33; window.DUR = DUR;
const W = 1080, H = 1920;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
stage.prepend(renderer.domElement);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(11);
const R = (a, b) => a + rnd() * (b - a);
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ramp = (t, a, b) => cl((t - a) / (b - a));
const sm = x => x * x * (3 - 2 * x);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const popS = x => { const c1 = 1.70158, c3 = c1 + 1, y = x - 1; return 1 + c3 * y * y * y + c1 * y * y; };

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, W / H, 1, 3000);

// ---------- studio backdrop ----------
const bgU = { uX: { value: 0 }, uRes: { value: new THREE.Vector2(W, H) } };
const bg = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: bgU,
  vertexShader: `void main(){ gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader: `uniform float uX; uniform vec2 uRes;
    void main(){ vec2 p = gl_FragCoord.xy/uRes; vec2 q = (p-vec2(.5,.55))*vec2(1.0,1.6);
      float v = 1.0-smoothstep(0.0,0.95,length(q));
      vec3 a = mix(vec3(.030,.034,.045), vec3(.008,.022,.050), uX);
      vec3 b = mix(vec3(.160,.160,.175), vec3(.030,.110,.210), uX);
      gl_FragColor = vec4(mix(a,b,v*v),1.0); }`
}));
bg.renderOrder = -10; scene.add(bg);

// floor: shadow catcher + soft contact shadow
{ const f = new THREE.Mesh(new THREE.CircleGeometry(80, 64), new THREE.ShadowMaterial({ opacity: 0.45 })); f.rotation.x = -Math.PI / 2; f.receiveShadow = true; scene.add(f);
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const r = g.createRadialGradient(64, 64, 20, 64, 64, 64); r.addColorStop(0, 'rgba(0,0,0,.75)'); r.addColorStop(.7, 'rgba(0,0,0,.3)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  const ao = new THREE.Mesh(new THREE.PlaneGeometry(44, 44), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  ao.rotation.x = -Math.PI / 2; ao.position.y = 0.03; scene.add(ao); }

// ---------- clip planes: scan sweeps along x (left -> right) ----------
let SCAN = -24;
const planeS = new THREE.Plane(new THREE.Vector3(1, 0, 0), -SCAN);  // solid: keep x > scan
const planeX = new THREE.Plane(new THREE.Vector3(-1, 0, 0), SCAN);  // x-ray: keep x < scan

const XV = `#include <clipping_planes_pars_vertex>
varying vec3 vN; varying vec3 vV; varying vec3 vW;
void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vW = wp.xyz; vec4 mvPosition = viewMatrix*wp;
  vN = normalize(normalMatrix*normal); vV = normalize(-mvPosition.xyz); gl_Position = projectionMatrix*mvPosition;
  #include <clipping_planes_vertex>
}`;
const XF = `#include <clipping_planes_pars_fragment>
uniform vec3 uC; uniform float uB, uG, uA, uScan;
varying vec3 vN; varying vec3 vV; varying vec3 vW;
void main(){
  #include <clipping_planes_fragment>
  float f = pow(1.0-abs(dot(normalize(vN),normalize(vV))), 2.2);
  float s = 0.82+0.18*sin(vW.z*14.0);
  float band = exp(-abs(vW.x-uScan)*1.4)*1.6;
  gl_FragColor = vec4(uC*((uB+uG*f)*s + band*(0.35+f))*uA, 1.0); }`;
const XMATS = [];
function xrayMat(color, base, gain) {
  const m = new THREE.ShaderMaterial({ uniforms: { uC: { value: new THREE.Color(color) }, uB: { value: base }, uG: { value: gain }, uA: { value: 0 }, uScan: { value: SCAN } },
    vertexShader: XV, fragmentShader: XF, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, clipping: true });
  m.clippingPlanes = [planeX]; XMATS.push(m); return m;
}
const EDGEM = [];
function edgeMat(color, op) { const m = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
  m.clippingPlanes = [planeX]; m.userData.op = op; EDGEM.push(m); return m; }
const shellGroup = new THREE.Group(); scene.add(shellGroup);
function shell(geo, solidMat, pos, xr = [0.05, 0.9], edgeAngle = 20, edgeOp = 0.5, parent = shellGroup) {
  const g = new THREE.Group(); g.position.copy(pos);
  const s = solidMat.clone(); s.clippingPlanes = [planeS]; s.clipShadows = true; s.side = THREE.DoubleSide;
  const ms = new THREE.Mesh(geo, s); ms.castShadow = true; ms.receiveShadow = true; g.add(ms);
  g.add(new THREE.Mesh(geo, xrayMat('#3aa8ff', xr[0], xr[1])));
  if (edgeAngle) g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, edgeAngle), edgeMat('#8fe0ff', edgeOp)));
  parent.add(g); return g;
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- materials ----------
const shellM = new THREE.MeshPhysicalMaterial({ color: '#eceef0', roughness: 0.32, metalness: 0.0, clearcoat: 0.8, clearcoatRoughness: 0.2 });
const darkM = new THREE.MeshPhysicalMaterial({ color: '#202329', roughness: 0.4, clearcoat: 0.6, clearcoatRoughness: 0.3 });
const steel = new THREE.MeshStandardMaterial({ color: '#c9ccd1', metalness: 1, roughness: 0.28 });
const rubber = new THREE.MeshStandardMaterial({ color: '#17181b', roughness: 0.85 });
const plastic = new THREE.MeshStandardMaterial({ color: '#2a2d33', roughness: 0.6 });

// ---------- SHELL (robot body 35 cm, top at y = 9) ----------
const RAD = 17.5;
// top cover (white)
shell(new THREE.CylinderGeometry(RAD - 0.4, RAD, 6.2, 72, 1, false), shellM, V(0, 5.6, 0), [0.04, 0.9], 30, 0.5);
// lid ring + glossy dark top panel
{ const g = new THREE.CylinderGeometry(RAD - 1.2, RAD - 0.6, 0.35, 72); shell(g, darkM, V(0, 8.85, 0), [0.03, 0.8], 30, 0.35); }
// chassis bottom (dark)
shell(new THREE.CylinderGeometry(RAD, RAD - 0.6, 2.2, 72), plastic, V(0, 1.6, 0), [0.04, 0.8], 30, 0.35);
// front bumper strip (arc)
{ const g = new THREE.CylinderGeometry(RAD + 0.25, RAD + 0.25, 3.2, 64, 1, true, -Math.PI * 0.42, Math.PI * 0.84); shell(g, darkM, V(0, 4.0, 0), [0.04, 0.8], 0, 0); }
// LiDAR turret housing (on top, toward the front)
const LZ = -3.5;
shell(new THREE.CylinderGeometry(4.0, 4.2, 2.6, 48), shellM, V(0, 10.3, LZ), [0.05, 1.1], 30, 0.55);
shell(new THREE.CylinderGeometry(4.25, 4.25, 0.25, 48), darkM, V(0, 11.65, LZ), [0.04, 0.9], 30, 0.4);
// power button
{ const b = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.15, 32), new THREE.MeshStandardMaterial({ color: '#9aa0a8', metalness: .8, roughness: .3 }));
  b.position.set(0, 9.08, -4); b.material.clippingPlanes = [planeS]; scene.add(b); }

// ---------- INSIDE (solid lit parts, revealed by the scan) ----------
const inner = new THREE.Group(); scene.add(inner);
const cast = m => { m.castShadow = true; m.receiveShadow = true; return m; };
const addIn = (geo, mat, x, y, z, p = inner) => { const m = cast(new THREE.Mesh(geo, mat)); m.position.set(x, y, z); p.add(m); return m; };
// inner floor pan

// LiDAR spinning module (inside turret)
const lidar = new THREE.Group(); lidar.position.set(0, 10.2, LZ); inner.add(lidar);
{ const base = cast(new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 1.6, 40), new THREE.MeshStandardMaterial({ color: '#1b1d22', roughness: .5 }))); lidar.add(base);
  const lens = cast(new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 0.5), new THREE.MeshPhysicalMaterial({ color: '#301010', roughness: .1, clearcoat: 1 }))); lens.position.set(0, 0.1, 3.1); lidar.add(lens);
  const lens2 = cast(new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.7, 0.5), new THREE.MeshPhysicalMaterial({ color: '#101830', roughness: .1, clearcoat: 1 }))); lens2.position.set(0, 0.1, -3.1); lidar.add(lens2); }
const beamM = new THREE.MeshBasicMaterial({ color: '#ff3b2f', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
const beam = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 3), beamM); beam.rotation.x = -Math.PI / 2; beam.position.set(0, 0.1, 3.3 + 1.5); lidar.add(beam);
const dotM = new THREE.MeshBasicMaterial({ color: '#ff4b3a', toneMapped: false, transparent: true, opacity: 0 });
const ldot = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 8), dotM); ldot.position.set(0, 0.1, 3.4); lidar.add(ldot);
// battery pack (lithium-ion, centre, under the board)
const batG = new THREE.Group(); batG.position.set(0, 4.3, 5.0); batG.rotation.y = Math.PI / 2; inner.add(batG);
{ const wrap = new THREE.MeshPhysicalMaterial({ color: '#2f7bd6', roughness: .35, clearcoat: 1, clearcoatRoughness: .2 });
  for (let i = 0; i < 4; i++) { const c = cast(new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 6.5, 28), wrap)); c.rotation.z = Math.PI / 2; c.position.set(0, 0, -2.85 + i * 1.9); batG.add(c);
    for (const s of [1, -1]) { const cap = cast(new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.12, 24), steel)); cap.rotation.z = Math.PI / 2; cap.position.set(s * 3.3, 0, -2.85 + i * 1.9); batG.add(cap); } }
  const strap = cast(new THREE.Mesh(new THREE.BoxGeometry(6.9, 0.25, 7.8), new THREE.MeshStandardMaterial({ color: '#111', roughness: .8 }))); strap.position.y = -1.0; batG.add(strap);
  for (const s of [1, -1]) { const tab = cast(new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.6, 7.4), steel)); tab.position.set(s * 3.42, 0, 0); batG.add(tab); } }
// circuit board above the battery, toward the back
const pcbM = new THREE.MeshStandardMaterial({ color: '#14603a', roughness: .5, metalness: .1 });
addIn(new RoundedBoxGeometry(11, 0.18, 6.5, 2, 0.06), pcbM, 0, 6.7, -6.8);
addIn(new THREE.BoxGeometry(1.8, 0.3, 1.8), new THREE.MeshStandardMaterial({ color: '#15161a', roughness: .35 }), -1.5, 6.9, -6.8);
addIn(new THREE.BoxGeometry(1.4, 0.4, 1.4), new THREE.MeshStandardMaterial({ color: '#d7dadf', metalness: 1, roughness: .22 }), 2.5, 6.95, -7.6);
for (let i = 0; i < 10; i++) addIn(new THREE.BoxGeometry(R(.3, .6), 0.2, R(.2, .4)), rnd() < .5 ? new THREE.MeshStandardMaterial({ color: '#2a241d', roughness: .5 }) : steel, R(-4.8, 4.8), 6.88, R(-9.4, -4.4));
// dust bin (rear) - smoky translucent box with dust inside
const binM = new THREE.MeshPhysicalMaterial({ color: '#8a6a3a', roughness: .15, transmission: 0, transparent: true, opacity: .55, clearcoat: 1 });
const bin = addIn(new RoundedBoxGeometry(17, 5.2, 5.2, 3, 0.8), binM, 0, 5.0, -12.2);
bin.scale.set(1, 1, 1);
const dustPile = addIn(new THREE.BoxGeometry(14.5, 1.0, 3.8), new THREE.MeshStandardMaterial({ color: '#8d877d', roughness: 1 }), 0, 2.95, -12.2);
// suction fan (next to the bin)
const fanG = new THREE.Group(); fanG.position.set(-9.5, 5.4, -6.5); inner.add(fanG);
{ const can = cast(new THREE.Mesh(new THREE.CylinderGeometry(2.0, 2.0, 2.6, 32), plastic)); fanG.add(can);
  const ring = cast(new THREE.Mesh(new THREE.TorusGeometry(2.0, 0.18, 8, 32), steel)); ring.rotation.x = Math.PI / 2; ring.position.y = 1.3; fanG.add(ring); }
const fanBl = new THREE.Group(); fanBl.position.y = 1.35; fanG.add(fanBl);
for (let i = 0; i < 7; i++) { const b = cast(new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 0.45), steel)); b.position.x = 0.9; const p = new THREE.Group(); p.rotation.y = i / 7 * Math.PI * 2; p.add(b); fanBl.add(p); }
// drive wheels (left / right)
const wheels = [];
for (const s of [-1, 1]) { const g = new THREE.Group(); g.position.set(s * 12.3, 3.4, -0.5); inner.add(g);
  const tire = cast(new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 2.4, 40), rubber)); tire.rotation.z = Math.PI / 2; g.add(tire);
  const hub = cast(new THREE.Mesh(new THREE.CylinderGeometry(2.0, 2.0, 2.5, 6), new THREE.MeshStandardMaterial({ color: '#3a3d44', roughness: .4, metalness: .4 }))); hub.rotation.z = Math.PI / 2; g.add(hub);
  for (let k = 0; k < 14; k++) { const tr = cast(new THREE.Mesh(new THREE.BoxGeometry(2.45, 0.3, 0.5), rubber)); const p = new THREE.Group(); p.rotation.x = k / 14 * Math.PI * 2; tr.position.y = 3.4; p.add(tr); g.add(p); }
  const mot = cast(new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 3.2, 24), steel)); mot.rotation.z = Math.PI / 2; mot.position.set(-s * 3.0, 0.6, 0); g.add(mot);
  wheels.push(g); }
// main brush roll (front-middle, across x), bristles in a helix
const brush = new THREE.Group(); brush.position.set(0, 1.9, 10.5); inner.add(brush);
{ const core = cast(new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 17, 24), new THREE.MeshStandardMaterial({ color: '#d7d9dc', roughness: .5 }))); core.rotation.z = Math.PI / 2; brush.add(core);
  const brM = new THREE.MeshStandardMaterial({ color: '#ff7a2a', roughness: .7 });
  for (const ph of [0, Math.PI]) for (let i = 0; i < 34; i++) { const x = -8 + i * 16 / 33, a = ph + x * 0.42;
    const b = cast(new THREE.Mesh(new THREE.BoxGeometry(0.42, 1.1, 0.42), brM)); const p = new THREE.Group(); p.position.x = x; p.rotation.x = a; b.position.y = 1.35; p.add(b); brush.add(p); }
  for (const s of [-1, 1]) { const e = cast(new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.4, 24), plastic)); e.rotation.z = Math.PI / 2; e.position.x = s * 8.7; brush.add(e); } }
// side brush (front right corner, under the chassis edge)
const side = new THREE.Group(); side.position.set(10.2, 0.7, 11.6); inner.add(side);
{ const hub = cast(new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.6, 20), plastic)); side.add(hub);
  const bm = new THREE.MeshStandardMaterial({ color: '#ff7a2a', roughness: .7 });
  for (let i = 0; i < 3; i++) { const p = new THREE.Group(); p.rotation.y = i / 3 * Math.PI * 2; side.add(p);
    for (let k = 0; k < 5; k++) { const b = cast(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.04, 5.6, 6), bm)); b.rotation.z = Math.PI / 2 - 0.12; b.rotation.y = (k - 2) * 0.05; b.position.set(3.4, -0.25, 0); p.add(b); } } }
// cliff sensors (small dark windows on the underside edge)
for (const a of [-0.9, -0.3, 0.3, 0.9]) addIn(new THREE.BoxGeometry(1.2, 0.3, 0.6), new THREE.MeshPhysicalMaterial({ color: '#0d0d10', roughness: .1, clearcoat: 1 }), Math.sin(a) * 15.5, 0.6, Math.cos(a) * 15.5);

// ---------- crumbs on the floor in front (get sucked in when the motors start) ----------
const NC = 60, crumbs = [];
const crumbG = new THREE.Group(); scene.add(crumbG);
const crumbM = [new THREE.MeshStandardMaterial({ color: '#c8b48a', roughness: .9 }), new THREE.MeshStandardMaterial({ color: '#7d6c56', roughness: .9 })];
for (let i = 0; i < NC; i++) { const m = cast(new THREE.Mesh(new THREE.DodecahedronGeometry(R(.18, .38), 0), crumbM[i % 2]));
  const c = { x: R(-8, 8), z: R(20, 28), d: R(0, .5), r: R(0, 6), m }; m.position.set(c.x, 0.2, c.z); m.rotation.set(c.r, c.r * 2, 0); crumbG.add(m); crumbs.push(c); }

// ---------- scan sheet ----------
const sheetTex = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 64, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 256); const gy = g.createLinearGradient(0, 0, 0, 256);
  gy.addColorStop(0, 'rgba(0,0,0,1)'); gy.addColorStop(.2, 'rgba(0,0,0,0)'); gy.addColorStop(.8, 'rgba(0,0,0,0)'); gy.addColorStop(1, 'rgba(0,0,0,1)');
  g.globalCompositeOperation = 'destination-out'; g.fillStyle = gy; g.fillRect(0, 0, 64, 256); return new THREE.CanvasTexture(c); })();
const sheetM = new THREE.MeshBasicMaterial({ map: sheetTex, color: '#59c8ff', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false });
const sheet = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 46), sheetM); sheet.rotation.x = -Math.PI / 2; scene.add(sheet);
const sheetV = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshBasicMaterial({ map: sheetTex, color: '#2a7fd0', transparent: true, opacity: .25, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));
sheetV.rotation.y = Math.PI / 2; scene.add(sheetV);

// ---------- dust motes in the air ----------
const softTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const NP = 90, motes = [], dpos = new Float32Array(NP * 3);
for (let i = 0; i < NP; i++) motes.push([R(-30, 30), R(0, 30), R(-25, 30), R(0, 6.28), R(.15, .4)]);
const dGeo = new THREE.BufferGeometry(); dGeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
scene.add(new THREE.Points(dGeo, new THREE.PointsMaterial({ map: softTex, size: 0.4, color: '#9fd6ff', transparent: true, opacity: .45, depthWrite: false, blending: THREE.AdditiveBlending })));

// ---------- lights ----------
scene.add(new THREE.HemisphereLight('#c9d6ea', '#2a2622', 0.55));
const key = new THREE.DirectionalLight('#fff1e0', 2.6); key.position.set(-40, 70, 45); key.castShadow = true;
Object.assign(key.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 20, far: 200 });
key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.04; key.shadow.radius = 5;
scene.add(key);
const rimL = new THREE.DirectionalLight('#9cc8ff', 1.7); rimL.position.set(50, 25, -50); scene.add(rimL);
const binGlow = new THREE.PointLight('#ffb35a', 0, 22, 2); binGlow.position.set(0, 9, -12); scene.add(binGlow);

// ---------- camera: slow orbit + push-in, close ----------
const PIV = V(0, 3.5, 1.5);
function setCam(t) {
  const u = cl(t / DUR), s = 0.3 * u + 0.7 * eio(u);
  const az = -0.38 + 0.46 * s, el = 0.86 - 0.10 * s, d = 150 - 20 * s;
  camera.position.set(PIV.x + Math.sin(az) * Math.cos(el) * d, PIV.y + Math.sin(el) * d, PIV.z + Math.cos(az) * Math.cos(el) * d);
  camera.lookAt(PIV.x, PIV.y, PIV.z); camera.setViewOffset(W, H, 0, 40, W, H); camera.updateMatrixWorld();
}

// ---------- labels ----------
const svg = document.getElementById('lines');
const P = { lid: document.getElementById('pLid'), bat: document.getElementById('pBat'), bin: document.getElementById('pBin'), br: document.getElementById('pBr') };
const tv = new THREE.Vector3();
function proj(x, y, z) { tv.set(x, y, z).project(camera); return [(tv.x + 1) / 2 * W, (1 - tv.y) / 2 * H]; }
function pill(el, x, y, a, sc) { el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.opacity = a; el.style.transform = `translate(-50%,-50%) scale(${sc})`; }
function leader(ax, ay, bx, by, a, col) { return a <= 0.001 ? '' : `<g opacity="${a}"><line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${col}" stroke-width="3"/><circle cx="${bx}" cy="${by}" r="9" fill="${col}"/><circle cx="${bx}" cy="${by}" r="18" fill="none" stroke="${col}" stroke-width="2" opacity=".6"/></g>`; }

// ---------- timing ----------
const T_S0 = 0.35, T_S1 = 2.4;     // scan sweep left -> right
const T_ON = 3.4;                  // motors start: brushes spin, crumbs get pulled in
function render(t) {
  t = cl(t, 0, DUR);
  setCam(t);
  const rr = ramp(t, T_S0, T_S1), sp = 0.4 * rr + 0.6 * sm(rr); SCAN = -21 + 42 * sp;
  planeS.constant = -SCAN; planeX.constant = SCAN;
  const xa = ramp(t, T_S0 - 0.1, T_S0 + 0.2);
  XMATS.forEach(m => { m.uniforms.uA.value = xa; m.uniforms.uScan.value = SCAN; });
  EDGEM.forEach(m => m.opacity = m.userData.op * xa);
  const sheetA = sm(ramp(t, T_S0 - 0.15, T_S0 + 0.15)) * (1 - sm(ramp(t, T_S1 - 0.25, T_S1 + 0.1)));
  sheet.visible = sheetV.visible = sheetA > 0.001; sheetM.opacity = sheetA; sheetV.material.opacity = 0.28 * sheetA;
  sheet.position.set(SCAN, 12.5, 0); sheetV.position.set(SCAN, 6, 0);
  const xr = sm(ramp(t, T_S0, T_S1 + 0.3)); bgU.uX.value = xr; renderer.toneMappingExposure = 1.0 + 0.08 * xr;
  // lidar always turning slowly, faster when on
  const on = sm(ramp(t, T_ON, T_ON + 0.6));
  const spinT = (u) => u * 1.2 + on * (u - T_ON) * 5.5; // integrated angle-ish
  lidar.rotation.y = spinT(t);
  beamM.opacity = 0.55 * sm(ramp(t, 2.6, 3.0)); dotM.opacity = sm(ramp(t, 2.6, 3.0));
  // brushes, fan, wheels
  const run = Math.max(0, t - T_ON); const runE = run < 0.6 ? run * run / 1.2 : run - 0.3;
  brush.rotation.x = runE * 14; side.rotation.y = -runE * 9; fanBl.rotation.y = runE * 40;
  wheels.forEach(w => w.rotation.x = 0);
  binGlow.intensity = 5 * sm(ramp(t, 4.6, 5.2));
  dustPile.scale.y = 1 + 0.6 * sm(ramp(t, 4.2, 6.0)); dustPile.position.y = 2.95 + 0.3 * sm(ramp(t, 4.2, 6.0));
  // crumbs pulled toward the brush roll (z = 6)
  for (const c of crumbs) { const k = ramp(t, T_ON + 0.1 + c.d, T_ON + 1.5 + c.d), e = k * k * k;
    const z = c.z + (10.0 - c.z) * e, x = c.x * (1 - 0.3 * e); c.m.position.set(x, 0.2 + 0.4 * e, z); c.m.rotation.x = c.r + e * 12; c.m.visible = k < 0.98; }
  // motes
  for (let i = 0; i < NP; i++) { const d = motes[i]; dpos[i * 3] = d[0] + Math.sin(t * d[4] + d[3]) * 0.8 + t * 0.2; dpos[i * 3 + 1] = d[1] + t * d[4] * 0.6; dpos[i * 3 + 2] = d[2]; }
  dGeo.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);
  // labels (fixed columns, leaders to projected anchors)
  const aL = sm(ramp(t, 1.0, 1.4)), aB = sm(ramp(t, 1.7, 2.1)), aN = sm(ramp(t, 2.3, 2.7)), aR = sm(ramp(t, T_ON + 0.1, T_ON + 0.5));
  const [lx, ly] = proj(0, 11.6, LZ), [bx, by] = proj(0, 5.3, 5.0), [nx, ny] = proj(5.5, 7.0, -12.2), [rx, ry] = proj(-5.5, 2.4, 10.9);
  const LL = [300, 330], LB = [cl(bx - 200, 220, W - 220), 1330], LN = [800, 420], LR = [cl(rx - 60, 260, W - 260), 1450];
  pill(P.lid, LL[0], LL[1], aL, 0.85 + 0.15 * popS(ramp(t, 1.0, 1.45)));
  pill(P.bat, LB[0], LB[1] - 0, aB * (1 - aR), 0.85 + 0.15 * popS(ramp(t, 1.7, 2.15)));
  pill(P.bin, LN[0], LN[1], aN, 0.85 + 0.15 * popS(ramp(t, 2.3, 2.75)));
  pill(P.br, LR[0], LR[1], aR, 0.85 + 0.15 * popS(ramp(t, T_ON + 0.1, T_ON + 0.55)));
  svg.innerHTML = leader(LL[0], LL[1] + 34, lx, ly, aL, '#7fd4ff') + leader(LB[0], LB[1] - 34, bx, by, aB * (1 - aR), '#7fd4ff')
    + leader(LN[0], LN[1] + 34, nx, ny, aN, '#7fd4ff') + leader(LR[0], LR[1] - 34, rx, ry, aR, '#ffb547');
}
window.renderAt = t => render(t);
window.draw = render;
const q = new URLSearchParams(location.search);
await Promise.race([document.fonts.load('800 44px "Inter"'), new Promise(r => setTimeout(r, 1500))]);
render(q.has('t') ? parseFloat(q.get('t')) : 5.5);
requestAnimationFrame(() => { document.title = 'ok'; });
</script>
</body>
