<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Zoom into a hair follicle</title>
<!-- body66 r1: /zoom-in a hair follicle. Skin cross-section drawn in code (2D canvas), simplified, not to scale.
  Facts (American Academy of Dermatology; Cleveland Clinic "Hair follicle"): each hair grows from a follicle; cells in the bulb at the
  bottom divide and push the hair up; a sebaceous (oil) gland opens into the follicle; the arrector pili muscle pulls the hair upright
  (goosebumps); scalp hair grows about half an inch (~1.3 cm) a month (AAD: about six inches a year). -->
<script src="common2d.js"></script></head><body>
<div id="stage"><canvas id="cv" width="1080" height="1920"></canvas><div id="ov"><svg id="lines" width="1080" height="1920"></svg>
<div class="pill" id="pFo">Hair follicle</div><div class="pill hot" id="pOi">Oil gland</div>
<div class="pill" id="pBu">Root bulb<small>new cells push the hair up</small></div><div class="pill red" id="pMu">Tiny muscle = goosebumps</div>
<div class="pill" id="pGr">About ½ inch a month</div></div></div>
<script>
const cv = document.getElementById('cv'), g = cv.getContext('2d'), svg = document.getElementById('lines'); const R = mulberry32(661);
const SY = 520;           // skin surface
const off = (w, h, f) => { const c = document.createElement('canvas'); c.width = w; c.height = h; f(c.getContext('2d'), w, h); return c; };
// follicle axis: from (Fx0,SY) to bulb (Fx1,By)
const Fx0 = 520, Fx1 = 600, By = 1380;
const fx = y => Fx0 + (Fx1 - Fx0) * (y - SY) / (By - SY);
const TIS = off(1600, 2400, (c, w, h) => { c.translate(260, 300);  // scene coords: x -260..1340, y -300..2100
  const dg = c.createLinearGradient(0, SY, 0, 2000); dg.addColorStop(0, '#f0b6a2'); dg.addColorStop(0.45, '#e39a8a'); dg.addColorStop(0.75, '#d88a7c'); dg.addColorStop(1, '#f2d38a');
  c.fillStyle = dg; c.fillRect(-260, SY, 1600, 1800);
  // fat lobules at the bottom
  for (let i = 0; i < 70; i++) { const x = -260 + R() * 1600, y = 1560 + R() * 500; c.fillStyle = `rgba(255,${226 + R() * 20 | 0},${150 + R() * 40 | 0},.85)`; c.strokeStyle = 'rgba(200,150,90,.6)'; c.lineWidth = 3; c.beginPath(); c.ellipse(x, y, 50 + R() * 40, 40 + R() * 30, R() * 3, 0, 7); c.fill(); c.stroke(); }
  // collagen
  for (let i = 0; i < 1100; i++) { const x = -260 + R() * 1600, y = SY + 120 + R() * 1000, l = 40 + R() * 120, a = (R() - .5) * 0.8; c.strokeStyle = `rgba(255,${215 + R() * 35 | 0},210,${0.08 + R() * 0.14})`; c.lineWidth = 2 + R() * 5; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + l * .5 * Math.cos(a), y + l * .5 * Math.sin(a) + 10 * (R() - .5), x + l * Math.cos(a), y + l * Math.sin(a)); c.stroke(); }
  // epidermis cells
  for (let row = 0; row < 9; row++) { const yy = SY + row * 11 + 4, hh = 10 + row * 0.6; let x = -260 - R() * 30; while (x < 1340) { const ww = 26 + R() * 26 - row * 1.2, sh = 0.82 + 0.18 * R();
    c.fillStyle = `rgb(${(240 - row * 3) * sh | 0},${(200 - row * 6) * sh | 0},${(176 - row * 5) * sh | 0})`; c.beginPath(); c.roundRect(x + 1, yy, ww - 2, hh, 5); c.fill(); x += ww; } }
  c.strokeStyle = 'rgba(150,60,60,.35)'; c.lineWidth = 3; c.beginPath(); for (let x = -260; x <= 1340; x += 8) c.lineTo(x, SY + 104 + 8 * Math.sin(x * 0.03)); c.stroke();
  // background follicles (small, faint)
  for (const [x0, x1] of [[120, 160], [900, 960]]) { c.fillStyle = 'rgba(150,80,60,.35)'; c.beginPath(); c.moveTo(x0 - 18, SY); c.lineTo(x1 - 26, 1180); c.lineTo(x1 + 26, 1180); c.lineTo(x0 + 18, SY); c.fill(); c.beginPath(); c.ellipse(x1, 1200, 38, 46, 0, 0, 7); c.fill(); }
  // capillaries
  c.strokeStyle = 'rgba(190,30,50,.55)'; c.lineWidth = 7; for (let k = 0; k < 4; k++) { c.beginPath(); let x = -260, y = 700 + k * 230 + R() * 60; c.moveTo(x, y); while (x < 1340) { x += 60; y += (R() - .5) * 40; c.lineTo(x, y); } c.stroke(); }
});
function follicle(t, lift) {
  // outer root sheath
  g.save(); g.lineJoin = 'round';
  const sheath = new Path2D(); sheath.moveTo(fx(SY) - 46, SY); sheath.lineTo(fx(By - 120) - 52, By - 120); sheath.bezierCurveTo(fx(By) - 120, By - 40, fx(By) - 70, By + 110, fx(By), By + 110); sheath.bezierCurveTo(fx(By) + 70, By + 110, fx(By) + 120, By - 40, fx(By - 120) + 52, By - 120); sheath.lineTo(fx(SY) + 46, SY); sheath.closePath();
  const sg = g.createLinearGradient(fx(By) - 100, 0, fx(By) + 100, 0); sg.addColorStop(0, '#c9786a'); sg.addColorStop(0.5, '#f1c0a8'); sg.addColorStop(1, '#c9786a'); g.fillStyle = sg; g.fill(sheath);
  g.strokeStyle = 'rgba(120,50,40,.6)'; g.lineWidth = 4; g.stroke(sheath);
  // dermal papilla with capillary loop
  g.fillStyle = '#e88a8a'; g.beginPath(); g.ellipse(fx(By), By + 60, 40, 48, 0, 0, 7); g.fill();
  g.strokeStyle = '#c4162a'; g.lineWidth = 6; g.beginPath(); g.moveTo(fx(By) - 12, By + 200); g.quadraticCurveTo(fx(By) - 26, By + 50, fx(By), By + 30); g.quadraticCurveTo(fx(By) + 26, By + 50, fx(By) + 12, By + 200); g.stroke();
  // dividing cells in the bulb (pulse)
  for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI, r = 62 + 8 * Math.sin(t * 6 + i); const x = fx(By) + Math.cos(a) * r, y = By + 60 - Math.sin(a) * r * 0.9;
    g.fillStyle = `rgba(255,220,190,${0.7 + 0.3 * Math.sin(t * 5 + i)})`; g.beginPath(); g.arc(x, y, 9 + 2 * Math.sin(t * 7 + i * 2), 0, 7); g.fill(); }
  g.restore();
  // hair shaft: from the bulb up through the skin and out; pivots at the surface when the muscle pulls (lift 0..1)
  const ang = -0.62 + 0.5 * lift; const grow = 26 * t;   // slow push upward
  g.save(); g.lineCap = 'round';
  g.strokeStyle = '#3a2214'; g.lineWidth = 30; g.beginPath(); g.moveTo(fx(By), By + 10); g.lineTo(fx(SY), SY); g.stroke();
  g.strokeStyle = '#5a3620'; g.lineWidth = 12; g.beginPath(); g.moveTo(fx(By) - 4, By + 10); g.lineTo(fx(SY) - 4, SY); g.stroke();
  const L = 560 + grow; g.translate(fx(SY), SY); g.rotate(ang);
  g.strokeStyle = '#3a2214'; g.lineWidth = 28; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-10, -L * 0.5, 14, -L); g.stroke();
  g.strokeStyle = 'rgba(160,110,70,.6)'; g.lineWidth = 6; g.beginPath(); g.moveTo(-5, 0); g.quadraticCurveTo(-15, -L * 0.5, 9, -L); g.stroke();
  for (let k = 0; k < 18; k++) { const y = -k * L / 18; g.strokeStyle = 'rgba(20,10,5,.5)'; g.lineWidth = 2; g.beginPath(); g.moveTo(-14, y); g.lineTo(12, y - 8); g.stroke(); }
  g.restore();
  // sebaceous gland (lobed) on the right side, ~y 760
  const gx = fx(760) + 46, gy = 760;
  g.save(); const gg = g.createRadialGradient(gx + 60, gy, 10, gx + 60, gy, 110); gg.addColorStop(0, '#fff2b0'); gg.addColorStop(1, '#e6b84a'); g.fillStyle = gg; g.strokeStyle = 'rgba(150,100,30,.8)'; g.lineWidth = 3;
  for (const [dx, dy, r] of [[50, -40, 46], [95, 0, 50], [55, 45, 46], [20, 5, 34]]) { g.beginPath(); g.arc(gx + dx, gy + dy, r, 0, 7); g.fill(); g.stroke(); }
  // oil droplets travelling into the follicle
  for (let i = 0; i < 6; i++) { const u = (t * 0.5 + i / 6) % 1; g.fillStyle = `rgba(255,236,140,${0.9 * Math.sin(u * Math.PI)})`; g.beginPath(); g.arc(gx + 40 - 60 * u, gy - 20 - 140 * u, 7, 0, 7); g.fill(); }
  g.restore();
  // arrector pili muscle: from follicle (y 960) up-right to the epidermis base; thicker when it contracts
  const mx0 = fx(980) + 26, my0 = 980, mx1 = 820, my1 = SY + 120; const th = 22 + 14 * lift;
  g.save(); g.lineCap = 'round'; const mg = g.createLinearGradient(mx0, my0, mx1, my1); mg.addColorStop(0, '#b8303a'); mg.addColorStop(1, '#e06a6a'); g.strokeStyle = mg; g.lineWidth = th;
  g.beginPath(); g.moveTo(mx0, my0); g.quadraticCurveTo((mx0 + mx1) / 2 + 40 * (1 - lift), (my0 + my1) / 2, mx1, my1); g.stroke();
  g.strokeStyle = 'rgba(255,200,200,.35)'; g.lineWidth = 3; for (let k = -2; k <= 2; k++) { g.beginPath(); g.moveTo(mx0 + k * 4, my0); g.quadraticCurveTo((mx0 + mx1) / 2 + 40 * (1 - lift) + k * 4, (my0 + my1) / 2, mx1 + k * 4, my1); g.stroke(); }
  g.restore();
  // goosebump: skin bulge at the hair when lifted
  if (lift > 0) { g.fillStyle = `rgba(240,190,170,${lift})`; g.beginPath(); g.ellipse(fx(SY) + 70, SY + 2, 90, 26 * lift, 0, Math.PI, 0); g.fill(); }
  return { gland: [gx + 70, gy], bulb: [fx(By), By + 40], muscle: [(mx0 + mx1) / 2 + 20, (my0 + my1) / 2], shaft: [fx(SY) + Math.sin(-ang) * -300, SY - Math.cos(ang) * 300], foll: [fx(900) - 40, 900] };
}
function render(t) {
  t = cl(t, 0, DUR);
  g.setTransform(1, 0, 0, 1, 0, 0); const air = g.createLinearGradient(0, 0, 0, SY); air.addColorStop(0, '#141a22'); air.addColorStop(1, '#2a3038'); g.fillStyle = '#141a22'; g.fillRect(0, 0, W, H);
  // camera: start wide at the skin, zoom in and drift down along the follicle
  const a = eio(ramp(t, 0.0, 5.8)); const z = 0.78 + 0.42 * a; const fxp = 560, fyp = 560 + 520 * a;
  g.setTransform(z, 0, 0, z, 540 - fxp * z, 900 - fyp * z);
  g.fillStyle = air; g.fillRect(-400, -600, 1900, SY + 600);
  g.drawImage(TIS, -260, -300);
  const lift = sm(ramp(t, 3.6, 4.2)) * (1 - 0.25 * sm(ramp(t, 5.4, 6.3)));
  const P = follicle(t, lift);
  g.setTransform(1, 0, 0, 1, 0, 0);
  const vv = g.createRadialGradient(540, 900, 300, 540, 900, 1150); vv.addColorStop(0, 'rgba(0,0,0,0)'); vv.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = vv; g.fillRect(0, 0, W, H);
  const S = p => [540 + (p[0] - fxp) * z, 900 + (p[1] - fyp) * z];
  LABEL(svg, [
    { id: 'pFo', t0: 0.5, t1: 2.4, pos: [280, 1250], at: S(P.foll) },
    { id: 'pOi', t0: 1.5, pos: [830, 470], at: S(P.gland), col: '#ffb547' },
    { id: 'pBu', t0: 2.5, pos: [300, 1480], at: S(P.bulb) },
    { id: 'pMu', t0: 3.6, pos: [640, 1000], at: S(P.muscle), col: '#ff4a4a' },
    { id: 'pGr', t0: 4.6, pos: [330, 330] },
  ], t);
}
READY(render);
</script></body></html>
