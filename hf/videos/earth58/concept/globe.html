const S=+(new URLSearchParams(location.search).get('s')||0);

// ---------------- GL ----------------
const cv=document.getElementById('gl'); const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});
const VS=`#version 300 es

function sh(t,s){ const x=gl.createShader(t); gl.shaderSource(x,s); gl.compileShader(x); if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }

const tx=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tx); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,W,H,0,gl.RGBA,gl.FLOAT,P);

  } else {

    g.globalAlpha=a; shadowText(g,'WATER LEVEL',92,322,"700 40px "+FS_,'rgba(210,228,245,.95)');
    shadowText(g,(sea>-1?'0':'−'+fmt(-sea))+' m',88,420,"800 104px "+FS_,'#fff'); g.globalAlpha=1;
    pill(g,540,1240,'Avg ocean depth ≈ 3.7 km','average ocean depth · NOAA',Math.min(CL((t-2.0)/0.45),1-CL((t-4.3)/0.4)));
    // trench pin
    const wq=planetToWorld(spin,llv(DLAT,DLON)); const pp=project(wq.map(x=>x*1.0));
    const pa=CL((t-4.9)/0.4);
    if(pa>0&&visible(wq)){ const [x,y]=pp; g.save(); g.globalAlpha=pa; g.strokeStyle='#ff5a3c'; g.lineWidth=5; g.beginPath(); g.arc(x,y,16+10*Math.sin(t*6),0,7); g.stroke();
      g.fillStyle='#ff5a3c'; g.beginPath(); g.arc(x,y,8,0,7); g.fill(); g.beginPath(); if(y<760){g.moveTo(x,y+26); g.lineTo(x,y+90);} else {g.moveTo(x,y-26); g.lineTo(x,y-120);} g.stroke(); g.restore();
      pill(g,Math.max(330,Math.min(750,x)),y<760?y+90:y-250,'Mariana Trench ≈ 11 km','the last water left · Challenger Deep',pa,'#ff5a3c'); }
  }
}
window.draw=draw; window.DEEP=[DLAT,DLON];
document.fonts.load("800 58px 'Fira Sans'").then(()=>{ draw(0); document.title='ok'; });
</script></body></html>
