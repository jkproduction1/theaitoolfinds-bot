<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Underwater volcano erupting</title>
<!-- earth68 r1: /simulate an underwater volcano erupting. Procedural ocean + particle plume (own look), inspired by Hunga Tonga-Hunga Ha'apai,
  15 Jan 2022. Facts: NASA Earth Observatory "Tonga Volcano Plume Reached the Mesosphere": plume rose to 57 km (35 mi), into the mesosphere.
  Heights in km, true vertical scale for the plume; time sped up. -->
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head>
<body>
<div id="stage">
  <div id="ov">
    <svg id="lines" width="1080" height="1920"></svg>
    <div class="pill hot" id="pMa">Magma meets seawater</div>
    <div class="pill red" id="pHi">Plume: 57 km<small>35 miles high</small></div>
    <div class="pill" id="pMe">Into the mesosphere</div>
    <div id="note">inspired by Hunga Tonga, 2022 · time sped up</div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { W, H, DUR, cl, ramp, sm, eio, eout, V, mulberry32, setup, softTex, labels, injectCSS, ready } from './studio.js';
injectCSS();
document.head.insertAdjacentHTML('beforeend','<style>.pill small{display:block;font-size:31px;font-weight:600;color:#cfd6e0;margin-top:2px;text-align:center}.pill{text-align:center}#note{position:absolute;left:0;right:0;top:1525px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:26px;color:rgba(220,225,235,.65)}</style>');
const { renderer, scene, camera, bgU } = setup(36, [.10, .13, .19], [.52, .58, .66]);
camera.far = 5000; camera.updateProjectionMatrix();
const rnd = mulberry32(68); const R = (a, b) => a + rnd() * (b - a);
// ---- ocean (km), CPU-displaced: small swell + shock ring
const OG = new THREE.PlaneGeometry(600, 600, 200, 200); OG.rotateX(-Math.PI / 2);
const op = OG.attributes.position, ox = Float32Array.from({ length: op.count }, (_, i) => op.getX(i)), oz = Float32Array.from({ length: op.count }, (_, i) => op.getZ(i));
const ocean = new THREE.Mesh(OG, new THREE.MeshStandardMaterial({ color: '#1a4466', roughness: 0.15, metalness: 0.1, envMapIntensity: 0.9 }));
scene.add(ocean);
scene.add(new THREE.HemisphereLight('#c9d8ee', '#0a1420', 0.9));
const sunL = new THREE.DirectionalLight('#ffe2c0', 2.2); sunL.position.set(300, 120, 80); scene.add(sunL);
// glowing vent
const vent = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex(), color: '#ff8a3c', transparent: true, opacity: .9, depthWrite: false, blending: THREE.AdditiveBlending }));
vent.position.set(0, 0.6, 0); vent.scale.setScalar(7); scene.add(vent);
// ---- plume particles
const N = 6500, T0 = -1.2;
const P = new Float32Array(N * 3), C = new Float32Array(N * 3), S = new Float32Array(N), A = new Float32Array(N);
const birth = new Float32Array(N), ang = new Float32Array(N), rr = new Float32Array(N), kind = new Float32Array(N), sp = new Float32Array(N);
for (let i = 0; i < N; i++) { birth[i] = T0 + (DUR + 0.2 - T0) * Math.pow(rnd(), 1.15); ang[i] = R(0, Math.PI * 2); rr[i] = Math.pow(rnd(), 0.6); kind[i] = i < 1500 ? 1 : 0; sp[i] = R(0.8, 1.2); }
const PG = new THREE.BufferGeometry();
PG.setAttribute('position', new THREE.BufferAttribute(P, 3)); PG.setAttribute('color', new THREE.BufferAttribute(C, 3));
PG.setAttribute('size', new THREE.BufferAttribute(S, 1)); PG.setAttribute('alpha', new THREE.BufferAttribute(A, 1));
const PM = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { map: { value: softTex() } },
  vertexShader: `attribute float size; attribute float alpha; attribute vec3 color; varying vec3 vC; varying float vA;
    void main(){ vC=color; vA=alpha; vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=size*900./(-mv.z); gl_Position=projectionMatrix*mv; }`,
  fragmentShader: `uniform sampler2D map; varying vec3 vC; varying float vA; void main(){ vec4 m=texture2D(map,gl_PointCoord); gl_FragColor=vec4(vC, m.a*vA); }` });
const plume = new THREE.Points(PG, PM); plume.frustumCulled = false; scene.add(plume);
const HT = 57;
const col = new THREE.Color(), dark = new THREE.Color('#4a4440'), light = new THREE.Color('#e9e6e0'), steam = new THREE.Color('#ffffff'), hot = new THREE.Color('#ff9a50');
function updPlume(t) {
  for (let i = 0; i < N; i++) {
    const age = t - birth[i]; let a = 0, x = 0, y = 0, z = 0, s = 1;
    if (age > 0) {
      if (kind[i]) { // base spray / steam skirt
        const u = cl(age / 2.2); const r = 3 + 26 * eout(u) * rr[i]; y = 9 * Math.sin(Math.PI * Math.min(1, u * 1.1)) * (1 - rr[i] * 0.5);
        x = Math.cos(ang[i]) * r; z = Math.sin(ang[i]) * r; s = 1.0 + 3.2 * u; a = (1 - u) * 0.3; col.copy(steam);
      } else {
        const tau = 1.9 * sp[i]; const h = HT * (1 - Math.exp(-age / tau)) * (0.93 + 0.1 * rr[i]);
        const top = sm(cl((h - 40) / 16));
        const r = (2.5 + h * 0.2) * rr[i] + top * 30 * Math.sqrt(rr[i]) * eout(cl((age - 1.5) / 4));
        const sw = Math.sin(ang[i] * 3 + age * 0.6) * 1.2;
        x = Math.cos(ang[i] + age * 0.12) * r + sw; z = Math.sin(ang[i] + age * 0.12) * r; y = h + 2 * Math.sin(ang[i] * 5 + age);
        s = 5 + h * 0.2 + top * 6; a = 0.3 * sm(cl(age / 0.25));
        const lit = cl(0.45 + 0.5 * (x / Math.max(4, r + 4)) + 0.3 * (y / HT));
        col.copy(dark).lerp(light, lit);
        if (y < 6) col.lerp(hot, 0.35 * (1 - y / 6));
      }
    }
    P[i * 3] = x; P[i * 3 + 1] = y; P[i * 3 + 2] = z; S[i] = s; A[i] = a; C[i * 3] = col.r; C[i * 3 + 1] = col.g; C[i * 3 + 2] = col.b;
  }
  PG.attributes.position.needsUpdate = PG.attributes.color.needsUpdate = PG.attributes.size.needsUpdate = PG.attributes.alpha.needsUpdate = true;
}
function updOcean(t) {
  const rs = 6 + 32 * (t + 1.2), amp = 0.9;
  for (let i = 0; i < op.count; i++) { const x = ox[i], z = oz[i], d = Math.hypot(x, z);
    let y = 0.18 * Math.sin(x * 0.21 + t * 1.3) + 0.14 * Math.sin(z * 0.27 - t * 1.1);
    y += amp * Math.exp(-Math.pow((d - rs) / 3.5, 2)) * Math.max(0.2, 1 - d / 280);
    y += 2.2 * Math.exp(-d * d / 40) * sm(cl(t + 1));
    op.setY(i, y); }
  op.needsUpdate = true; OG.computeVertexNormals();
}
// ---- ruler at 57 km
const ruler = new THREE.Group(); scene.add(ruler);
const rl = new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0 });
const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(-70, HT, 0), V(70, HT, 0)]), new THREE.LineDashedMaterial({ color: '#ff4a4a', dashSize: 3, gapSize: 2, transparent: true, opacity: 0 }));
line.computeLineDistances(); ruler.add(line);
// ---- camera: low near the vent, then pull back + up to the full column
function setCam(t) { const a = eio(ramp(t, 0.6, 5.8)), u = cl(t / DUR);
  const dist = 44 + 225 * a, yaw = 0.55 - 0.25 * a + 0.04 * u;
  const camY = 4 + 20 * a; const lookY = 7 + 22 * a;
  camera.position.set(Math.sin(yaw) * dist, camY, Math.cos(yaw) * dist); camera.lookAt(0, lookY, 0); camera.updateMatrixWorld(); }
const E = id => document.getElementById(id);
const lab = labels(camera, [
  { el: E('pMa'), t0: 0.45, t1: 3.2, at: () => [0, 1.5, 0], col: '#ffb547', pos: (x, y) => [cl(x + 60, 330, 750), cl(y + 220, 300, 1480)] },
  { el: E('pHi'), t0: 3.3, at: () => [-30, HT, 0], col: '#ff4a4a', pos: (x, y) => [cl(x - 20, 330, 750), cl(y - 190, 250, 1400)] },
  { el: E('pMe'), t0: 4.3, at: () => [30, HT + 1, 0], pos: (x, y) => [cl(x + 40, 330, 750), cl(y + 200, 300, 1450)] },
]);
function render(t) { t = cl(t, 0, DUR); setCam(t); updOcean(t); updPlume(t);
  vent.material.opacity = 0.9 * (0.75 + 0.25 * Math.sin(t * 9)); vent.scale.setScalar(6 + Math.sin(t * 5));
  line.material.opacity = 0.9 * sm(ramp(t, 3.1, 3.6));
  renderer.render(scene, camera); lab(t);
  document.getElementById('note').style.opacity = sm(ramp(t, 0.5, 1.0)); }
await ready(render);
</script>
</body>
</html>
